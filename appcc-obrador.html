<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>APPCC · Panificadora Salduba</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bitter:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F7F1E6;
    --panel:#FFFFFF;
    --ink:#2A241D;
    --ink-soft:#75695A;
    --wheat:#F25012;
    --wheat-dark:#C93E0C;
    --wheat-tint:#FCE3D6;
    --ok:#4C7A4A;
    --ok-tint:#E4EEDE;
    --warn:#B4841A;
    --warn-tint:#F6EBCF;
    --danger:#B0402E;
    --danger-tint:#F5E1DC;
    --line:#E6DBC6;
    --sidebar:#231814;
    --sidebar-soft:#B8A990;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Inter',sans-serif;
    background:var(--bg);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.brand,.stamp{font-family:'Bitter',serif;}
  .mono{font-family:'IBM Plex Mono',monospace;}
  #app{display:flex;min-height:100vh;}

  /* SIDEBAR */
  .sidebar{
    width:236px;flex:none;background:var(--sidebar);color:#EFE7D8;
    display:flex;flex-direction:column;position:sticky;top:0;height:100vh;
  }
  .sidebar-head{padding:22px 20px 16px;border-bottom:1px solid rgba(255,255,255,0.08);position:relative;overflow:hidden;}
  .logo-frame{background:#fff;border-radius:10px;padding:8px 12px;display:inline-block;box-shadow:0 2px 6px rgba(0,0,0,0.25);}
  .logo-frame img{width:56px;height:auto;display:block;}
  .wheat-mark{width:26px;height:26px;color:var(--wheat);}
  .brand{font-size:17px;font-weight:700;margin-top:8px;letter-spacing:0.2px;}
  .brand small{display:block;font-family:'Inter',sans-serif;font-size:11px;font-weight:500;color:var(--sidebar-soft);letter-spacing:0.6px;text-transform:uppercase;margin-top:3px;}
  nav.navlist{flex:1;padding:14px 10px;overflow-y:auto;}
  .navitem{
    display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:8px;
    color:#DAD0BC;font-size:13.5px;font-weight:500;cursor:pointer;margin-bottom:2px;
    border-left:3px solid transparent;transition:background .12s ease;
  }
  .navitem svg{width:18px;height:18px;flex:none;opacity:.85;}
  .navitem:hover{background:rgba(255,255,255,0.06);}
  .navitem.active{background:rgba(185,118,47,0.18);border-left-color:var(--wheat);color:#fff;}
  .sidebar-foot{padding:14px 20px 18px;font-size:11px;color:var(--sidebar-soft);border-top:1px solid rgba(255,255,255,0.08);line-height:1.5;}

  /* MAIN */
  .main{flex:1;min-width:0;display:flex;flex-direction:column;}
  .topbar{
    background:var(--panel);border-bottom:1px solid var(--line);
    padding:18px 30px;display:flex;align-items:baseline;justify-content:space-between;
    position:sticky;top:0;z-index:5;
  }
  .topbar h1{font-size:21px;margin:0;font-weight:600;}
  .topbar .date{font-size:12.5px;color:var(--ink-soft);}
  .content{padding:26px 30px 60px;max-width:1180px;}
  .view{display:none;}
  .view.active{display:block;}

  /* CARDS / PANELS */
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:20px 22px;margin-bottom:20px;}
  .panel h2{font-size:15.5px;margin:0 0 14px;font-weight:600;display:flex;align-items:center;gap:8px;}
  .panel h2 svg{width:17px;height:17px;color:var(--wheat);}
  .hint{font-size:12px;color:var(--ink-soft);margin:-8px 0 16px;}

  /* FORM */
  form.record-form{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px;align-items:end;}
  .field{display:flex;flex-direction:column;gap:5px;font-size:12.5px;font-weight:600;color:var(--ink-soft);}
  .field.wide{grid-column:1 / -1;}
  .field input,.field select,.field textarea{
    font-family:'Inter',sans-serif;font-size:13.5px;color:var(--ink);
    border:1px solid var(--line);border-radius:7px;padding:8px 10px;background:#FDFBF6;
  }
  .field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--wheat);outline-offset:0;border-color:var(--wheat);}
  .field textarea{resize:vertical;min-height:42px;font-family:'Inter',sans-serif;}
  .field.checkline{flex-direction:row;align-items:center;gap:8px;font-weight:500;}
  .field.checkline input{width:16px;height:16px;}
  .checkgroup{display:flex;flex-wrap:wrap;gap:8px 16px;}
  .checkgroup label{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:500;color:var(--ink);}
  .checkgroup input{width:15px;height:15px;}
  .form-actions{grid-column:1/-1;display:flex;justify-content:flex-end;margin-top:2px;}

  button{font-family:'Inter',sans-serif;cursor:pointer;}
  .btn{
    background:var(--wheat);color:#fff;border:none;border-radius:7px;
    padding:9px 18px;font-size:13px;font-weight:600;letter-spacing:.2px;
  }
  .btn:hover{background:var(--wheat-dark);}
  .btn.secondary{background:transparent;color:var(--wheat-dark);border:1px solid var(--wheat);}
  .btn.secondary:hover{background:var(--wheat-tint);}
  .btn.danger{background:transparent;color:var(--danger);border:1px solid var(--danger);}
  .btn.danger:hover{background:var(--danger-tint);}
  .btn.small{padding:5px 10px;font-size:11.5px;border-radius:6px;}

  /* TABLE */
  table{width:100%;border-collapse:collapse;font-size:12.8px;}
  thead th{
    text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;
    color:var(--ink-soft);border-bottom:1px solid var(--line);padding:8px 10px;font-weight:600;
  }
  tbody td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top;}
  tbody tr:hover{background:#FBF6EC;}
  .table-wrap{overflow-x:auto;}
  .empty-row td{color:var(--ink-soft);font-style:italic;text-align:center;padding:22px;}

  .inv-folder{border:1px solid var(--line);border-radius:8px;margin-bottom:8px;overflow:hidden;background:var(--panel);}
  .inv-folder summary{cursor:pointer;list-style:none;padding:11px 14px;display:flex;align-items:center;justify-content:space-between;gap:12px;background:#FBF6EC;flex-wrap:wrap;}
  .inv-folder summary::-webkit-details-marker{display:none;}
  .inv-folder-title{font-weight:600;font-size:13.5px;display:flex;align-items:center;gap:6px;}
  .inv-arrow{display:inline-block;transition:transform .12s ease;color:var(--wheat);}
  .inv-folder[open] .inv-arrow{transform:rotate(90deg);}
  .inv-folder-meta{display:flex;align-items:center;gap:10px;}
  .inv-folder-body{padding:10px 14px 14px;}

  .badge{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700;letter-spacing:.2px;}
  .badge.ok{background:var(--ok-tint);color:var(--ok);}
  .badge.warn{background:var(--warn-tint);color:var(--warn);}
  .badge.danger{background:var(--danger-tint);color:var(--danger);}

  /* DASHBOARD */
  .dash-hero{
    display:flex;justify-content:space-between;align-items:center;gap:24px;
    background:var(--sidebar);color:#EFE7D8;border-radius:var(--radius);padding:24px 28px;margin-bottom:22px;
    position:relative;overflow:hidden;
  }
  .dash-hero h2{color:#fff;font-size:20px;margin:0 0 6px;}
  .dash-hero p{margin:0;font-size:13px;color:var(--sidebar-soft);max-width:440px;line-height:1.5;}
  .stamp{
    flex:none;width:118px;height:118px;border-radius:50%;
    border:3px double currentColor;display:flex;align-items:center;justify-content:center;
    text-align:center;font-weight:700;font-size:13px;letter-spacing:1px;text-transform:uppercase;
    transform:rotate(-9deg);line-height:1.3;
  }
  .stamp.ok{color:#8CD08A;}
  .stamp.danger{color:#E79486;}

  .grid-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;margin-bottom:22px;}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;}
  .card-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px;}
  .card-top svg{width:19px;height:19px;color:var(--wheat);}
  .card h3{font-size:13.5px;margin:0;font-weight:600;}
  .card .metric{font-family:'IBM Plex Mono',monospace;font-size:26px;font-weight:600;margin:2px 0 4px;}
  .card .sub{font-size:11.5px;color:var(--ink-soft);}

  .wheat-divider{display:flex;align-items:center;gap:8px;margin:26px 0 14px;color:var(--wheat);}
  .wheat-divider svg{width:16px;height:16px;}
  .wheat-divider span{font-size:11px;text-transform:uppercase;letter-spacing:1.2px;color:var(--ink-soft);font-weight:600;}
  .wheat-divider::after{content:"";flex:1;height:1px;background:var(--line);}

  .settings-list{display:flex;flex-direction:column;gap:8px;margin-bottom:12px;}
  .settings-row{display:flex;gap:8px;align-items:center;}
  .settings-row input{flex:1;font-family:'Inter',sans-serif;font-size:13px;padding:7px 9px;border:1px solid var(--line);border-radius:6px;background:#FDFBF6;}
  .settings-row input.small{flex:none;width:80px;}

  .filters{display:flex;flex-wrap:wrap;gap:12px;align-items:end;margin-bottom:16px;}

  ::-webkit-scrollbar{width:9px;height:9px;}
  ::-webkit-scrollbar-thumb{background:var(--line);border-radius:6px;}

  @media(max-width:880px){
    #app{flex-direction:column;}
    .sidebar{width:100%;height:auto;position:relative;flex-direction:row;overflow-x:auto;}
    .sidebar-head{display:none;}
    nav.navlist{display:flex;padding:8px;}
    .navitem{white-space:nowrap;border-left:none;border-bottom:3px solid transparent;}
    .navitem.active{border-left-color:transparent;border-bottom-color:var(--wheat);}
    .sidebar-foot{display:none;}
    .content{padding:18px 16px 50px;}
    .dash-hero{flex-direction:column;align-items:flex-start;}
  }
  @media(prefers-reduced-motion:reduce){*{transition:none!important;}}

  /* ===== DOSSIER DE INSPECCIÓN ===== */
  #dossier{margin-top:14px;}
  .hoja{background:#fff;color:#111;border:1px solid #d8d2c4;border-radius:8px;padding:18px 16px;margin:0 0 16px;overflow-x:auto;}
  .hoja-cab{display:flex;align-items:flex-start;gap:12px;border-bottom:2px solid #111;padding-bottom:8px;margin-bottom:10px;}
  .hoja-emp{font-size:11px;line-height:1.35;flex:none;max-width:210px;}
  .hoja-tit{flex:1;text-align:center;}
  .hoja-tit h3{margin:0;font-size:15px;text-transform:uppercase;letter-spacing:.5px;}
  .hoja-sub{font-size:12px;margin-top:2px;}
  .hoja-cod{flex:none;font-size:11px;border:1px solid #111;padding:3px 7px;border-radius:4px;white-space:nowrap;}
  .hoja table.rejilla{width:100%;border-collapse:collapse;font-size:11px;}
  .hoja table.rejilla th,.hoja table.rejilla td{border:1px solid #999;padding:3px 4px;vertical-align:top;}
  .hoja table.rejilla th{background:#f0ece2;font-weight:600;text-align:center;}
  td.semanas{letter-spacing:.3px;}
  table.papel-lotes td.celda-lote .sem{display:block;font-size:8px;color:#333;letter-spacing:.3px;margin-top:1px;}
  .cierre-linea{display:inline-flex;gap:6px;align-items:center;}
  .cierre-linea input[type=date]{font-size:12px;padding:3px 5px;}
  table.papel-aceite td{height:15px;}
  table.papel-aceite th{font-size:8px;line-height:1.15;padding:2px 3px;vertical-align:middle;}
  table.papel-aceite th.grupo-cab{background:#ddd6c6;letter-spacing:.3px;}
  table.papel-aceite td.dia{background:#f4f1e9;font-weight:700;}
  table.papel-aceite tr.con-datos td{background:#fffdf6;}
  table.papel-aceite tr.con-datos td.dia{background:#efeade;}
  table.papel-limpieza{table-layout:fixed;width:100%;margin-bottom:14px;}
  table.papel-limpieza th{font-size:10px;padding:4px 3px;}
  table.papel-limpieza td{font-size:10px;padding:3px 4px;height:18px;word-break:break-word;}
  table.papel-limpieza td.lim-el{width:17%;font-weight:600;}
  table.papel-limpieza td.lim-frec{width:14%;color:#555;font-size:9px;}
  table.papel-limpieza td.lim-dias{width:16%;}
  .hoja h4.lim-sala{margin:14px 0 5px;font-size:12px;letter-spacing:.6px;color:#1f4e79;text-transform:uppercase;}
  .hoja-limpieza h4.lim-sala:first-of-type{margin-top:6px;}
  table.papel-transporte{table-layout:fixed;width:100%;}
  table.papel-transporte th,table.papel-transporte td{font-size:9px;padding:2px 1px;text-align:center;height:20px;}
  table.papel-transporte .trans-rot{width:13%;text-align:left;font-weight:600;font-size:10px;padding-left:5px;
    background:#f0ece2;}
  table.papel-lotes{table-layout:fixed;}
  table.papel-lotes th.banda{text-align:right;font-size:12px;letter-spacing:.5px;padding:5px 8px;background:#e6e0d2;}
  table.papel-lotes td{font-size:10px;padding:2px 4px;height:15px;}
  table.papel-lotes td.celda-prod{width:21%;font-weight:600;text-transform:uppercase;font-size:10px;
    vertical-align:middle;line-height:1.25;word-break:break-word;hyphens:auto;}
  .hoja-lotes.ancha table.papel-lotes td.celda-prod{width:15%;}
  .hoja-lotes.ancha table.papel-lotes td{font-size:9px;padding:2px 3px;}
  .hoja-lotes.ancha table.papel-lotes td.celda-lote{font-size:8px;}
  .hoja-lotes.ancha table.papel-lotes td.rot{font-size:7px;}
  /* los lotes largos se parten en dos líneas antes que perderse cortados */
  table.papel-lotes td.celda-lote{font-size:9px;color:#666;line-height:1.2;word-break:break-word;}
  table.papel-lotes td.celda-lote .ml{color:#111;font-weight:700;font-size:10px;letter-spacing:.2px;}
  table.papel-lotes td.rot{font-size:8px;color:#666;text-align:left;}
  table.papel-lotes td.fec{text-align:center;font-weight:600;}
  table.papel-lotes tbody.bloque-prod{border-bottom:2px solid #666;}
  .hoja.ancha table.rejilla{font-size:10px;}
  .hoja.ancha table.rejilla th{font-size:9px;line-height:1.15;}
  .hoja table.rejilla td.n{text-align:center;}
  .hoja table.rejilla td.prod{text-align:left;white-space:nowrap;}
  .hoja table.rejilla td.tot{font-weight:700;background:#f7f4ec;}
  .hoja table.rejilla td.malo{background:#ffd9d9;font-weight:700;}
  .hoja table.rejilla tr.grupo td{background:#e6e0d2;font-weight:700;text-transform:uppercase;font-size:10px;}
  .hoja .lim{font-weight:400;font-size:9px;}
  .hoja .pie-nota{font-size:10px;margin:6px 0 0;color:#444;}
  .hoja .firma{margin-top:14px;font-size:11px;}
  .hoja.portada{text-align:center;padding:60px 20px;}
  .hoja.portada h1{font-size:24px;margin:0 0 24px;}
  .hoja.portada .port-emp{font-size:14px;line-height:1.7;}
  .hoja.portada .port-rango{font-size:15px;margin-top:26px;font-weight:600;}
  .hoja.portada .port-fecha{font-size:12px;color:#555;margin-top:30px;}
  .hoja-vacia{padding:14px;font-size:13px;}

  @media print{
    @page{size:A4 portrait;margin:11mm 9mm;}
    html,body{background:#fff!important;color:#000!important;width:100%!important;margin:0!important;}
    .sidebar,.topbar,.no-print{display:none!important;}
    #app{display:block!important;width:100%!important;height:auto!important;}
    .content{display:block!important;padding:0!important;margin:0!important;max-width:none!important;width:100%!important;overflow:visible!important;}
    .view,.panel{display:none!important;}
    #view-informes{display:block!important;}
    #dossier{display:block!important;margin:0;width:100%!important;}
    #dossier .hoja{display:block!important;border:none;border-radius:0;padding:0;margin:0;
      break-after:page;page-break-after:always;break-inside:auto;overflow:visible;
      width:100%!important;max-width:none!important;}
    #dossier .hoja:last-child{break-after:auto;page-break-after:auto;}
    #dossier .hoja.ancha{page:apaisada;}
    #dossier table.rejilla thead{display:table-header-group;}
    #dossier table.rejilla tr{break-inside:avoid;page-break-inside:avoid;}
    #dossier table.papel-lotes tbody.bloque-prod{break-inside:avoid;page-break-inside:avoid;}
    #dossier table.papel-lotes th.banda{background:#e6e0d2!important;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
    #dossier .firma{break-inside:avoid;page-break-inside:avoid;}
    #dossier table.rejilla th{background:#eee!important;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
    #dossier table.rejilla tr.grupo td,#dossier table.rejilla td.malo,#dossier table.rejilla td.tot{
      -webkit-print-color-adjust:exact;print-color-adjust:exact;}
  }
  @page apaisada{size:A4 landscape;margin:9mm;}
</style>
</head>
<body>
<div id="app">
  <aside class="sidebar">
    <div class="sidebar-head">
      <div class="logo-frame"><img src="logo-salduba.png" alt="Salduba"></div>
      <div class="brand" style="margin-top:6px;"><small>Sistema APPCC</small></div>
    </div>
    <nav class="navlist" id="navlist"></nav>
    <div class="sidebar-foot" id="sidebarFoot">Cargando datos de la empresa…</div>
  </aside>

  <main class="main">
    <div class="topbar">
      <h1 id="viewTitle">Panel general</h1>
      <div class="date mono" id="topDate"></div>
    </div>
    <div class="content" id="content"></div>
  </main>
</div>

<script>
/* ---------- CONFIG & STORAGE ---------- */
const APP_VERSION = '2026-09-24-e';
const STORE_KEYS = {
  config:'config',
  temperaturas:'records:temperaturas',
  limpieza:'records:limpieza',
  agua:'records:agua',
  recepcion:'records:recepcion',
  alergenos:'records:alergenos',
  alergenosTienda:'records:alergenosTienda',
  aceite:'records:aceite',
  trazabilidad:'records:trazabilidad',
  lotesMP:'records:lotesMP',
  mantenimiento:'records:mantenimiento',
  plagas:'records:plagas',
  transporte:'records:transporte',
  noconformidades:'records:noconformidades',
  pedidosManual:'records:pedidosManual',
  produccion:'records:produccion',
};
let CONFIG = null;
let DATA = {temperaturas:{},limpieza:[],agua:[],recepcion:[],alergenos:[],alergenosTienda:[],aceite:[],trazabilidad:[],lotesMP:[],mantenimiento:[],plagas:[],transporte:[],noconformidades:[],pedidosManual:[],produccion:[]};

/* Los cuadernos de papel del obrador, tal cual: cada registro con sus productos
   agrupados igual que en la hoja impresa, para que quien los rellena reconozca
   la lista de un vistazo. Se pueden añadir o quitar desde Ajustes. */
const PRODUCCION_VER = 2;
const LOTES_VER = 2;
const PRODUCCION_DEF = {

/* ---------- ALMACENAMIENTO INDEPENDIENTE (IndexedDB) ---------- */
const HAS_CLAUDE_STORAGE = (typeof window!=='undefined' && window.storage && typeof window.storage.get==='function');
const LocalStore = {
  dbPromise:null,
  openDB(){
    if(this.dbPromise) return this.dbPromise;
    this.dbPromise = new Promise((resolve,reject)=>{
      const req = indexedDB.open('appcc_salduba_db', 1);
      req.onupgradeneeded = ()=>{ if(!req.result.objectStoreNames.contains('kv')) req.result.createObjectStore('kv'); };
      req.onsuccess = ()=>resolve(req.result);
      req.onerror = ()=>reject(req.error);
    });
    return this.dbPromise;
  },
  async get(key){
    try{
      const db = await this.openDB();
      return await new Promise((resolve,reject)=>{
        const tx = db.transaction('kv','readonly');
        const req = tx.objectStore('kv').get(key);
        req.onsuccess = ()=>resolve(req.result);
        req.onerror = ()=>reject(req.error);
      });
    }catch(e){ console.error('IndexedDB get error', e); return undefined; }
  },
  async set(key, value){
    try{
      const db = await this.openDB();
      await new Promise((resolve,reject)=>{
        const tx = db.transaction('kv','readwrite');
        tx.objectStore('kv').put(value, key);
        tx.oncomplete = ()=>resolve();
        tx.onerror = ()=>reject(tx.error);
      });
      return true;
    }catch(e){ console.error('IndexedDB set error', e); return false; }
  },
  async delete(key){
    try{
      const db = await this.openDB();
      await new Promise((resolve,reject)=>{
        const tx = db.transaction('kv','readwrite');
        tx.objectStore('kv').delete(key);
        tx.oncomplete = ()=>resolve();
        tx.onerror = ()=>reject(tx.error);
      });
    }catch(e){ console.error('IndexedDB delete error', e); }
  }
};
const Store = {
  async get(key){
    if(HAS_CLAUDE_STORAGE){
      try{ const r = await window.storage.get(key, true); return r ? r.value : undefined; }catch(e){ /* cae a local */ }
    }
    return await LocalStore.get(key);
  },
  async set(key, value){
    if(HAS_CLAUDE_STORAGE){
      try{ await window.storage.set(key, value, true); return true; }catch(e){ /* cae a local */ }
    }
    return await LocalStore.set(key, value);
  },
  async delete(key){
    if(HAS_CLAUDE_STORAGE){
      try{ await window.storage.delete(key, true); return; }catch(e){ /* cae a local */ }
    }
    await LocalStore.delete(key);
  }
};

/* ---- CONFIGURAR OTRO DISPOSITIVO ----
   El enlace lleva dentro la dirección del Apps Script y la clave de la IA, que
   son las dos cosas que no se pueden escribir en el código porque el repositorio
   es público. Con el QR se pasa al móvil sin teclear nada. */
/* ---- ESTADO DE ESTE DISPOSITIVO ----
   Tres cosas tienen que estar bien para que la app funcione entera: que guarde
   en Drive, que tenga la clave de la IA, y que la IA conteste de verdad. */
function lineaEstado(ok, titulo, detalle){
  const color = ok===true ? 'var(--ok)' : (ok===false ? '#c0392b' : '#b7791f');
  const icono = ok===true ? '✅' : (ok===false ? '❌' : '⏳');
  return `<p style="margin:6px 0;font-size:15px;color:${color};">${icono} <strong>${esc(titulo)}</strong>`
       + (detalle ? `<br><span class="hint" style="color:var(--muted);">${detalle}</span>` : '') + '</p>';
}
function pintarEstadoDispositivo(extra){
  const host = document.getElementById('estadoDispositivo');
  if(!host) return;
  const drive = !!getAppsScriptUrl();
  const clave = !!getGeminiKey();
  const registros = Object.keys(DATA).reduce((n,k)=>n + (Array.isArray(DATA[k]) ? DATA[k].length : Object.keys(DATA[k]||{}).length), 0);
  host.innerHTML =
    lineaEstado(drive, drive ? 'Guarda en tu Google Drive' : 'NO guarda en Drive',
      drive ? esc(SYNC.estado) : 'Los registros se quedan solo en este aparato y no los ves desde los demás. Escanea el código de configuración desde el ordenador.')
    + lineaEstado(clave, clave ? 'Puede leer albaranes con la IA' : 'NO puede leer albaranes',
      clave ? 'La clave está guardada en este aparato.' : 'Falta la clave de IA. Escanea el código de configuración desde el ordenador.')
    + lineaEstado(registros > 0, registros + ' registros en este aparato',
      registros > 0 ? 'Si el número cuadra con el del ordenador, la sincronización va bien.' : 'No hay ningún registro todavía.')
    + lineaEstado(null, 'Versión de la app: ' + APP_VERSION, 'Si no coincide con la del ordenador, este aparato tiene una copia vieja; ciérrala y vuelve a abrirla.')
    + (function(){
        const u = ultimoErrorIA();
        if(!u) return '';
        return lineaEstado(null, 'Último fallo de la IA',
          esc(fmtDate(String(u.cuando).slice(0,10))) + ' ' + esc(String(u.cuando).slice(11,16)) + ' — ' + esc(u.mensaje));
      })()
    + (extra || '');
}
async function comprobarDispositivo(){
  let extra = '';
  if(getAppsScriptUrl()){
    try{ await sincronizar('comprobación'); }catch(e){}
  }
  if(getGeminiKey()){
    /* Se le manda una imagen de un píxel: basta para ver si la clave responde. */
    try{
      const c = document.createElement('canvas'); c.width=8; c.height=8;
      const ctx = c.getContext('2d'); ctx.fillStyle='#fff'; ctx.fillRect(0,0,8,8);
      const b64 = c.toDataURL('image/jpeg',0.5).split(',')[1];
      const t = await preguntarIADocumentos([{base64:b64, mime:'image/jpeg'}], 'Responde solo con la palabra OK.');
      extra = lineaEstado(/ok/i.test(t), /ok/i.test(t) ? 'La IA contesta correctamente' : 'La IA ha contestado algo raro', esc(String(t).slice(0,80)));
    }catch(err){
      extra = lineaEstado(false, 'La IA no contesta', esc(err.message));
    }
  }
  pintarEstadoDispositivo(extra);
}
function enlaceConfiguracion(){
  const u = getAppsScriptUrl(), k = getGeminiKey();
  if(!u && !k) return '';
  let e = location.origin + location.pathname + '?v=' + Date.now().toString(36);
  if(u) e += '&sync=' + encodeURIComponent(u);
  if(k) e += '&ia=' + encodeURIComponent(k);
  return e;
}
function cargarLibreriaQr(){
  if(window.QRCode) return Promise.resolve(true);
  return new Promise(res=>{
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js';
    s.onload = ()=>res(!!window.QRCode);
    s.onerror = ()=>res(false);
    document.head.appendChild(s);
  });
}
async function mostrarQrConfig(){
  const enlace = enlaceConfiguracion();
  const caja = document.getElementById('qrConfigCaja');
  const host = document.getElementById('qrConfig');
  if(!caja || !host) return;
  if(!enlace){
    alert('Este dispositivo todavía no tiene configurada ni la sincronización con Drive ni la clave de IA, así que no hay nada que pasar a otro aparato.');
    return;
  }
  caja.style.display = '';
  document.getElementById('verQrConfigBtn').style.display = 'none';
  document.getElementById('ocultarQrConfigBtn').style.display = '';
  document.getElementById('qrConfigTexto').value = enlace;
  host.innerHTML = '<p class="hint">Generando el código…</p>';
  const ok = await cargarLibreriaQr();
  if(!ok){
    host.innerHTML = '<p class="hint">No se ha podido cargar el generador de códigos (¿sin internet?). Usa el enlace de abajo.</p>';
    return;
  }
  host.innerHTML = '';
  try{
    new QRCode(host, {text: enlace, width: 240, height: 240, correctLevel: QRCode.CorrectLevel.L});
  }catch(err){
    host.innerHTML = '<p class="hint">No se ha podido dibujar el código: '+esc(err.message)+'. Usa el enlace de abajo.</p>';
  }
}

async function loadAll(){
  try{
    const c = await Store.get(STORE_KEYS.config);
    CONFIG = c ? JSON.parse(c) : defaultConfig();
  }catch(e){ CONFIG = defaultConfig(); }
  /* Ajustes guardados antes de que existieran estos cuadernos: se les añaden
     los catálogos sin tocar nada de lo que ya tuviera configurado. */
  /* PRODUCCION_VER sube cada vez que se corrige la lista de productos para que
     cuadre con la hoja de papel. Mientras no la hayas tocado tú, se actualiza sola. */
  if(!CONFIG.produccion || (CONFIG.produccionVer||0) < PRODUCCION_VER){
    CONFIG.produccion = JSON.parse(JSON.stringify(PRODUCCION_DEF));
    CONFIG.produccionVer = PRODUCCION_VER;
  }
  if(!CONFIG.catalogoLotes || (CONFIG.catalogoLotesVer||0) < LOTES_VER){
    CONFIG.catalogoLotes = JSON.parse(JSON.stringify(CATALOGO_LOTES_DEF));
    CONFIG.catalogoLotesVer = LOTES_VER;
  }
  /* Equivalencias de nombres y productos nuevos, revisados con Berta. Se añaden
     sin pisar lo que ella haya cambiado a mano después. */
  if((CONFIG.aliasVer||0) < ALIAS_VER){
    CONFIG.aliasProductos = Object.assign({}, ALIAS_PRODUCTOS_DEF, CONFIG.aliasProductos||{});
    const cat = CONFIG.catalogoLotes = CONFIG.catalogoLotes || {pasteleria:[], bajaRotacion:[], materiales:[]};
    Object.keys(CATALOGO_NUEVOS_DEF).forEach(seccion=>{
      cat[seccion] = cat[seccion] || [];
      CATALOGO_NUEVOS_DEF[seccion].forEach(n=>{
        if(!cat[seccion].some(x=>normTxt(x)===normTxt(n))) cat[seccion].push(n);
      });
    });
    Object.keys(cat).forEach(seccion=>{
      cat[seccion] = (cat[seccion]||[]).filter(n=>
        !CATALOGO_RETIRADOS_DEF.some(v=>normTxt(v)===normTxt(n)));
    });
    CONFIG.aliasVer = ALIAS_VER;
  }
  for(const mod of Object.keys(DATA)){
    try{
      const r = await Store.get(STORE_KEYS[mod]);
      DATA[mod] = r ? JSON.parse(r) : (mod==='temperaturas' ? {} : []);
    }catch(e){ DATA[mod] = (mod==='temperaturas' ? {} : []); }
  }
  /* Los lotes que se pasaron del papel traían las semanas pegadas al código.
     Se separan aquí; si ya vienen separados no se toca nada. */
  if(migrarPlagasDeMantenimiento() > 0){
    await saveModuleLocal('plagas');
    await saveModuleLocal('mantenimiento');
  }
  let arreglados = normalizarLotes();
  const nom = normalizarNombresLotes();
  arreglados += nom.tocados;
  if(nom.fundidos) await guardarBajas();
  if(arreglados > 0) await saveModuleLocal('lotesMP');
}

/* ================= SINCRONIZACIÓN AUTOMÁTICA (Google Drive vía Apps Script) =================
   Los registros de autocontrol no pueden vivir solo en la tablet: son el registro
   sanitario. Aquí se guardan solos en tu Google Drive y se leen solos al abrir,
   de modo que desde cualquier tablet u ordenador aparece siempre lo mismo.

   Cómo evita pisar datos: nunca se sube lo que hay en pantalla "tal cual". Antes de
   subir se lee lo que hay en Drive y se MEZCLA registro a registro por su id, así dos
   tablets que apuntan a la vez no se borran la una a la otra. Lo borrado a propósito
   se recuerda en una lista de bajas para que no resucite al mezclar. */

const SYNC_CADA_MS = 3*60*1000;     // repaso periódico
const SYNC_ESPERA_MS = 4000;        // tras un cambio, espera por si vienen más
const BAJAS_DIAS = 180;             // cuánto se recuerda un borrado

let SYNC = { estado:'', ultima:null, enCurso:false, pendiente:false, timer:null, fallos:0 };
let BAJAS = {};                     // { idRegistro: marcaDeTiempo }

function syncActiva(){ return !!getAppsScriptUrl(); }

async function cargarBajas(){
  try{ const r = await Store.get('sync:bajas'); BAJAS = r ? JSON.parse(r) : {}; }catch(e){ BAJAS = {}; }
}
async function guardarBajas(){
  const corte = Date.now() - BAJAS_DIAS*24*3600*1000;
  for(const k of Object.keys(BAJAS)) if(BAJAS[k] < corte) delete BAJAS[k];
  try{ await Store.set('sync:bajas', JSON.stringify(BAJAS)); }catch(e){}
}

/* Cuántos datos de verdad lleva un registro: al mezclar gana el más completo,
   que es el que se ha seguido rellenando (por ejemplo un lote al que ya se le
   ha puesto la fecha de cierre). Así una mezcla nunca vacía un campo. */
function relleno(r){
  let n = 0;
  for(const k of Object.keys(r||{})){
    if(k === '_ts') continue;
    const v = r[k];
    if(v === null || v === undefined || v === '') continue;
    if(Array.isArray(v) && !v.length) continue;
    n++;
  }
  return n;
}

function mezclarLista(local, remoto){
  const fuera = new Map();
  (Array.isArray(remoto)?remoto:[]).forEach(r=>{ if(r && r.id) fuera.set(r.id, r); });
  const salida = [];
  const vistos = new Set();
  (Array.isArray(local)?local:[]).forEach(r=>{
    if(!r || !r.id){ salida.push(r); return; }
    vistos.add(r.id);
    if(BAJAS[r.id]) return;                       // borrado a propósito
    const otro = fuera.get(r.id);
    if(!otro){ salida.push(r); return; }
    salida.push(relleno(otro) > relleno(r) ? otro : r);
  });
  fuera.forEach((r,id)=>{ if(!vistos.has(id) && !BAJAS[id]) salida.push(r); });
  return salida;
}

/* La rejilla de temperaturas se mezcla casilla a casilla: cada tablet rellena
   sus equipos y ninguna debe borrar lo que ha escrito la otra. */
function mezclarTemperaturas(local, remoto){
  const salida = {};
  const claves = new Set([...Object.keys(local||{}), ...Object.keys(remoto||{})]);
  claves.forEach(k=>{
    const a = (local||{})[k], b = (remoto||{})[k];
    if(!a){ salida[k] = b; return; }
    if(!b){ salida[k] = a; return; }
    salida[k] = a.map((fila,i)=>{
      const otra = b[i] || {};
      const valores = Object.assign({}, otra.valores||{});
      Object.keys(fila.valores||{}).forEach(eq=>{
        const v = fila.valores[eq];
        if(v !== '' && v !== null && v !== undefined) valores[eq] = v;
      });
      return {
        day: fila.day,
        valores,
        responsable: fila.responsable || otra.responsable || '',
        incidencia: fila.incidencia || otra.incidencia || ''
      };
    });
  });
  return salida;
}

function mezclarTodo(remoto){
  if(!remoto || typeof remoto !== 'object') return false;
  const rData = remoto.data || {};
  let cambios = false;
  /* Las bajas se aplican ANTES de mezclar: si otro dispositivo borró un registro,
     aquí tiene que desaparecer también, no volver a colarse en la mezcla. */
  const antesBajas = JSON.stringify(BAJAS);
  Object.assign(BAJAS, remoto.bajas || {});
  if(JSON.stringify(BAJAS) !== antesBajas) cambios = true;
  for(const mod of Object.keys(DATA)){
    const antes = JSON.stringify(DATA[mod]);
    DATA[mod] = (mod === 'temperaturas')
      ? mezclarTemperaturas(DATA.temperaturas, rData.temperaturas)
      : mezclarLista(DATA[mod], rData[mod]);
    if(JSON.stringify(DATA[mod]) !== antes) cambios = true;
  }
  /* Un dispositivo con la versión antigua puede mandar lotes con las semanas
     pegadas al código: se separan también al recibirlos. */
  if(normalizarLotes() > 0) cambios = true;
  if(normalizarNombresLotes().tocados > 0) cambios = true;
  if(migrarPlagasDeMantenimiento() > 0) cambios = true;
  // Los ajustes (equipos, zonas, tiendas…) los cambia una sola persona: manda el más reciente.
  const tsRemoto = remoto.configTs || 0, tsLocal = CONFIG._ts || 0;
  if(remoto.config && tsRemoto > tsLocal){ CONFIG = remoto.config; cambios = true; }
  return cambios;
}

function contarRegistros(d){
  let n = 0;
  for(const mod of Object.keys(d||{})){
    if(mod === 'temperaturas') n += Object.keys(d.temperaturas||{}).length;
    else n += (d[mod]||[]).length;
  }
  return n;
}

function pintarEstadoSync(){
  const el = document.getElementById('syncFoot');
  if(el) el.textContent = SYNC.estado;
  const aj = document.getElementById('driveSyncEstado');

}
function marcarSync(txt){ SYNC.estado = txt; pintarEstadoSync(); }

async function leerDeDrive(){
  const url = getAppsScriptUrl();
  const sep = url.includes('?') ? '&' : '?';
  const res = await fetch(url+sep+'action=get&t='+Date.now(), {cache:'no-store'});
  if(!res.ok) throw new Error('Drive respondió '+res.status);
  const txt = await res.text();
  let j; try{ j = JSON.parse(txt); }catch(e){ throw new Error('Drive devolvió algo que no es una copia válida'); }
  if(j && j.data && !j.bajas && j.exportadoEl) j.bajas = {};   // copia del formato antiguo
  return j || {};
}

/* Guarda en Drive lo que hay aquí MEZCLADO con lo que ya había allí. */
async function sincronizar(motivo){
  if(!syncActiva()) return false;
  if(SYNC.enCurso){ SYNC.pendiente = true; return false; }
  SYNC.enCurso = true;
  try{
    marcarSync('Guardando en Drive…');
    const remoto = await leerDeDrive();
    const habiaFuera = contarRegistros(remoto.data);
    const cambios = mezclarTodo(remoto);
    const ahoraHay = contarRegistros(DATA);

    // Red de seguridad: jamás subir "nada" encima de un histórico que sí existe.
    if(habiaFuera > 0 && ahoraHay === 0){
      marcarSync('Aviso: no se ha subido nada porque esta tablet está vacía y en Drive sí hay registros.');
      return false;
    }
    const cuerpo = JSON.stringify({
      v:2, config:CONFIG, configTs: CONFIG._ts || 0,
      data:DATA, bajas:BAJAS, guardadoEl:new Date().toISOString()
    });
    const res = await fetch(getAppsScriptUrl(), {
      method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:cuerpo
    });
    const r = await res.json();
    if(!r.ok) throw new Error(r.error || 'Drive no confirmó el guardado');

    if(cambios){
      await saveConfigLocal();
      for(const mod of Object.keys(DATA)) await saveModuleLocal(mod);
      await guardarBajas();
      refrescarPantalla();
    } else {
      await guardarBajas();
    }
    SYNC.ultima = new Date(); SYNC.fallos = 0;
    marcarSync('Guardado en Drive a las '+SYNC.ultima.toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'})+
               ' · '+ahoraHay+' registros');
    return true;
  }catch(err){
    SYNC.fallos++;
    console.error('sync', err);
    marcarSync('Sin conexión con Drive ('+err.message+'). Lo guardado aquí no se pierde; se reintenta solo.');
    return false;
  }finally{
    SYNC.enCurso = false;
    if(SYNC.pendiente){ SYNC.pendiente = false; setTimeout(()=>sincronizar('pendiente'), 1500); }
  }
}

function pedirSync(){
  if(!syncActiva()) return;
  clearTimeout(SYNC.timer);
  SYNC.timer = setTimeout(()=>sincronizar('cambio'), SYNC_ESPERA_MS);
}

function refrescarPantalla(){
  try{
    updateSidebarFoot();
    const activa = document.querySelector('.view.active');
    const id = activa ? activa.id.replace('view-','') : 'dashboard';
    if(RENDERERS[id]) RENDERERS[id]();
    renderDashboard();
  }catch(e){ console.error('repintado', e); }
}

async function arrancarSync(){
  await cargarBajas();
  // Un enlace con ?sync=... deja configurado el dispositivo de una vez y se limpia solo.
  try{
    const q = new URLSearchParams(location.search);
    const p = q.get('sync');
    if(p) setAppsScriptUrl(decodeURIComponent(p));
    /* ?ia=<clave> deja también lista la lectura de albaranes en este aparato. */
    const k = q.get('ia');
    if(k){
      try{ localStorage.setItem('appcc_gemini_key', decodeURIComponent(k)); }catch(e){}
      if(CONFIG){ CONFIG.iaGeminiKey = decodeURIComponent(k); try{ await saveConfigLocal(); }catch(e){} }
    }
    if(p || k){
      history.replaceState(null,'',location.pathname);
      /* Sin esto no hay forma de saber si el enlace ha hecho algo: la dirección
         se limpia sola y la pantalla queda igual. */
      setTimeout(()=>{
        alert('✅ Dispositivo configurado\n\n'
          + (p ? '• Sincronización con Google Drive: activada\n' : '')
          + (k ? '• Clave de la IA para leer albaranes: guardada\n' : '')
          + '\nEn unos segundos deberían aparecer aquí todos los registros. '
          + 'Puedes comprobarlo en Ajustes → Estado de este dispositivo.');
      }, 1200);
    }
  }catch(e){}
  if(!syncActiva()){
    marcarSync('Los datos se guardan solo en este dispositivo. Configura la sincronización en Ajustes.');
    return;
  }
  await sincronizar('arranque');
  setInterval(()=>{ if(!document.hidden) sincronizar('periódico'); }, SYNC_CADA_MS);
  document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) sincronizar('vuelta'); });
  window.addEventListener('online', ()=>sincronizar('reconexión'));
}


/* ---------- HELPERS ---------- */
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function todayStr(){ return new Date().toISOString().slice(0,10); }
function nowStr(){ const d=new Date(); return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }
function esc(s){ return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtDate(d){ if(!d) return '—'; const [y,m,day]=d.split('-'); return `${day}/${m}/${y}`; }
function within(v,min,max){ return v>=min && v<=max; }
// --- candado de fechas: una recepción no puede ser de hace meses ni del futuro ---
const DIAS_ATRAS_MAX = 60;
const DIAS_ADELANTE_MAX = 1;
function diasDesdeHoy(f){
  if(!f || !/^\d{4}-\d{2}-\d{2}$/.test(String(f))) return null;
  const hoy = new Date(todayStr()+'T00:00:00');
  const d = new Date(String(f)+'T00:00:00');
  if(isNaN(d.getTime())) return null;
  return Math.round((d - hoy)/86400000);
}
function fechaSospechosa(f){
  const n = diasDesdeHoy(f);
  if(n === null) return false;
  return n > DIAS_ADELANTE_MAX || n < -DIAS_ATRAS_MAX;
}
function motivoFechaSospechosa(f){
  const n = diasDesdeHoy(f);
  if(n === null) return '';
  if(n > DIAS_ADELANTE_MAX) return 'es una fecha futura';
  if(n < -DIAS_ATRAS_MAX) return 'es de hace ' + Math.abs(n) + ' días';
  return '';
}

    DATA.temperaturas[key] = Array.from({length:31},(_,i)=>({day:i+1, valores:{}, responsable:'', incidencia:''}));

  return DATA.temperaturas[key];
}

  const nDays = daysInMonth(tempSelAnio, tempSelMes);
  const equipos = CONFIG.equipos;
  const head = `<tr><th>Día</th>${equipos.map(e=>`<th>${esc(e.nombre)}</th>`).join('')}<th>Responsable</th><th>Incidencia nº</th></tr>`;
  const body = rows.slice(0,nDays).map(row=>{
    const cells = equipos.map(e=>{
      const v = row.valores[e.nombre];
      const outOfRange = (v!==undefined && v!=='' && isFinite(v)) ? !within(parseFloat(v), e.min, e.max) : false;
      return `<td><input type="number" step="0.1" value="${v!==undefined?v:''}" style="width:64px;${outOfRange?'color:var(--danger);font-weight:700;':''}"
        onchange="updateTempCell(${row.day},'${esc(e.nombre).replace(/'/g,"\\'")}',this.value)"></td>`;
    }).join('');
    return `<tr><td class="mono">${row.day}</td>${cells}
      <td><input type="text" value="${esc(row.responsable)}" style="width:100px;" onchange="updateTempMeta(${row.day},'responsable',this.value)"></td>
      <td><input type="text" value="${esc(row.incidencia)}" style="width:80px;" onchange="updateTempMeta(${row.day},'incidencia',this.value)"></td>
    </tr>`;
  }).join('');
  document.getElementById('temp-grid').innerHTML = `<table>${head}${body}</table>`;
}
function updateTempCell(day, equipo, value){
  const rows = getMonthRows(tempSelAnio, tempSelMes);
  const row = rows.find(r=>r.day===day);
  row.valores[equipo] = value===''?'':parseFloat(value);
  renderTempGrid();
}
function updateTempMeta(day, field, value){
  const rows = getMonthRows(tempSelAnio, tempSelMes);
  const row = rows.find(r=>r.day===day);
  row[field] = value;
}
function temperaturasAlertasHoy(){
  const now = new Date();
  const rows = getMonthRows(now.getFullYear(), now.getMonth()+1);
  const row = rows.find(r=>r.day===now.getDate());
  if(!row) return 0;
  let n=0;
  CONFIG.equipos.forEach(e=>{
    const v = row.valores[e.nombre];
    if(v!==undefined && v!=='' && isFinite(v) && !within(parseFloat(v), e.min, e.max)) n++;
  });
  return n;
}
function temperaturasRegistradasHoy(){
  const now = new Date();
  const rows = getMonthRows(now.getFullYear(), now.getMonth()+1);
  const row = rows.find(r=>r.day===now.getDate());
  if(!row) return 0;
  return Object.values(row.valores).filter(v=>v!==undefined && v!=='').length;
}

/* Los históricos se guardan en el orden en que van entrando y, al mezclarse con
   lo que llega de Drive, ese orden deja de tener sentido: un registro de hoy podía
   acabar en mitad de la lista. Todos los históricos se ordenan por fecha (y hora),
   lo último arriba. No se toca DATA: se ordena una copia. */
function porFechaDesc(lista){
  return (lista||[]).slice().sort((a,b)=>{
    const f = String(b.fecha||'').localeCompare(String(a.fecha||''));
    if(f !== 0) return f;
    return String(b.hora||'').localeCompare(String(a.hora||''));
  });
}

let recepcionExtraidas = [];
let recepcionFotoDataUrl = null;
let albaranQueue = [];
let albaranQueueHash = [];
let albaranQueueIndex = 0;

/* ---------- control de albaranes duplicados ----------
   Dos casos distintos:
   a) la MISMA foto subida dos veces  -> se detecta por la huella de la imagen,
      antes de gastar una lectura de IA, y se descarta sola.
   b) el MISMO albarán ya registrado (otra foto del mismo papel, o guardado dos
      veces) -> se detecta al guardar comparando proveedor + nº de albarán, o
      proveedor + fecha + productos/lotes/cantidades si no hay número.
   Sin esto, el stock y los lotes se duplican. */
function huellaTexto(txt){
  let h = 0x811c9dc5;
  const t = String(txt||'');
  for(let i=0;i<t.length;i++){ h ^= t.charCodeAt(i); h = Math.imul(h, 0x01000193); }
  return (h>>>0).toString(16);
}
function huellaFoto(dataUrl){ return huellaTexto(dataUrl)+'-'+String(dataUrl||'').length; }
function normTxt(v){
  return String(v==null?'':v).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/[^a-z0-9]+/g,' ').trim();
}
function huellaAlbaran(proveedor, fecha, numAlbaran, lineas){
  const num = normTxt(numAlbaran).replace(/\s+/g,'');
  const prov = normTxt(proveedor);
  // el nº de albarán identifica el papel por sí solo: la fecha puede leerse mal
  if(num && num.length>=3) return 'n:'+prov+'|'+num;
  const cuerpo = (lineas||[]).map(l=>normTxt(l.producto)+'#'+normTxt(l.lote)+'#'+normTxt(l.cantidad))
    .filter(x=>x.replace(/[#\s]/g,'')).sort().join('|');
  return 'c:'+prov+'|'+(fecha||'')+'|'+huellaTexto(cuerpo);
}
/** Huellas de todo lo ya registrado, incluidos los registros antiguos que
    todavía no llevaban huella guardada. */
function huellasRegistradas(){
  const grupos = {};
  DATA.recepcion.forEach(r=>{
    if(r.huella){
      if(!grupos['h:'+r.huella]) grupos['h:'+r.huella] = {huella:r.huella, ref:r};
      return;
    }
    const k = 'g:'+(r.fotoId || (normTxt(r.proveedor)+'|'+(r.fecha||'')));
    if(!grupos[k]) grupos[k] = {ref:r, lineas:[], proveedor:r.proveedor, fecha:r.fecha, num:r.numAlbaran||''};
    grupos[k].lineas.push(r);
  });
  const mapa = new Map();
  Object.keys(grupos).forEach(k=>{
    const g = grupos[k];
    const h = g.huella || huellaAlbaran(g.proveedor, g.fecha, g.num, g.lineas);
    if(!mapa.has(h)) mapa.set(h, g.ref);
  });
  return mapa;
}
function fotosYaRegistradas(){
  const set = new Set();
  DATA.recepcion.forEach(r=>{ if(r.fotoHash) set.add(r.fotoHash); });
  return set;
}

let camaraStream = null;
async function abrirCamara(){
  const estado = document.getElementById('albaranEstado');

    camaraStream = await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}, audio:false});
    const video = document.getElementById('albaranVideo');

function capturarFotoCamara(){
  const video = document.getElementById('albaranVideo');
  if(!video.videoWidth){ return; }
  const maxWidth = 1100;
  const scale = Math.min(1, maxWidth/video.videoWidth);
  const canvas = document.createElement('canvas');
  canvas.width = Math.round(video.videoWidth*scale);
  canvas.height = Math.round(video.videoHeight*scale);
  canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);
  const dataUrl = canvas.toDataURL('image/jpeg', 0.72);
  const hFoto = huellaFoto(dataUrl);
  if(albaranQueueHash.indexOf(hFoto)>=0){
    avisoAlbaran('<b>Foto repetida.</b> Esa misma imagen ya estaba en la cola, así que no se ha añadido otra vez.');
    cerrarCamara();
    return;
  }
  albaranQueue.push(dataUrl);
  albaranQueueHash.push(hFoto);
  if(albaranQueue.length===1) albaranQueueIndex = 0;
  cargarFotoDeCola();
  cerrarCamara();
}
function cargarFotoDeCola(){
  const preview = document.getElementById('albaranPreview');
  const estado = document.getElementById('albaranEstado');
  const btn = document.getElementById('albaranExtraerBtn');
  if(!preview) return;
  if(albaranQueue.length===0){
    recepcionFotoDataUrl = null;
    preview.innerHTML = '';
    if(btn) btn.disabled = true;
    return;
  }
  if(albaranQueueIndex>=albaranQueue.length) albaranQueueIndex = albaranQueue.length-1;
  recepcionFotoDataUrl = albaranQueue[albaranQueueIndex];
  const miniaturas = albaranQueue.map((d,i)=>`<img src="${d}" style="width:52px;height:52px;object-fit:cover;border-radius:6px;border:2px solid ${i===albaranQueueIndex?'var(--wheat)':'var(--line)'};cursor:pointer;" onclick="albaranQueueIndex=${i};cargarFotoDeCola();">`).join('');
  preview.innerHTML = `
    ${albaranQueue.length>1 ? `<div class="hint" style="margin-bottom:6px;">Albarán ${albaranQueueIndex+1} de ${albaranQueue.length} — pulsa una miniatura para cambiar de foto</div><div style="display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap;">${miniaturas}</div>` : ''}
    <img src="${recepcionFotoDataUrl}" style="max-width:220px;border-radius:8px;border:1px solid var(--line);">
  `;
  if(btn) btn.disabled = false;
  recepcionExtraidas = [];
  renderLineasExtraidas();
  const provInput = document.getElementById('albaranProveedor');
  if(provInput) provInput.value = '';
  const numInput = document.getElementById('albaranNumero');
  if(numInput) numInput.value = '';
  if(estado) estado.textContent = albaranQueue.length>1
    ? `Foto ${albaranQueueIndex+1} de ${albaranQueue.length} lista. Pulsa "Extraer datos con IA".`
    : 'Foto lista. Pulsa "Extraer datos con IA".';
}
function compressImage(file, maxWidth, quality){
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onload = e=>{
      const img = new Image();
      img.onload = ()=>{
        const scale = Math.min(1, maxWidth/img.width);
        const canvas = document.createElement('canvas');
        canvas.width = Math.round(img.width*scale);
        canvas.height = Math.round(img.height*scale);
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img,0,0,canvas.width,canvas.height);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = ()=>reject(new Error('No se pudo leer la imagen'));
      img.src = e.target.result;
    };
    reader.onerror = ()=>reject(new Error('No se pudo leer el archivo'));
    reader.readAsDataURL(file);
  });
}

/* Relevo de modelos. La saturación ("high demand") no es de la cuenta: es del
   modelo concreto, y lo comparte todo el mundo. Comprobado el 24/09/2026 con la
   clave de Salduba: el 3.8 y el 3.7 daban 503 en el mismo segundo en que el 3.6 y
   el 3.5 contestaban bien. Por eso, si uno está saturado, se salta al siguiente
   EN EL ACTO, sin esperar. Solo si están saturados todos se espera y se reintenta. */
const MODELOS_GEMINI = [
  'gemini-3.6-flash',          // el de siempre
  'gemini-3.5-flash',          // comprobado el 24/09: contestaba con el 3.8 y el 3.7 caídos
  'gemini-flash-latest',       // alias: Google lo apunta solo al que tenga sano
  'gemini-3.5-flash-lite',
  'gemini-flash-lite-latest'
];

/* Un modelo se retira y devuelve 404 ("no longer available"). Eso no es saturación,
   pero tampoco es culpa de la clave: hay que pasar al siguiente, no rendirse.
   Pasó con gemini-2.5-flash, que ya no existe. */
function esModeloRetirado(err){
  const m = String(err && err.message || '').toLowerCase();
  return /no longer available|not found|is not supported|not supported for|404/.test(m);
}

async function llamadaGemini(modelo, partes, apiKey){
  const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${modelo}:generateContent`, {
    method:'POST',
    headers:{'content-type':'application/json','x-goog-api-key':apiKey},
    body: JSON.stringify({ contents:[{parts:partes}] })
  });
  let data;
  try{ data = await response.json(); }catch(e){ throw new Error('Respuesta no válida del servidor (HTTP '+response.status+')'); }
  if(!response.ok){
    let msg = data?.error?.message || ('HTTP '+response.status);
    if(response.status===400 || response.status===403) msg += ' — revisa que la clave de Gemini en Ajustes sea correcta y tenga la API de Gemini habilitada';
    const err = new Error(msg);
    err.modelo = modelo;
    if(response.status===429){
      let segundos = null;
      const detalle = (data?.error?.details||[]).find(d=>d['@type']&&d['@type'].includes('RetryInfo'));
      if(detalle && detalle.retryDelay){
        const m = /([\d.]+)s/.exec(detalle.retryDelay);
        if(m) segundos = Math.ceil(parseFloat(m[1]));
      }
      if(segundos===null){
        const m2 = /retry in ([\d.]+)s/i.exec(msg);
        if(m2) segundos = Math.ceil(parseFloat(m2[1]));
      }
      err.retrySeconds = segundos || 60;
      err.esLimiteVelocidad = true;
    }
    throw err;
  }
  const text = data?.candidates?.[0]?.content?.parts?.map(p=>p.text||'').join('') || '';
  if(!text) throw new Error('La IA no ha devuelto texto legible.');
  return text;
}

/* Prueba los modelos uno detrás de otro. Cambia de modelo tanto si está saturado
   como si ha llegado al tope de peticiones, porque el tope también es por modelo. */
async function geminiConRelevo(partes, apiKey, estado){
  let ultimo = null;
  for(let i = 0; i < MODELOS_GEMINI.length; i++){
    try{
      if(i > 0 && estado) estado.textContent = 'Ese modelo estaba ocupado. Probando con otro… no toques nada.';
      const texto = await llamadaGemini(MODELOS_GEMINI[i], partes, apiKey);
      if(i > 0) try{ localStorage.setItem('appcc_modelo_usado', MODELOS_GEMINI[i]); }catch(e){}
      return texto;
    }catch(err){
      ultimo = err;
      const puedeCambiar = esSaturacion(err) || err.esLimiteVelocidad || esModeloRetirado(err);
      if(!puedeCambiar) throw err;
    }
  }
  throw ultimo;
}

async function llamarGemini(base64, apiKey, estado){
  return await geminiConRelevo([
    {inline_data:{mime_type:'image/jpeg', data:base64}},
    {text:PROMPT_ALBARAN}
  ], apiKey, estado);
}

async function extraerAlbaran(){
  if(!recepcionFotoDataUrl) return;
  const btn = document.getElementById('albaranExtraerBtn');
  const estado = document.getElementById('albaranEstado');
  btn.disabled = true; btn.textContent = 'Leyendo albarán…';
  estado.textContent = 'Leyendo el albarán, un momento…';
  let textoRespuesta = '';
  try{
    const base64 = recepcionFotoDataUrl.split(',')[1];
    const pedir = async ()=>{
      if(HAS_CLAUDE_STORAGE) return await llamarClaudeSinClave(base64);
      const provider = getAIProvider();
      if(provider==='gemini'){
        const key = getGeminiKey();
        if(!key) throw new Error(mensajeSinClaveIA());
        return await llamarGemini(base64, key, estado);
      }
      const key = getApiKey();
      if(!key) throw new Error('Falta configurar la clave de API de Anthropic en Ajustes → Configuración de IA');
      return await llamarClaudeConClave(base64, key);
    };
    textoRespuesta = await reintentarSiSatura(pedir, estado);
    textoRespuesta = textoRespuesta.trim();
    let clean = textoRespuesta.replace(/```json|```/g,'').trim();
    const first = clean.indexOf('{');
    const last = clean.lastIndexOf('}');
    if(first>=0 && last>first) clean = clean.slice(first, last+1);
    let parsed;
    try{ parsed = JSON.parse(clean); }
    catch(jsonErr){ throw new Error('No se pudo interpretar la respuesta como datos ("'+textoRespuesta.slice(0,140)+'"...)'); }
    recepcionExtraidas = (parsed.lineas||[]).map(l=>({producto:l.producto||'', lote:l.lote||'', cantidad:l.cantidad||'', caducidad:l.caducidad||''}));
    if(recepcionExtraidas.length===0) recepcionExtraidas.push({producto:'',lote:'',cantidad:'',caducidad:''});
    document.getElementById('albaranProveedor').value = parsed.proveedor||'';
    const campoNum = document.getElementById('albaranNumero');
    if(campoNum) campoNum.value = parsed.numAlbaran||'';
    let fechaLeidaMal = '';
    if(parsed.fecha){
      if(fechaSospechosa(parsed.fecha)){
        fechaLeidaMal = parsed.fecha;
        document.getElementById('albaranFecha').value = todayStr();
      }else{
        document.getElementById('albaranFecha').value = parsed.fecha;
      }
    }
    pintarAvisoFechaAlbaran(fechaLeidaMal);
    avisarSiYaRegistrado();
    renderLineasExtraidas();
    delete estado.dataset.reintentosLimite;   // ha salido bien: se reinicia la cuenta
    estado.textContent = recepcionExtraidas.some(l=>l.producto) ? 'Datos leídos. Revisa y corrige cualquier campo antes de guardar.' : 'No se detectó ningún producto claro en la foto. Añádelos manualmente abajo.';
  }catch(err){
    console.error(err);
    guardarUltimoErrorIA(err);
    if(err.esLimiteVelocidad){
      iniciarCuentaAtrasLimite(err.retrySeconds, btn, estado);
      return;
    }
    estado.textContent = esSaturacion(err)
      ? 'Gemini lleva un rato saturado y no ha podido leer el albarán ni reintentándolo. No es culpa de la foto ni de la app: prueba otra vez en un par de minutos, o mete los productos a mano ahora y sigue.'
      : 'No se ha podido leer el albarán automáticamente (' + err.message + '). Añade los productos manualmente abajo, o prueba con una foto más nítida y bien encuadrada.';
    if(recepcionExtraidas.length===0){ recepcionExtraidas.push({producto:'',lote:'',cantidad:'',caducidad:''}); renderLineasExtraidas(); }
  }finally{
    if(!estado.dataset.limiteActivo) btn.disabled = false;
    if(btn.textContent==='Leyendo albarán…') btn.textContent = 'Extraer datos con IA';
  }
}
/* Gemini a veces contesta que el modelo está saturado ("high demand"), que no es
   lo mismo que el límite de peticiones por minuto: no hay que esperar un cupo,
   simplemente hay que volver a pedirlo. Se reintenta solo, con esperas cada vez
   más largas, en vez de dejar tirado a quien está recepcionando mercancía. */
function esSaturacion(err){
  const m = String(err && err.message || '').toLowerCase();
  return /high demand|overloaded|currently unavailable|unavailable|try again later|503|500|internal error|temporarily/.test(m);
}
const ESPERAS_SATURACION = [4, 10, 20];   // segundos entre intento e intento
async function reintentarSiSatura(pedir, estado){
  let ultimo = null;
  for(let i = 0; i <= ESPERAS_SATURACION.length; i++){
    try{
      return await pedir();
    }catch(err){
      ultimo = err;
      if(err.esLimiteVelocidad) throw err;        // eso lo lleva la cuenta atrás
      if(!esSaturacion(err) || i === ESPERAS_SATURACION.length) throw err;
      const espera = ESPERAS_SATURACION[i];
      for(let s = espera; s > 0; s--){
        if(estado) estado.textContent = `Gemini está saturado en todos sus modelos ahora mismo. Reintento solo en ${s} s (intento ${i+2} de ${ESPERAS_SATURACION.length+1})… no toques nada.`;
        await new Promise(r=>setTimeout(r, 1000));
      }
      if(estado) estado.textContent = 'Reintentando leer el albarán…';
    }
  }
  throw ultimo;
}

/* Guarda el último fallo de la IA para poder mirarlo después en Ajustes, sin
   tener que acordarse de lo que ponía el aviso. */
function guardarUltimoErrorIA(err){
  try{
    localStorage.setItem('appcc_ultimo_error_ia', JSON.stringify({
      cuando: new Date().toISOString(),
      mensaje: String(err && err.message || err),
      limite: !!(err && err.esLimiteVelocidad)
    }));
  }catch(e){}
}
function ultimoErrorIA(){
  try{ const r = localStorage.getItem('appcc_ultimo_error_ia'); return r ? JSON.parse(r) : null; }
  catch(e){ return null; }
}
/* Cuando Gemini corta por exceso de peticiones, antes había que esperar y
   volver a pulsar. Ahora espera sola y lo reintenta: al tercer albarán
   seguido no hay que hacer nada, solo tener paciencia unos segundos. */
function iniciarCuentaAtrasLimite(segundos, btn, estado){
  estado.dataset.limiteActivo = '1';
  btn.disabled = true;
  let restante = segundos;
  const reintentos = parseInt(estado.dataset.reintentosLimite || '0', 10);
  const vaAReintentar = reintentos < 2;
  const actualizar = ()=>{
    btn.textContent = `Espera ${restante}s…`;
    estado.textContent = vaAReintentar
      ? `Gemini no admite tantas fotos seguidas. Espero ${restante} segundos y lo vuelvo a intentar yo solo — no toques nada.`
      : `Gemini sigue sin admitir más fotos seguidas. Espera ${restante} segundos y vuelve a pulsar, o mete los productos a mano.`;
  };
  actualizar();
  const intervalo = setInterval(()=>{
    restante--;
    if(restante<=0){
      clearInterval(intervalo);
      delete estado.dataset.limiteActivo;
      btn.disabled = false;
      btn.textContent = 'Extraer datos con IA';
      if(vaAReintentar){
        estado.dataset.reintentosLimite = String(reintentos + 1);
        estado.textContent = 'Reintentando…';
        extraerAlbaran();
      }else{
        estado.textContent = 'Ya puedes pulsar "Extraer datos con IA" de nuevo.';
      }
      return;
    }
    actualizar();
  }, 1000);
}

/** Avisa en cuanto la IA lee el albarán, antes de que ella rellene nada más. */
function avisarSiYaRegistrado(){
  const num = (document.getElementById('albaranNumero')||{}).value || '';

  const fecha = (document.getElementById('albaranFecha')||{}).value || '';

    esc(previo.proveedor||'—')+(previo.numAlbaran?(' · albarán '+esc(previo.numAlbaran)):'')+

    '.<br>Si lo vuelves a guardar, el stock y los lotes se contarían dos veces. '+
    'Lo normal aquí es descartarlo.');

}
/** Quita de la cola la foto que se está viendo y pasa a la siguiente. */
function descartarFotoActual(mensaje){
  if(albaranQueue.length>0){
    albaranQueue.splice(albaranQueueIndex,1);
    albaranQueueHash.splice(albaranQueueIndex,1);
    if(albaranQueueIndex>=albaranQueue.length) albaranQueueIndex = Math.max(0, albaranQueue.length-1);
  }
  recepcionExtraidas = [];
  if(albaranQueue.length>0){
    cargarFotoDeCola();
  } else {
    recepcionFotoDataUrl = null;
    const preview = document.getElementById('albaranPreview');
    if(preview) preview.innerHTML = '';
    renderLineasExtraidas();

    if(btn) btn.disabled = true;
    ['albaranProveedor','albaranNumero'].forEach(id=>{ const e=document.getElementById(id); if(e) e.value=''; });
  }
  avisoAlbaran('<b>Albarán duplicado descartado.</b><br>'+(mensaje||'')+
    (albaranQueue.length>0 ? (' Quedan '+albaranQueue.length+' foto(s) en la cola.') : ' No queda ninguna foto pendiente.'));
}
let forzarGuardadoDuplicado = false;

  forzarGuardadoDuplicado = true;

async function confirmarRecepcionFoto(){
  const lineasValidas = recepcionExtraidas.filter(l=>l.producto && l.producto.trim());
  if(lineasValidas.length===0){ alert('Añade al menos un producto con nombre antes de guardar.'); return; }
  const responsable = document.getElementById('albaranResponsable').value.trim();
  if(!responsable){ alert('Indica quién recepciona la mercancía.'); return; }
  const proveedor = document.getElementById('albaranProveedor').value;
  const numAlbaran = ((document.getElementById('albaranNumero')||{}).value || '').trim();
  const fecha = document.getElementById('albaranFecha').value || todayStr();
  if(!confirmarFechaRara(fecha)) return;
  const hora = document.getElementById('albaranHora').value || nowStr();
  const tempLlegada = document.getElementById('albaranTemp').value;
  const estadoEnvase = document.getElementById('albaranEnvase').value;

  // ---- freno de duplicados: nada se guarda si este albarán ya está registrado ----
  const huella = huellaAlbaran(proveedor, fecha, numAlbaran, lineasValidas);
  const fotoHash = recepcionFotoDataUrl ? huellaFoto(recepcionFotoDataUrl) : '';
  const previo = huellasRegistradas().get(huella);
  if(previo && !forzarGuardadoDuplicado){
    avisoAlbaran('<b>ALBARÁN DUPLICADO — no se ha guardado.</b><br>'+
      'Ya hay una recepción registrada de '+esc(previo.proveedor||'—')+
      (previo.numAlbaran?(' con el albarán '+esc(previo.numAlbaran)):'')+
      ' del '+fmtDate(previo.fecha)+(previo.hora?(' a las '+esc(previo.hora)):'')+
      ' con estos mismos productos.<br>Guardarlo otra vez duplicaría el stock y los lotes.'+
      '<div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap;">'+
      '<button class="btn small" type="button" onclick="descartarFotoActual(\'Era el mismo albarán que ya tenías registrado.\')">Descartar esta foto</button>'+
      '<button class="btn secondary small" type="button" onclick="guardarDuplicadoDeTodasFormas()">Guardarlo de todas formas</button>'+
      '</div>');
    const estado = document.getElementById('albaranEstado');
    if(estado) estado.textContent = 'Guardado detenido: este albarán ya estaba registrado.';
    return;
  }
  forzarGuardadoDuplicado = false;
  avisoAlbaran('');

  let fotoId = null;
  if(recepcionFotoDataUrl){
    fotoId = uid();
    try{ await Store.set('foto:'+fotoId, recepcionFotoDataUrl); }catch(e){ console.error(e); fotoId=null; }
  }
  lineasValidas.forEach(l=>{
    DATA.recepcion.unshift({id:uid(), fecha, hora, proveedor, numAlbaran, producto:l.producto, lote:l.lote, cantidad:l.cantidad||'', tempLlegada, estadoEnvase,
      caducidad:l.caducidad, aceptado:true, responsable, observaciones: l.cantidad?('Cantidad: '+l.cantidad):'', fotoId, huella, fotoHash});
  });
  await saveModule('recepcion');
  const actualizados = [];
  for(const l of lineasValidas){
    const nombre = await registrarEntradaStock(l.producto, proveedor, l.cantidad);
    if(nombre) actualizados.push(nombre);
  }
  await saveConfig();
  // quitar de la cola el albarán ya guardado y pasar al siguiente, si hay más
  if(albaranQueue.length>0){
    albaranQueue.splice(albaranQueueIndex,1);
    albaranQueueHash.splice(albaranQueueIndex,1);
    if(albaranQueueIndex>=albaranQueue.length) albaranQueueIndex = Math.max(0, albaranQueue.length-1);
  }
  renderRecepTable();
  renderDashboard();
  if(albaranQueue.length>0){
    cargarFotoDeCola();
    const estado = document.getElementById('albaranEstado');
    if(estado) estado.textContent = `Albarán guardado. Quedan ${albaranQueue.length} foto(s) por procesar en la cola.`;
    document.getElementById('albaranResponsable').value = responsable;
    const numSig = document.getElementById('albaranNumero'); if(numSig) numSig.value = '';
    document.getElementById('albaranFecha').value = todayStr();
    document.getElementById('albaranHora').value = nowStr();
    pintarAvisoFechaAlbaran('');
  } else {
    viewRecepcion();
  }
  if(actualizados.length){ alert('Stock actualizado en Materias primas para: '+actualizados.join(', ')); }
}

/* ---- ALBARANES REGISTRADOS ----
   Las recepciones se guardan línea a línea (un producto por línea), pero el papel
   que llega es un albarán entero. Aquí se vuelven a juntar por albarán para poder
   repasar de un vistazo cuáles están metidos y ver si falta alguno. */
function albaranesRegistrados(){
  const grupos = {};
  (DATA.recepcion||[]).forEach(r=>{
    const num = String(r.numAlbaran||'').trim();
    const clave = r.fotoId ? 'f:'+r.fotoId
                : (num ? 'n:'+normTxt(r.proveedor)+'|'+normTxt(num)
                       : 'p:'+normTxt(r.proveedor)+'|'+String(r.fecha||''));
    if(!grupos[clave]) grupos[clave] = {clave, proveedor:r.proveedor||'', numAlbaran:num,
                                        fecha:r.fecha||'', hora:r.hora||'', fotoId:r.fotoId||'', lineas:[]};
    const g = grupos[clave];
    if(!g.numAlbaran && num) g.numAlbaran = num;
    if(!g.fotoId && r.fotoId) g.fotoId = r.fotoId;
    if(String(r.fecha||'') < String(g.fecha||'') || !g.fecha) g.fecha = r.fecha||g.fecha;
    g.lineas.push(r);
  });
  return Object.keys(grupos).map(k=>grupos[k])
    .sort((a,b)=> String(b.fecha||'').localeCompare(String(a.fecha||''))
                  || String(a.proveedor||'').localeCompare(String(b.proveedor||''),'es'));
}
function etiquetaAlbaran(g){
  return (g.fecha ? fmtDate(g.fecha) : 'sin fecha')
       + ' · ' + (g.proveedor || 'sin proveedor')
       + ' · ' + (g.numAlbaran ? 'albarán ' + g.numAlbaran : 'SIN Nº DE ALBARÁN')
       + ' · ' + g.lineas.length + ' línea' + (g.lineas.length===1?'':'s');
}
function poblarSelectAlbaranes(){
  const sel = document.getElementById('albSel');
  if(!sel) return [];
  const b = document.getElementById('albBuscar');
  const q = normTxt(b ? b.value : '');
  let lista = albaranesRegistrados();
  if(q) lista = lista.filter(g=> normTxt(g.proveedor).indexOf(q)>=0
                              || normTxt(g.numAlbaran).indexOf(q)>=0
                              || (g.fecha && fmtDate(g.fecha).indexOf(b.value.trim())>=0)
                              || g.lineas.some(l=>normTxt(l.producto).indexOf(q)>=0) );
  const previo = sel.value;
  sel.innerHTML = `<option value="">${q ? lista.length+(lista.length===1?' albarán':' albaranes')+' con esa búsqueda' : 'Selecciona un albarán…  ('+lista.length+' registrados)'}</option>`
    + lista.map(g=>`<option value="${esc(g.clave)}">${esc(etiquetaAlbaran(g))}</option>`).join('');
  sel.value = lista.some(g=>g.clave===previo) ? previo : '';
  return lista;
}
/* ---- AVISO DE NOMBRES SIN IDENTIFICAR ----
   Cada proveedor escribe los productos a su manera. Cuando entra un albarán con
   un nombre que no se reconoce, ese producto no se puede enlazar con su lote.
   Aquí salen todos los que están sin identificar, para repasarlos. */
function productosSinIdentificar(){
  const conocidos = nombresConocidos();
  const vistos = {};
  (DATA.recepcion||[]).forEach(r=>{
    const d = String(r.producto||'').trim();
    if(!d) return;
    if(mejorProductoPara(d, conocidos)) return;
    const k = normTxt(limpiaCodigoProveedor(d));
    if((CONFIG.productosSinLote||[]).indexOf(k) >= 0) return;
    if(!vistos[k]) vistos[k] = {descripcion:d, proveedor:r.proveedor||'', fecha:r.fecha||'', veces:0};
    vistos[k].veces++;
    if(String(r.fecha||'') > String(vistos[k].fecha||'')){ vistos[k].fecha = r.fecha; vistos[k].proveedor = r.proveedor||''; }
  });
  return Object.keys(vistos).map(k=>vistos[k])
    .sort((a,b)=>String(b.fecha||'').localeCompare(String(a.fecha||'')));
}
function gruposFechaRara(){
  const g = {};
  (DATA.recepcion||[]).forEach(r=>{
    if(!fechaSospechosa(r.fecha)) return;
    const k = String(r.fecha)+'|'+String(r.proveedor||'')+'|'+String(r.numAlbaran||'');
    if(!g[k]) g[k] = {fecha:r.fecha, proveedor:r.proveedor||'', numAlbaran:r.numAlbaran||'', ids:[], productos:[]};
    g[k].ids.push(r.id);
    if(r.producto) g[k].productos.push(r.producto);
  });
  return Object.values(g).sort((a,b)=>String(a.fecha).localeCompare(String(b.fecha)));
}
function renderAvisoFechas(){

    grupos.map((g,i)=>`<tr>

}
async function corregirFechaRecepcion(i){
  const g = gruposFechaRara()[i];
  if(!g) return;
  const campo = document.getElementById('fixfecha'+i);
  const nueva = campo ? campo.value : '';
  if(!nueva){ alert('Elige la fecha correcta.'); return; }
  if(fechaSospechosa(nueva) && !confirm('Esa fecha tampoco cuadra ('+motivoFechaSospechosa(nueva)+'). ¿La pongo igual?')) return;
  let n = 0;
  (DATA.recepcion||[]).forEach(r=>{ if(g.ids.indexOf(r.id)>=0){ r.fecha = nueva; n++; } });
  await saveModule('recepcion');
  renderAvisoFechas(); renderRecepTable(); renderAlbaranes(); renderDashboard();
  alert('Corregidas '+n+' línea(s) a '+fmtDate(nueva)+'.');

/** Da de alta la descripción como producto nuevo del cuaderno. */
async function guardarProductoNuevo(descripcion){
  const cat = CONFIG.catalogoLotes = CONFIG.catalogoLotes || {pasteleria:[], bajaRotacion:[], materiales:[]};
  cat.pasteleria = cat.pasteleria || [];
  const limpio = limpiaCodigoProveedor(descripcion);
  if(!cat.pasteleria.some(n=>normTxt(n)===normTxt(limpio))) cat.pasteleria.push(limpio);
  await saveConfig();
  renderAvisoNombres(); renderAvisoFechas(); renderAlbaranes();
}

  if(CONFIG.productosSinLote.indexOf(k) < 0) CONFIG.productosSinLote.push(k);

}

    resumen.innerHTML = `<p class="hint" style="margin:0 0 8px;">
        <strong>${todos.length}</strong> albaranes registrados · <strong>${(DATA.recepcion||[]).length}</strong> líneas en total

/* ================= PRODUCCIÓN DIARIA (montaje, bollería/hojaldre, masas) =================
   Réplica de los tres cuadernos mensuales del obrador. Cada casilla de la rejilla
   es un registro con su propio id: así dos tablets pueden rellenar el mismo mes
   sin pisarse, y un borrado no vuelve al sincronizar. */
let prodRegistro = 'montaje';
let prodMes = new Date().getMonth()+1;
let prodAnio = new Date().getFullYear();

function prodDef(){ return (CONFIG.produccion||{})[prodRegistro] || {titulo:'', grupos:[]}; }
function prodClave(a,m,d){ return a+'-'+String(m).padStart(2,'0')+'-'+String(d).padStart(2,'0'); }
function prodIndice(){
  const ix = {};
  DATA.produccion.forEach(r=>{ if(r.registro===prodRegistro) ix[r.producto+'|'+r.fecha] = r; });
  return ix;
}
/* Escribir una casilla: crea, actualiza o borra el registro de ese producto y día. */
async function setProdCell(producto, dia, valor){
  const fecha = prodClave(prodAnio, prodMes, dia);
  const v = String(valor==null?'':valor).trim();
  const ex = DATA.produccion.filter(r=>r.registro===prodRegistro && r.producto===producto && r.fecha===fecha)[0];
  if(!v){
    if(ex){
      DATA.produccion = DATA.produccion.filter(r=>r!==ex);
      BAJAS[ex.id] = Date.now();
      await guardarBajas();
      await saveModule('produccion');
    }
    return;
  }
  if(ex){ ex.unidades = v; }
  else DATA.produccion.push({id:uid(), registro:prodRegistro, producto, fecha, unidades:v, lote:''});
  await saveModule('produccion');
}
async function setProdLote(producto, dia, lote){
  const fecha = prodClave(prodAnio, prodMes, dia);
  const ex = DATA.produccion.filter(r=>r.registro===prodRegistro && r.producto===producto && r.fecha===fecha)[0];
  if(ex){ ex.lote = lote; await saveModule('produccion'); }
}

  const regs = Object.keys(CONFIG.produccion||{});
  document.getElementById('view-produccion').innerHTML = `
    <div class="panel">

      <p class="hint">Los tres cuadernos mensuales del obrador, con los mismos productos y en el mismo orden que en papel. Se escribe el número de unidades en la casilla del día y se guarda solo.</p>

  document.getElementById('prodCargar').addEventListener('click', ()=>{

  });

function renderProdGrid(){
  const def = prodDef();
  const nDays = daysInMonth(prodAnio, prodMes);
  const ix = prodIndice();
  const conLote = prodRegistro === 'elaboraciones';
  document.getElementById('prodAyuda').textContent = def.ayuda || '';
  let head = '<tr><th style="min-width:230px">Producto</th>';
  for(let d=1; d<=nDays; d++) head += `<th class="mono">${d}</th>`;
  head += '<th class="mono">Total</th></tr>';
  let body = '';
  (def.grupos||[]).forEach(g=>{
    body += `<tr><td colspan="${nDays+2}" style="background:var(--bg2);font-weight:700;font-size:12px;letter-spacing:.06em;text-transform:uppercase">${esc(g.grupo)}</td></tr>`;
    g.productos.forEach(prod=>{
      let total = 0, celdas = '';
      for(let d=1; d<=nDays; d++){
        const r = ix[prod+'|'+prodClave(prodAnio,prodMes,d)];
        const v = r ? r.unidades : '';
        const n = parseFloat(String(v).replace(',','.'));
        if(isFinite(n)) total += n;
        const lote = conLote && r && r.lote ? ` title="Lote: ${esc(r.lote)}"` : '';
        celdas += `<td><input type="text" inputmode="numeric" value="${esc(v)}" style="width:44px;text-align:right${conLote&&r&&r.lote?';border-bottom:2px solid var(--ok)':''}"${lote}
          onchange="setProdCell('${esc(prod).replace(/'/g,"\\'")}',${d},this.value)"></td>`;
      }
      body += `<tr><td>${esc(prod)}</td>${celdas}<td class="mono"><b>${total||''}</b></td></tr>`;
    });
  });
  document.getElementById('prod-grid').innerHTML = `<table>${head}${body}</table>`;
}

  renderNCTable();
  renderDashboard();
}
function renderNCTable(){
  const rows = porFechaDesc(DATA.noconformidades).map(r=>`<tr>
    <td class="mono">${fmtDate(r.fecha)}</td><td>${esc(r.plan)}</td><td>${esc(r.descripcion)}</td>
    <td>${esc(r.accionCorrectiva)||'—'}</td>
    <td><span class="badge ${r.estado==='Cerrada'?'ok':'warn'}">${r.estado}</span></td>
    <td class="mono">${r.fechaCierre?fmtDate(r.fechaCierre):'—'}</td>
    <td>${esc(r.responsable)}</td>
    <td style="white-space:nowrap;">
      <button class="btn secondary small" onclick="toggleNC('${r.id}')">${r.estado==='Abierta'?'Marcar cerrada':'Reabrir'}</button>
      <button class="btn danger small" onclick="removeRecord('noconformidades','${r.id}',renderNCTable)">Borrar</button>
    </td>
  </tr>`);
  document.getElementById('nc-table').innerHTML = table(['Fecha','Plan','Descripción','Acción correctora','Estado','Cierre','Responsable',''], rows);
}
