/* ================= CONTROL DE PLAGAS (DDD) =================
   Las visitas de la empresa de desinsectación llevan su propio registro, aparte
   del mantenimiento de equipos: el inspector lo pide como documentación del plan
   de lucha contra plagas. De cada visita se guarda el parte en foto, y la foto
   sube a Drive como archivo suelto para poder abrirla desde cualquier ordenador. */
let plagasFotos = [];          // fotos de la visita que se está apuntando

/* La revisión de plagas es ANUAL salvo que haya un problema puntual. Como pasa
   casi un año entre visitas, es fácil que se eche el tiempo encima sin darse
   cuenta; por eso la app lleva la cuenta y avisa sola. */
const PLAGAS_MESES_REVISION = 12;
function mesesDesde(fecha){
  if(!/^\d{4}-\d{2}-\d{2}$/.test(String(fecha||''))) return null;
  const d = new Date(fecha+'T00:00:00'), hoy = new Date(todayStr()+'T00:00:00');
  if(isNaN(d.getTime())) return null;
  return (hoy.getFullYear()-d.getFullYear())*12 + (hoy.getMonth()-d.getMonth())
       - (hoy.getDate() < d.getDate() ? 1 : 0);
}
function sumaMeses(fecha, n){
  const d = new Date(fecha+'T00:00:00');
  if(isNaN(d.getTime())) return '';
  d.setMonth(d.getMonth()+n);
  return d.toISOString().slice(0,10);
}
/** La revisión periódica más reciente: los avisos por incidencia no cuentan
    como la revisión anual, son visitas extra. */
function ultimaRevisionPlagas(){
  return porFechaDesc((DATA.plagas||[]).filter(r=>!/incidencia/i.test(r.tipoActuacion||'')))[0] || null;
}
function panelProximaRevision(){
  const u = ultimaRevisionPlagas();
  if(!u) return `<div class="panel"><p class="hint">Todavía no hay ninguna revisión registrada. La revisión de plagas es anual: apunta la última que os hicieran para que la app lleve la cuenta.</p></div>`;
  const meses = mesesDesde(u.fecha);
  const toca = u.proxima && /^\d{4}-\d{2}-\d{2}$/.test(u.proxima) ? u.proxima : sumaMeses(u.fecha, PLAGAS_MESES_REVISION);
  const faltan = diasDesdeHoy(toca);
  let color = 'var(--ok)', fondo = '#f2f9f2', borde = 'var(--ok)', texto;
  if(faltan === null){ texto = ''; }
  else if(faltan < 0){
    color = '#7d2018'; fondo = '#fdecea'; borde = '#c0392b';
    texto = `<b>La revisión anual está vencida.</b> Tocaba el ${fmtDate(toca)}, hace ${Math.abs(faltan)} días. Conviene llamar a ${esc(u.empresa)||'la empresa'} y que quede el parte registrado.`;
  } else if(faltan <= 60){
    color = '#7a5200'; fondo = '#fdf6e3'; borde = '#b7791f';
    texto = `<b>Se acerca la revisión anual:</b> toca sobre el ${fmtDate(toca)}, dentro de ${faltan} días. Buen momento para pedir cita a ${esc(u.empresa)||'la empresa'}.`;
  } else {
    texto = `Revisión anual al día. La siguiente toca sobre el <b>${fmtDate(toca)}</b>, dentro de ${faltan} días.`;
  }
  return `<div class="panel" style="border-left:4px solid ${borde};background:${fondo};color:${color};">
    <p style="margin:0;font-size:15px;line-height:1.5;">${texto}</p>
    <p class="hint" style="margin:6px 0 0;">Última revisión: <b>${fmtDate(u.fecha)}</b>${meses!==null?` (hace ${meses} ${meses===1?'mes':'meses'})`:''} · ${esc(u.empresa)||'—'}${u.numParte?` · parte ${esc(u.numParte)}`:''}. Se revisa una vez al año, salvo que haya algún problema puntual.</p>
  </div>`;
}
/** Lo que se ve en el panel general: cuánto queda para la revisión anual. */
function resumenPlagasDashboard(){
  const u = ultimaRevisionPlagas();
  if(!u) return {badge:'warn', etiqueta:'Sin datos', metrica:'—', sub:'Ninguna revisión registrada todavía'};
  const toca = u.proxima && /^\d{4}-\d{2}-\d{2}$/.test(u.proxima) ? u.proxima : sumaMeses(u.fecha, PLAGAS_MESES_REVISION);
  const faltan = diasDesdeHoy(toca);
  if(faltan === null) return {badge:'ok', etiqueta:'OK', metrica:'—', sub:'Última revisión: '+fmtDate(u.fecha)};
  if(faltan < 0) return {badge:'danger', etiqueta:'Vencida', metrica:Math.abs(faltan),
    sub:'Días de retraso · tocaba el '+fmtDate(toca)};
  if(faltan <= 60) return {badge:'warn', etiqueta:'Se acerca', metrica:faltan,
    sub:'Días para la revisión anual ('+fmtDate(toca)+')'};
  return {badge:'ok', etiqueta:'Al día', metrica:faltan, sub:'Días para la revisión anual ('+fmtDate(toca)+')'};
}

function empresasDDD(){
  const de = (DATA.plagas||[]).map(r=>r.empresa).filter(Boolean);
  const viejas = (DATA.mantenimiento||[]).filter(r=>/plaga|ddd/i.test(r.tipo||'')).map(r=>r.empresa).filter(Boolean);
  return [...new Set(de.concat(viejas))].sort((a,b)=>a.localeCompare(b,'es'));
}
const PARTE_MAX_BYTES = 12 * 1024 * 1024;   // lo que aguanta cómodo el Apps Script
function esPdf(mime, nombre){
  return /pdf/i.test(String(mime||'')) || /\.pdf$/i.test(String(nombre||''));
}
function leerComoDataUrl(file){
  return new Promise((res,rej)=>{
    const r = new FileReader();
    r.onload = e=>res(e.target.result);
    r.onerror = ()=>rej(new Error('no se pudo leer el archivo'));
    r.readAsDataURL(file);
  });
}
/** Las imágenes se reducen; los PDF se suben tal cual, sin tocarlos. */
async function plagasAnadirArchivo(file){
  if(esPdf(file.type, file.name)){
    if(file.size > PARTE_MAX_BYTES){
      throw new Error('el PDF ocupa '+Math.round(file.size/1048576)+' MB y el máximo son 12 MB');
    }
    const dataUrl = await leerComoDataUrl(file);
    plagasFotos.push({dataUrl, mime:'application/pdf', nombre:file.name, pdf:true, bytes:file.size});
    return;
  }
  if(!/^image\//i.test(file.type||'')){
    throw new Error('solo se admiten imágenes o PDF');
  }
  const dataUrl = await compressImage(file, 1400, 0.75);
  plagasFotos.push({dataUrl, mime:'image/jpeg', nombre:file.name || 'foto.jpg', pdf:false});
}

/* ---- la foto del parte, como archivo suelto en Drive ----
   El Apps Script guarda el JSON de los registros; con una llamada más guarda
   también imágenes en una carpeta y devuelve el enlace. Si el script todavía no
   sabe hacerlo, la foto se queda en el dispositivo marcada como pendiente y se
   reintenta; no se pierde nada. */
async function subirFotoADrive(dataUrl, nombre, mime){
  if(!syncActiva()) throw new Error('Drive no está configurado en este dispositivo');
  const coma = dataUrl.indexOf(',');
  /* Si no viene el tipo, se saca de la propia cabecera del data URL. */
  const cab = /^data:([^;,]+)/.exec(String(dataUrl).slice(0,80));
  const tipo = mime || (cab ? cab[1] : 'image/jpeg');
  const cuerpo = JSON.stringify({accion:'foto', nombre, mime:tipo, datos:dataUrl.slice(coma+1)});
  const res = await fetch(getAppsScriptUrl(), {
    method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:cuerpo
  });
  const r = await res.json().catch(()=>({ok:false, error:'Drive no contestó en condiciones'}));
  if(!r.ok) throw new Error(r.error || 'Drive no guardó la foto');
  if(!r.url) throw new Error('Drive no devolvió el enlace de la foto');
  return r;
}
async function subirFotosPendientes(avisar){
  const pendientes = [];
  (DATA.plagas||[]).forEach(r=>(r.fotos||[]).forEach((f,i)=>{
    if(f.estado !== 'subida') pendientes.push({rec:r, foto:f, i});
  }));
  if(!pendientes.length){
    if(avisar) alert('No hay partes pendientes de subir.');
    return;
  }
  let bien = 0, mal = 0, ultimoError = '';
  for(const p of pendientes){
    try{
      const dataUrl = await Store.get('foto:'+p.foto.fotoId);
      if(!dataUrl){ p.foto.estado = 'sin copia'; mal++; continue; }
      const pdf = esPdf(p.foto.mime, p.foto.nombre) || /^data:application\/pdf/i.test(String(dataUrl).slice(0,40));
      const nombre = 'plagas-'+p.rec.fecha+'-'+normTxt(p.rec.empresa||'parte').replace(/ /g,'-')
                   + '-'+(p.i+1)+(pdf ? '.pdf' : '.jpg');
      const r = await subirFotoADrive(dataUrl, nombre, pdf ? 'application/pdf' : (p.foto.mime || 'image/jpeg'));
      p.foto.driveId = r.id || '';
      p.foto.driveUrl = r.url;
      p.foto.estado = 'subida';
      bien++;
    }catch(err){ p.foto.estado = 'pendiente'; ultimoError = err.message; mal++; }
  }
  await saveModule('plagas');
  renderPlagasTable();
  if(avisar || mal){
    const msg = (bien?bien+' archivo(s) subidos a Drive. ':'') +
      (mal? mal+' no se han podido subir todavía ('+ultimoError+'). Se quedan guardados aquí y puedes reintentarlo.' : '');
    alert(msg.trim() || 'Listo.');
  }
}

async function verFotoLocal(fotoId){
  const d = await Store.get('foto:'+fotoId);
  if(!d){ alert('Ese parte no está guardado en este dispositivo. Si se adjuntó desde la tablet, ábrelo allí o súbelo a Drive desde la tablet.'); return; }
  if(/^data:application\/pdf/i.test(String(d).slice(0,40))){
    /* Un PDF en data: URL no se abre en pestaña nueva en algunos navegadores;
       se pasa a blob, que sí. */
    try{
      const bin = atob(String(d).slice(String(d).indexOf(',')+1));
      const buf = new Uint8Array(bin.length);
      for(let i=0;i<bin.length;i++) buf[i] = bin.charCodeAt(i);
      const url = URL.createObjectURL(new Blob([buf], {type:'application/pdf'}));
      window.open(url, '_blank');
      setTimeout(()=>URL.revokeObjectURL(url), 60000);
    }catch(e){ alert('No se pudo abrir el PDF: '+e.message); }
    return;
  }
  const w = window.open('');
  if(w) w.document.write('<title>Parte de plagas</title><img src="'+d+'" style="max-width:100%">');
}

/* ================= REVISIÓN DEL OBRADOR =================
   Para ponerse al día de una sentada: se recorre el obrador con la tablet,
   producto por producto, diciendo qué hay abierto de verdad. Lo que se marca
   queda registrado como apertura o cierre de lote, igual que si se hubiera
   apuntado el día que tocaba. */
let REV_LISTA = [];
let REV_ABIERTO = -1;          // índice de la tarjeta con el selector desplegado
let REV_FILTRO = 'pendientes';

function revisionEstado(){
  const hoy = todayStr();
  if(!CONFIG.revision || CONFIG.revision.fecha !== hoy){
    CONFIG.revision = {fecha: hoy, hechos: {}};
  }
  return CONFIG.revision;
}
function revClave(p){ return normTxt(p); }
function revHecho(p){ return revisionEstado().hechos[revClave(p)] || ''; }

/** Todo lo que puede haber abierto en el obrador: lo que figura abierto en la
    app y, además, lo que se ha recepcionado alguna vez aunque nunca se abriera. */
function construirListaRevision(){
  const porProducto = new Map();
  const mete = (nombre, campo, valor)=>{
    const k = revClave(nombre);
    if(!k) return;
    if(!porProducto.has(k)) porProducto.set(k, {producto:nombre, abiertos:[], cerradosHoy:[], ultimaRecepcion:'', recepciones:0});
    const o = porProducto.get(k);
    if(campo==='lote') o.abiertos.push(valor);
    if(campo==='cerradoHoy') o.cerradosHoy.push(valor);
    if(campo==='recepcion'){
      o.recepciones++;
      if(String(valor||'') > o.ultimaRecepcion) o.ultimaRecepcion = valor;
    }
  };
  (DATA.lotesMP||[]).filter(l=>!l.fechaCierre).forEach(l=>mete(l.producto, 'lote', l));
  (DATA.lotesMP||[]).filter(l=>l.fechaCierre===todayStr()).forEach(l=>mete(l.producto, 'cerradoHoy', l));
  const conocidos = nombresConocidos();
  (DATA.recepcion||[]).forEach(r=>{
    const d = String(r.producto||'').trim();
    if(!d) return;
    if((CONFIG.productosSinLote||[]).indexOf(normTxt(limpiaCodigoProveedor(d))) >= 0) return;
    /* Solo lo que se reconoce como producto del cuaderno. Lo que no casa con
       ningún nombre sale en «Productos por identificar», no aquí. */
    const nombre = mejorProductoPara(d, conocidos);
    if(!nombre) return;
    mete(nombre, 'recepcion', r.fecha);
  });
  /* Primero lo que figura abierto, empezando por lo que lleva más tiempo así
     (es lo que más papeletas tiene de estar ya gastado); después, en orden
     alfabético, lo que nunca se ha abierto. */
  const masViejo = x => x.abiertos.length
    ? x.abiertos.map(l=>String(l.fechaApertura||'9999-99-99')).sort()[0]
    : '';
  return [...porProducto.values()].sort((a,b)=>{
    const aa = masViejo(a), bb = masViejo(b);
    if(!!aa !== !!bb) return aa ? -1 : 1;
    if(aa && aa !== bb) return aa < bb ? -1 : 1;
    return String(a.producto).localeCompare(String(b.producto),'es');
  });
}
function diasAbierto(f){
  const n = diasDesdeHoy(f);
  return n === null ? null : Math.abs(n);
}

function renderRevisionLista(){

function tarjetaRevision(x, i){
  const hecho = revHecho(x.producto);
  const marca = hecho ? `<span style="color:var(--ok);font-weight:600;">✔ revisado</span>` : '';
  let cuerpo = '';
  if(x.abiertos.length){
    cuerpo = x.abiertos.map(l=>{
      const d = diasAbierto(l.fechaApertura);
      const viejo = d !== null && d > 90;
      return `<p style="margin:4px 0;font-size:15px;">Lote <strong class="mono">${esc(l.lote)||'—'}</strong> · abierto el ${fmtDate(l.fechaApertura)}${d!==null?` <span style="color:${viejo?'#b7791f':'var(--muted)'};">(hace ${d} días)</span>`:''}</p>`;
    }).join('');
    cuerpo += `<div class="cierre-linea" style="margin-top:10px;flex-wrap:wrap;gap:8px;">
      <button class="btn small" type="button" onclick="revConfirmar(${i})">✔ Sí, es el que hay</button>
      <button class="btn secondary small" type="button" onclick="revPicker(${i})">Es otro lote</button>
      ${x.abiertos.map(l=>`<button class="btn secondary small" type="button" onclick="revCerrar(${i},'${esc(l.id)}')">Gastado — cerrar ${x.abiertos.length>1?esc(l.lote):''}</button>`).join('')}
      <button class="btn secondary small" type="button" onclick="revNada(${i})">No hay nada abierto</button>
    </div>`;
  } else if((x.cerradosHoy||[]).length){
    cuerpo = `<p style="margin:4px 0;font-size:15px;color:var(--ok);">✔ Cerrado hoy el lote <strong class="mono">${esc(x.cerradosHoy[0].lote)}</strong>. ¿Habéis empezado otro envase?</p>
    <div class="cierre-linea" style="margin-top:10px;flex-wrap:wrap;gap:8px;">
      <button class="btn small" type="button" onclick="revPicker(${i})">Sí — elegir el lote nuevo</button>
      <button class="btn secondary small" type="button" onclick="revNada(${i})">No, no queda nada abierto</button>
    </div>`;
  } else {
    cuerpo = `<p class="hint" style="margin:4px 0;">Nunca se ha abierto un lote de esto en la app.${x.ultimaRecepcion?` Última recepción: ${fmtDate(x.ultimaRecepcion)}.`:' No hay recepciones registradas.'}</p>
    <div class="cierre-linea" style="margin-top:10px;flex-wrap:wrap;gap:8px;">
      <button class="btn small" type="button" onclick="revPicker(${i})">Hay uno abierto — elegir lote</button>
      <button class="btn secondary small" type="button" onclick="revNada(${i})">No hay nada abierto</button>
    </div>`;
  }
  const picker = REV_ABIERTO === i ? pickerRevision(x, i) : '';
  return `<div class="panel" style="padding:14px 16px;${hecho?'opacity:.65;':''}">
    <div style="display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;">
      <h3 style="margin:0;font-size:18px;">${esc(x.producto)}</h3>${marca}
    </div>
    ${cuerpo}${picker}
  </div>`;
}
function pickerRevision(x, i){

async function revAbrir(producto, lote, fecha){
  const abiertos = (DATA.lotesMP||[]).filter(r=>!r.fechaCierre && normTxt(r.producto)===normTxt(producto));
  const par = partirLoteYSemanas(lote);
  const codigo = par.codigo || String(lote||'').trim();
  const yaEsEse = abiertos.some(r=>mismoLote(r.lote, codigo));
  if(yaEsEse){
    await revGuardarHecho(producto, 'ok');
    REV_ABIERTO = -1;
    viewRevision();
    return;
  }
  abiertos.forEach(r=>{ r.fechaCierre = fecha; });
  DATA.lotesMP.unshift({id:uid(), producto, lote:codigo, fechaApertura:fecha, fechaCierre:'',
                        semana:getWeekNumber(fecha), semanas:[getWeekNumber(fecha)]});
  await saveModule('lotesMP');
  await revGuardarHecho(producto, 'abierto');
  REV_ABIERTO = -1;
  viewRevision();
  renderDashboard();
}
async function revEmpezarDeCero(){
  if(!confirm('Esto solo borra las marcas de «revisado» para volver a empezar el repaso.\n\nLos lotes que hayas abierto o cerrado se quedan como están. ¿Sigo?')) return;
  CONFIG.revision = {fecha: todayStr(), hechos:{}};
  await saveConfig();
  REV_ABIERTO = -1;
  viewRevision();
}

/* ---------- RENDERERS MAP & BOOT ---------- */
const RENDERERS = {
  dashboard:renderDashboard, temperaturas:viewTemperaturas, limpieza:viewLimpieza, agua:viewAgua,
  recepcion:viewRecepcion, alergenos:viewAlergenos, aceite:viewAceite, produccion:viewProduccion, trazabilidad:viewTrazabilidad,
  transporte:viewTransporte,
  materiasprimas:viewMateriasPrimas, revision:viewRevision,
  mantenimiento:viewMantenimiento, plagas:viewPlagas, noconformidades:viewNoConformidades, listeria:viewListeria,
  informes:viewInformes, ajustes:viewAjustes
};

function buildViewsSkeleton(){
  const content = document.getElementById('content');
  content.innerHTML = VIEWS.map(v=>`<div class="view" id="view-${v.id}"></div>`).join('');
}

async function boot(){
  document.getElementById('topDate').textContent = new Date().toLocaleDateString('es-ES',{weekday:'long',year:'numeric',month:'long',day:'numeric'});
  renderNav();
  buildViewsSkeleton();
  await loadAll();
  updateSidebarFoot();
  showView('dashboard');
  arrancarSync();
  document.querySelector('.navitem[data-view="dashboard"]').classList.add('active');
  document.getElementById('view-dashboard').classList.add('active');
  comprobarVersion();
}

/* ---- ACTUALIZACIÓN AUTOMÁTICA ----
   Los móviles y las tablets se quedan con la página guardada en la caché y
   siguen enseñando una versión vieja aunque se recargue. Aquí se pregunta al
   servidor qué versión hay y, si no es la que está corriendo, se recarga sola.
   Solo una vez por sesión, para que no entre en bucle si algo va mal. */
async function comprobarVersion(){
  try{
    if(sessionStorage.getItem('appcc_ya_actualizado')) return;
  }catch(e){ return; }
  try{
    const res = await fetch(location.pathname + '?nocache=' + Date.now(), {cache:'no-store'});
    if(!res.ok) return;
    const txt = await res.text();
    const m = /const APP_VERSION = '([^']+)'/.exec(txt);
    if(!m || m[1] === APP_VERSION) return;
    try{ sessionStorage.setItem('appcc_ya_actualizado','1'); }catch(e){}
    const aviso = document.createElement('div');
    aviso.style.cssText = 'position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.75);color:#fff;'
      + 'display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;font-size:18px;line-height:1.5;';
    aviso.innerHTML = 'Hay una versión nueva de la app.<br>Actualizando…';
    document.body.appendChild(aviso);
    setTimeout(()=>location.reload(), 900);
  }catch(e){ /* sin conexión: se queda con lo que hay */ }
}
boot();
</script>
