async function agregarAlCatalogo(nombre, proveedor){
  const existe = CONFIG.materiasPrimas.find(m=>m.nombre.trim().toLowerCase()===nombre.trim().toLowerCase());
  if(existe){
    existe.proveedor = proveedor;
    alert(`"${nombre}" ya estaba en el catálogo. Proveedor actualizado a ${proveedor}.`);
  } else {
    CONFIG.materiasPrimas.push({nombre, categoria:'', proveedor, telefono:'', unidad:'unidades', stockMinimo:1, stockActual:0});
    alert(`"${nombre}" añadido al catálogo con proveedor ${proveedor}. Ajusta stock mínimo/actual y teléfono cuando puedas.`);
  }
  await saveConfig();
  renderCatalogoMP();
}
async function recalcularProveedoresDesdeRecepciones(){
  let n = 0;
  CONFIG.materiasPrimas.forEach(m=>{
    const key = m.nombre.trim().toLowerCase();
    const candidatas = DATA.recepcion.filter(r=>{
      if(!r.proveedor || !r.proveedor.trim() || !r.producto) return false;
      const rk = r.producto.trim().toLowerCase();
      return rk===key || rk.includes(key) || key.includes(rk);
    }).sort((a,b)=> (b.fecha+(b.hora||'')).localeCompare(a.fecha+(a.hora||'')));
    if(candidatas.length){
      const nuevoProveedor = candidatas[0].proveedor.trim();
      if(m.proveedor!==nuevoProveedor){ m.proveedor = nuevoProveedor; n++; }
    }
  });
  await saveConfig();
  renderCatalogoMP();
  renderTelefonosProveedores();
  alert(n>0 ? `Proveedor actualizado en ${n} producto(s) a partir del historial de recepciones.` : 'No se ha encontrado ninguna recepción que coincida con productos del catálogo, o ya estaban todos correctos.');
}
async function autocompletarProveedores(){
  let n = 0;
  CONFIG.materiasPrimas.forEach(m=>{
    if(m.proveedor && m.proveedor.trim()) return;
    const match = TARIFARIO_DATA.find(t=>t.descripcion.trim().toLowerCase()===m.nombre.trim().toLowerCase())
      || TARIFARIO_DATA.find(t=>t.descripcion.toLowerCase().includes(m.nombre.trim().toLowerCase()) && m.nombre.trim().length>4);
    if(match){ m.proveedor = match.proveedor; n++; }
  });
  await saveConfig();
  renderCatalogoMP();
  renderTelefonosProveedores();
  alert(n>0 ? `Proveedor asignado a ${n} producto(s) del catálogo.` : 'No se ha encontrado ninguna coincidencia nueva en el tarifario.');
}

/* ---- Catálogo y stock ---- */
function loteAbiertoDe(nombre){
  const key = nombre.trim().toLowerCase();
  return DATA.lotesMP.find(r=>!r.fechaCierre && r.producto.trim().toLowerCase()===key) || null;
}
function entradasDe(nombre){
  const key = nombre.trim().toLowerCase();
  const lotesPorClave = {};
  DATA.lotesMP.filter(r=>r.producto.trim().toLowerCase()===key).forEach(r=>{
    const k = (r.lote||'').trim().toLowerCase();
    if(k) lotesPorClave[k] = r;
  });
  return DATA.recepcion.filter(r=>r.producto.trim().toLowerCase()===key)
    .map(r=>{
      const loteInfo = r.lote ? lotesPorClave[r.lote.trim().toLowerCase()] : null;
      const estadoLote = loteInfo ? (loteInfo.fechaCierre ? 'Cerrado' : 'Abierto') : 'En stock (sin abrir)';
      return {fecha:r.fecha, lote:r.lote, caducidad:r.caducidad, cantidad:r.cantidad, proveedor:r.proveedor, estadoLote};
    })
    .sort((a,b)=> a.fecha.localeCompare(b.fecha));
}
function renderInventario(){
  const el = document.getElementById('inventario-table');
  if(!el) return;
  const q = (document.getElementById('inventarioSearch')?.value || '').trim().toLowerCase();
  const items = CONFIG.materiasPrimas
    .filter(m=> !q || m.nombre.toLowerCase().includes(q) || (m.proveedor||'').toLowerCase().includes(q) || (m.categoria||'').toLowerCase().includes(q))
    .slice().sort((a,b)=>a.nombre.localeCompare(b.nombre));
  if(items.length===0){ el.innerHTML = '<p class="hint">No hay materias primas que coincidan.</p>'; return; }
  el.innerHTML = items.map(m=>{
    const entradas = entradasDe(m.nombre);
    const filas = entradas.length
      ? entradas.map(en=>`<tr>
          <td class="mono">${fmtDate(en.fecha)}</td>
          <td class="mono">${esc(en.lote)||'—'}</td>
          <td class="mono">${en.caducidad ? fmtDate(en.caducidad) : '—'}</td>
          <td class="mono">${esc(en.cantidad)||'—'}</td>
          <td>${esc(en.proveedor)||'—'}</td>
          <td><span class="badge ${en.estadoLote==='Abierto'?'warn':'ok'}">${en.estadoLote}</span></td>
        </tr>`)
      : ['<tr class="empty-row"><td colspan="6">Sin recepciones registradas todavía para este producto.</td></tr>'];
    return `<details class="inv-folder">
      <summary>
        <span class="inv-folder-title"><span class="inv-arrow">▸</span> 📁 ${esc(m.nombre)} <span class="hint" style="font-weight:400;">(${esc(m.categoria)||'sin categoría'})</span></span>
        <span class="inv-folder-meta">
          <span class="mono">${m.stockActual} ${esc(m.unidad)}</span>
          <span class="badge ${m.stockActual<=m.stockMinimo?'danger':'ok'}">${m.stockActual<=m.stockMinimo?'Bajo mínimo':'OK'}</span>
          <button class="btn secondary small" onclick="event.preventDefault();event.stopPropagation();abrirAjusteInventario('${esc(m.nombre).replace(/'/g,"\\'")}')">Ajustar</button>
        </span>
      </summary>
      <div class="inv-folder-body">
        ${table(['F. entrada','Lote','Caduca','Cantidad','Proveedor','Estado'], filas)}
      </div>
    </details>`;
  }).join('');
}
function abrirAjusteInventario(nombre){
  const m = CONFIG.materiasPrimas.find(x=>x.nombre===nombre);
  if(!m) return;
  const abierto = loteAbiertoDe(nombre);
  const overlay = document.createElement('div');
  overlay.style.cssText = 'position:fixed;inset:0;background:rgba(20,16,12,0.78);display:flex;align-items:center;justify-content:center;z-index:999;padding:20px;overflow:auto;';
  overlay.innerHTML = `
    <div class="panel" style="max-width:480px;width:100%;margin:20px 0;" onclick="event.stopPropagation()">
      <h2 style="margin-bottom:4px;">${icon('box')} Ajuste manual — ${esc(nombre)}</h2>
      <p class="hint">Usa esto si ha habido una recepción, apertura o cierre de lote que no se registró en su momento, o si el stock no cuadra con lo que hay físicamente.</p>
      <div class="record-form">
        <label class="field wide"><span>Corregir stock actual</span><input type="number" step="0.01" id="ajusteStock" value="${m.stockActual}"></label>
        ${abierto ? `
        <label class="field checkline" style="grid-column:1/-1;"><input type="checkbox" id="ajusteCerrarLote"><span>Cerrar el lote abierto (${esc(abierto.lote)}, desde ${fmtDate(abierto.fechaApertura)})</span></label>
        <label class="field"><span>Fecha de cierre</span><input type="date" id="ajusteFechaCierre" value="${todayStr()}"></label>
        ` : ''}
        <div class="field wide" style="border-top:1px solid var(--line);padding-top:10px;margin-top:4px;"><span>Registrar un lote no anotado (opcional)</span></div>
        <label class="field"><span>Nº de lote</span><input type="text" id="ajusteLote" placeholder="Número de lote"></label>
        <label class="field"><span>Fecha apertura</span><input type="date" id="ajusteFechaApertura" value="${todayStr()}"></label>
        <label class="field checkline"><input type="checkbox" id="ajusteYaCerrado"><span>Este lote nuevo ya está cerrado</span></label>
      </div>
      <div class="form-actions">
        <button class="btn secondary" id="ajusteCancelar" type="button">Cancelar</button>
        <button class="btn" id="ajusteGuardar" type="button">Guardar ajuste</button>
      </div>
    </div>`;
  overlay.addEventListener('click', ()=>overlay.remove());
  document.body.appendChild(overlay);
  document.getElementById('ajusteCancelar').addEventListener('click', ()=>overlay.remove());
  document.getElementById('ajusteGuardar').addEventListener('click', async ()=>{
    const nuevoStock = parseFloat(document.getElementById('ajusteStock').value);

      abierto.fechaCierre = document.getElementById('ajusteFechaCierre').value || todayStr();

      const yaCerrado = document.getElementById('ajusteYaCerrado').checked;
      const par = partirLoteYSemanas(nuevoLote);
      const sems = par.semanas.length ? par.semanas : [getWeekNumber(fApertura)];
      DATA.lotesMP.unshift({id:uid(), producto:nombre, lote:par.codigo||nuevoLote, fechaApertura:fApertura,
                            fechaCierre: yaCerrado?fApertura:'', semana:sems[0], semanas:sems});

    await saveConfig();

    renderInventario();

  });
}

/* ---- Lotes: abrir / cerrar ---- */
/* ---- LOTE Y SEMANAS SON DOS COSAS DISTINTAS ----
   En el cuaderno, cuando se vuelve a pedir el MISMO lote se le va apuntando al
   lado la semana en que se pidió: "260459454 -S15 -S16 -S18…". El número de lote
   sigue siendo 260459454; lo demás son las semanas. Aquí se guardan separados:
   `lote` es el código limpio y `semanas` es la lista de semanas de ese lote. */

/** Separa un texto de lote en {codigo, semanas}, quitando las -S## del final. */
function partirLoteYSemanas(texto){
  let t = String(texto==null ? '' : texto).trim();
  const semanas = [];
  /* Solo se quitan del FINAL y solo si la S lleva número detrás: así un código
     que termine en "-S" o que lleve una S por medio no se toca. */
  const cola = /[\s\-–/]*S[\s\-/]*(\d{1,2})\s*$/i;
  let m;
  while((m = t.match(cola))){
    semanas.unshift(parseInt(m[1], 10));
    t = t.slice(0, t.length - m[0].length).trim();
  }
  return {codigo: t.replace(/[\s\-–/]+$/, '').trim(), semanas};
}
/** Las semanas de un lote, ordenadas y sin repetir. */
function semanasDeLote(r){
  const out = [];
  const mete = v=>{
    const n = parseInt(v, 10);
    if(isFinite(n) && n>=1 && n<=53 && out.indexOf(n)<0) out.push(n);
  };
  (r.semanas || []).forEach(mete);
  if(!out.length){
    mete(r.semana);
    if(!out.length && r.fechaApertura) mete(getWeekNumber(r.fechaApertura));
  }
  return out.sort((a,b)=>a-b);
}
/** "S15 · S16 · S18" para enseñarlo en tablas e informes. */
function textoSemanas(r, sep){
  const s = semanasDeLote(r);
  return s.length ? s.map(n=>'S'+n).join(sep===undefined ? ' · ' : sep) : '';
}
/** Pasa los lotes viejos (con las semanas pegadas al código) al formato nuevo.
    Es idempotente: sobre un lote ya limpio no cambia nada. */
function normalizarLotes(){
  let tocados = 0;
  (DATA.lotesMP || []).forEach(r=>{
    const {codigo, semanas} = partirLoteYSemanas(r.lote);
    const previas = Array.isArray(r.semanas) ? r.semanas.slice() : [];
    const juntas = [];
    const mete = v=>{ const n=parseInt(v,10); if(isFinite(n)&&n>=1&&n<=53&&juntas.indexOf(n)<0) juntas.push(n); };
    previas.forEach(mete);
    semanas.forEach(mete);
    if(!juntas.length) mete(r.semana);
    if(!juntas.length && r.fechaApertura) mete(getWeekNumber(r.fechaApertura));
    juntas.sort((a,b)=>a-b);
    const cambia = (codigo !== r.lote) || juntas.join(',') !== previas.slice().sort((a,b)=>a-b).join(',');
    if(cambia){
      if(codigo) r.lote = codigo;
      r.semanas = juntas;
      if(juntas.length) r.semana = juntas[0];
      tocados++;
    }
  });
  return tocados;
}

/* Los lotes viejos guardaron el producto tal cual venía del albarán o con un
   nombre que luego se unificó. Aquí se reescribe al nombre bueno del cuaderno y
   se funden los que quedaron por duplicado (mismo producto y mismo lote). */
function normalizarNombresLotes(){
  const lista = DATA.lotesMP || [];
  let tocados = 0;
  lista.forEach(r=>{
    const bueno = resolverNombreProducto(r.producto);
    if(bueno && bueno !== r.producto){ r.producto = bueno; tocados++; }
  });
  const vistos = new Map();
  const fuera = [];
  lista.forEach(r=>{
    const clave = normTxt(r.producto)+'|'+normTxt(r.lote)+'|'+(r.fechaCierre?'C':'A');
    const previo = vistos.get(clave);
    if(!previo){ vistos.set(clave, r); return; }
    // se queda el que se abrió antes; el otro sobra
    const mejor = String(previo.fechaApertura||'9999') <= String(r.fechaApertura||'9999') ? previo : r;
    const sobra = mejor === previo ? r : previo;
    if(!mejor.fechaCierre && sobra.fechaCierre) mejor.fechaCierre = sobra.fechaCierre;
    const sem = (mejor.semanas||[]).concat(sobra.semanas||[])
      .filter((v,i,a)=>isFinite(v) && a.indexOf(v)===i).sort((a,b)=>a-b);
    if(sem.length){ mejor.semanas = sem; mejor.semana = sem[0]; }
    vistos.set(clave, mejor);
    fuera.push(sobra.id);
    tocados++;
  });
  if(fuera.length){
    DATA.lotesMP = lista.filter(r=>fuera.indexOf(r.id) < 0);
    fuera.forEach(id=>{ BAJAS[id] = Date.now(); });
  }
  return {tocados, fundidos: fuera.length};
}

function getWeekNumber(dateStr){
  if(!dateStr) return '';
  const d = new Date(dateStr+'T00:00:00');
  if(isNaN(d)) return '';
  const target = new Date(d.valueOf());
  const dayNr = (d.getDay()+6)%7;
  target.setDate(target.getDate()-dayNr+3);
  const firstThursday = new Date(target.getFullYear(),0,4);
  const diff = target - firstThursday;
  return 1 + Math.round(diff/(7*24*3600*1000));
}
function cantidadRecepcion(r){
  let cant = parseFloat(String(r.cantidad||'').replace(',','.'));
  if(isFinite(cant) && cant>0) return cant;
  const m = /Cantidad:\s*([\d.,]+)/.exec(r.observaciones||'');
  if(m){ const v = parseFloat(m[1].replace(',','.')); if(isFinite(v)&&v>0) return v; }
  return 1;
}
/** Todo lo recepcionado de un producto, agrupado por lote: cuánto entró, cuándo,
    de qué proveedor, cuándo caduca y cuántos envases de ese lote se han abierto ya. */
/* Los nombres del cuaderno son cortos ("Nata asturiana") y los del albarán son
   los del proveedor ("NATA ASTURIANA UHT 35.1 % MG 1X6 LIT"). Se consideran el
   mismo producto si uno contiene al otro entero, palabra por palabra. Se exige
   que el nombre corto tenga al menos dos palabras para no casar por casualidad. */
/* ---- EQUIVALENCIAS DE NOMBRES ----
   El cuaderno y el albarán llaman a lo mismo de maneras distintas. Esta tabla la

/* Los albaranes traen a veces el código del proveedor delante ("416117 AMBAR…").
   No forma parte del nombre. */
function limpiaCodigoProveedor(t){
  return String(t==null?'':t).replace(/^\s*\d{4,8}\s+/, '').trim();
}
/** Nombre bueno de un producto: si está en la tabla de equivalencias, el suyo. */
function resolverNombreProducto(t){
  const alias = (CONFIG && CONFIG.aliasProductos) || {};
  const k = normTxt(limpiaCodigoProveedor(t));
  return alias[k] || String(t==null?'':t).trim();
}

function mismoProducto(a, b){
  /* Primero la tabla de equivalencias, que es la que revisó Berta. Si alguno de
     los dos tiene nombre bueno asignado, manda eso y no se adivina nada más. */
  const ra = resolverNombreProducto(a), rb = resolverNombreProducto(b);
  const alias = (CONFIG && CONFIG.aliasProductos) || {};
  const tieneAlias = t => !!alias[normTxt(limpiaCodigoProveedor(t))];
  if(tieneAlias(a) || tieneAlias(b)) return normTxt(ra) === normTxt(rb);
  const x = normTxt(limpiaCodigoProveedor(a)), y = normTxt(limpiaCodigoProveedor(b));
  if(!x || !y) return false;
  if(x === y) return true;
  const corto = (x.length <= y.length ? x : y).split(' ').filter(Boolean);
  const largo = (x.length <= y.length ? y : x).split(' ').filter(Boolean);
  /* Dos palabras como mínimo y alguna de verdad (no "de", "1kg"…), para no
     emparejar productos distintos por casualidad. */
  if(corto.length < 2) return false;
  if(!corto.some(w=>w.length >= 4)) return false;
  /* El nombre del cuaderno es corto ("Nko Pro crema blanca") y el del albarán
     lleva cosas por medio ("NKO PRO CREMA RELLENO BLANCA c./ 6 kg"). Basta con
     que TODAS las palabras del corto estén en el largo, aunque no seguidas. */
  return corto.every(w=>largo.indexOf(w) >= 0);
}
/* Los números de lote tampoco se escriben igual en el cuaderno y en el albarán:
   "C61-26173" y "26173" son el mismo. Se comparan solo letras y números, y vale
   que uno contenga al otro si el corto tiene al menos cuatro caracteres. */
function mismoLote(a, b){
  const x = String(a==null?'':a).toLowerCase().replace(/[^a-z0-9]/g,'');
  const y = String(b==null?'':b).toLowerCase().replace(/[^a-z0-9]/g,'');
  if(!x || !y) return false;
  if(x === y) return true;
  const corto = x.length <= y.length ? x : y;
  const largo = x.length <= y.length ? y : x;
  if(corto.length < 4) return false;
  return largo.indexOf(corto) >= 0;
}
/* Todos los nombres de producto que conocemos (catálogo de lotes, catálogo de
   stock y los que ya tienen lote abierto). Sirve para desempatar. */
function nombresConocidos(){
  const out = [];
  const mete = n => { const t=String(n||'').trim(); if(t && out.indexOf(t)<0) out.push(t); };
  const cat = CONFIG.catalogoLotes || {};
  ['pasteleria','bajaRotacion','materiales'].forEach(k=>(cat[k]||[]).forEach(mete));
  (CONFIG.materiasPrimas||[]).forEach(m=>mete(m.nombre));
  (DATA.lotesMP||[]).forEach(r=>mete(r.producto));
  return out;
}
/* "BANDEJA CARTON ORO N.12" encaja con "Bandeja cartón nº12" y también con
   "Bandeja cartón oro nº12". Gana el que más palabras comparte: el del oro. Así
   un producto no se queda con las recepciones de su hermano más específico. */
function mejorProductoPara(descripcion, candidatos){
  let mejor = null, mejorPeso = -1;
  (candidatos || nombresConocidos()).forEach(nom=>{
    if(!mismoProducto(descripcion, nom)) return;
    const peso = normTxt(nom).split(' ').filter(Boolean).length;
    if(peso > mejorPeso){ mejor = nom; mejorPeso = peso; }
  });
  return mejor;
}
function lotesRecibidos(nombre){
  const key0 = String(nombre||'').trim().toLowerCase();
  if(!key0) return [];
  const porLote = {};
  const conocidos = nombresConocidos();
  DATA.recepcion
    .filter(r=>{
      if(!r.lote || !String(r.lote).trim()) return false;
      if(!mismoProducto(r.producto, nombre)) return false;
      /* Si otro producto del catálogo encaja mejor con esa descripción, la
         recepción es suya, no nuestra. */
      const mejor = mejorProductoPara(r.producto, conocidos);
      return !mejor || normTxt(mejor) === normTxt(nombre);
    })
    .forEach(r=>{
      const key = String(r.lote).trim().toLowerCase();
      if(!porLote[key]) porLote[key] = {lote:r.lote, cantidadRecibida:0, fecha:r.fecha,
                                        caducidad:r.caducidad, proveedor:r.proveedor, albaranes:[]};
      porLote[key].cantidadRecibida += cantidadRecepcion(r);
      porLote[key].albaranes.push({fecha:r.fecha, numAlbaran:r.numAlbaran||'', proveedor:r.proveedor||''});
      if(String(r.fecha||'') < String(porLote[key].fecha||'')){
        porLote[key].fecha = r.fecha; porLote[key].caducidad = r.caducidad;
      }
    });
  const aperturas = DATA.lotesMP.filter(r=>mismoProducto(r.producto, nombre));
  return Object.keys(porLote)
    .map(key=>({...porLote[key],
                abiertos: aperturas.filter(r=>mismoLote(r.lote, porLote[key].lote)).length}))
    .sort((a,b)=>String(a.fecha||'').localeCompare(String(b.fecha||'')));   // el más antiguo primero (FIFO)
}
/** Tabla para elegir de qué lote se abre el envase, y cerrar los que sigan abiertos.

    Ojo: los lotes que vinieron del cuaderno de papel llevan el nombre del papel
    ("Laser mix muffin Ken") y las recepciones llevan el del albarán del proveedor
    ("LASER MIX MUFFIN KEN 15 KG"). Por eso la tabla no se arma solo con lo
    recepcionado: se juntan también los envases que están abiertos aunque no
    tengan recepción que case, para poder cerrarlos igualmente. */
function pintarRecepcionesDelProducto(nombre){
  const host = document.getElementById('loteRecepciones');
  if(!host) return;
  if(!nombre){ host.innerHTML=''; return; }
  const clave = String(nombre).trim().toLowerCase();
  const recibidos = lotesRecibidos(nombre);
  const abiertos = DATA.lotesMP.filter(r=>!r.fechaCierre && mismoProducto(r.producto, nombre));

  /* Una fila por lote: lo recepcionado, más los envases abiertos cuyo número de
     lote no case con ninguna recepción (esos salen como "sin recepción"). */
  const filasLote = recibidos.slice();
  abiertos.forEach(r=>{
    const k = String(r.lote||'').trim();
    if(!k) return;
    if(filasLote.some(l=>mismoLote(l.lote, k))) return;
    filasLote.push({lote:r.lote, cantidadRecibida:0, fecha:r.fechaApertura,
                    caducidad:'', proveedor:'', abiertos:1, sinRecepcion:true});
  });
  if(!filasLote.length){
    host.innerHTML = `<p class="hint">No hay ninguna recepción registrada con lote para <strong>${esc(nombre)}</strong>, ni ningún envase abierto. Escribe el número de lote a mano arriba.</p>`;
    return;
  }
  filasLote.sort((a,b)=>String(a.fecha||'').localeCompare(String(b.fecha||'')));
  const primeroDisponible = filasLote.filter(l=>!l.sinRecepcion && l.abiertos < l.cantidadRecibida)[0];

  const filas = filasLote.map((l,i)=>{
    const quedan = l.cantidadRecibida - l.abiertos;
    const agotado = !l.sinRecepcion && quedan <= 0;
    const recomendado = primeroDisponible && l.lote === primeroDisponible.lote;
    const susAbiertos = abiertos.filter(r=>mismoLote(r.lote, l.lote));
    const cerrar = susAbiertos.map((r,k)=>{
      const idf = 'cierreFecha'+i+'_'+k;
      return `<div style="display:flex;align-items:center;gap:6px;margin-top:4px;flex-wrap:wrap;">
        <span class="badge warn">abierto ${fmtDate(r.fechaApertura)}</span>
        <input type="date" id="${idf}" value="${todayStr()}" style="width:150px;">
        <button class="btn secondary small" type="button" onclick="cerrarLoteMP('${r.id}','${idf}')">Cerrar lote</button>
      </div>`;
    }).join('');
    return `<tr${agotado && !susAbiertos.length ?' style="opacity:.55"':''}>
      <td class="mono">${esc(l.lote)}${recomendado?' <span class="badge ok">usar este</span>':''}${agotado?' <span class="badge">agotado</span>':''}</td>
      <td class="mono">${fmtDate(l.fecha)}${l.sinRecepcion?' <span class="hint">(apertura)</span>':''}</td>
      <td class="mono">${l.caducidad?fmtDate(l.caducidad):'—'}</td>
      <td>${esc(l.proveedor)||'—'}</td>
      <td class="mono">${l.sinRecepcion?'sin recepción':(quedan+' de '+l.cantidadRecibida)}</td>
      <td><button class="btn ${recomendado?'':'secondary'} small" type="button"
            onclick="elegirLoteRecibido('${esc(l.lote).replace(/'/g,"\\'")}')">Abrir este</button>${cerrar}</td>
    </tr>`;
  }).join('');

  const nAb = abiertos.length;
  host.innerHTML = `<p class="hint" style="margin:0 0 6px;">Lotes de <strong>${esc(nombre)}</strong> — de lo más antiguo a lo más nuevo. Se gasta primero el de arriba (FIFO).`
    + (nAb ? ` Hay <strong>${nAb}</strong> envase${nAb===1?'':'s'} sin cerrar: si ya se acabó en el obrador, ciérralo aquí con la fecha que tocaba.` : '')
    + `</p>` + table(['Lote','Recibido','Caduca','Proveedor','Sin abrir',''], [filas]);
}
function elegirLoteRecibido(lote){
  const inp = document.getElementById('loteInputLote');
  if(inp){ inp.value = lote; try{ inp.focus(); }catch(e){} }
}
function loteMasAntiguoDisponible(nombre){
  const key0 = nombre.trim().toLowerCase();
  const porLote = {};
  DATA.recepcion
    .filter(r=>r.producto.trim().toLowerCase()===key0 && r.lote && r.lote.trim())
    .forEach(r=>{
      const key = r.lote.trim().toLowerCase();
      const cant = cantidadRecepcion(r);
      if(!porLote[key]) porLote[key] = {lote:r.lote, cantidadRecibida:0, fecha:r.fecha, caducidad:r.caducidad, proveedor:r.proveedor};
      porLote[key].cantidadRecibida += cant;
      if(r.fecha < porLote[key].fecha){ porLote[key].fecha = r.fecha; porLote[key].caducidad = r.caducidad; }
    });
  const abiertosPorLote = {};
  DATA.lotesMP.filter(r=>r.producto.trim().toLowerCase()===key0).forEach(r=>{
    const key = r.lote.trim().toLowerCase();
    abiertosPorLote[key] = (abiertosPorLote[key]||0)+1;
  });
  const disponibles = Object.keys(porLote)
    .map(key=>({...porLote[key], abiertos: abiertosPorLote[key]||0}))
    .filter(l=>l.abiertos < l.cantidadRecibida)
    .sort((a,b)=>a.fecha.localeCompare(b.fecha));
  return disponibles.length ? disponibles[0] : null;
}
/** Producto elegido: del desplegable, o el escrito a mano si se eligió "Otro producto". */
function productoLoteElegido(){
  const sel = document.getElementById('loteProductoSel');
  if(!sel) return '';
  if(sel.value === '__otro__'){
    const t = document.getElementById('loteOtroNombre');
    return t ? t.value.trim() : '';
  }
  return sel.value;
}
function usarMismoLote(){
  const nombre = productoLoteElegido();
  const loteInput = document.getElementById('loteInputLote');
  if(!nombre){ alert('Elige primero un producto.'); return; }
  const anteriores = DATA.lotesMP
    .filter(r=>r.producto.trim().toLowerCase()===nombre.trim().toLowerCase())
    .sort((a,b)=> (b.fechaApertura||'').localeCompare(a.fechaApertura||''));
  if(anteriores.length===0){ alert('Todavía no hay ningún lote anterior registrado para este producto — escribe el número a mano esta primera vez.'); return; }
  loteInput.value = anteriores[0].lote;
}
function mostrarInfoProductoLote(){
  const sel = document.getElementById('loteProductoSel');
  const otro = document.getElementById('loteOtroWrap');
  const otroInput = document.getElementById('loteOtroNombre');
  if(otro) otro.hidden = !sel || sel.value !== '__otro__';
  if(sel && sel.value === '__otro__' && otroInput){
    otroInput.required = true;
    try{ otroInput.focus(); }catch(e){}
  } else if(otroInput){ otroInput.required = false; }
  const nombre = productoLoteElegido();
  const info = document.getElementById('loteInfoProducto');
  const loteInput = document.getElementById('loteInputLote');
  if(!nombre){ info.innerHTML=''; return; }
  const m = CONFIG.materiasPrimas.find(x=>x.nombre===nombre);
  const abierto = DATA.lotesMP.find(r=>!r.fechaCierre && r.producto.trim().toLowerCase()===nombre.trim().toLowerCase());
  let html = `<p class="hint" style="margin:0;">Stock disponible: <strong>${m?m.stockActual:'—'} ${m?esc(m.unidad):''}</strong>${m&&m.proveedor?' · Proveedor: '+esc(m.proveedor):''}</p>`;
  if(abierto){
    html += `<p class="hint" style="margin:4px 0 0;color:var(--warn);">⚠ Ya hay un lote abierto: <strong>${esc(abierto.lote)}</strong> (desde ${fmtDate(abierto.fechaApertura)}). Se te pedirá cerrarlo al abrir el nuevo.</p>`;
  }
  pintarRecepcionesDelProducto(nombre);
  const antiguo = loteMasAntiguoDisponible(nombre);
  if(loteInput) loteInput.value = '';
  if(antiguo){
    const quedan = antiguo.cantidadRecibida - antiguo.abiertos;
    html += `<p class="hint" style="margin:4px 0 0;color:var(--ok);">📦 Lote más antiguo recibido (usa este primero — FIFO): <strong>${esc(antiguo.lote)}</strong>, recibido el ${fmtDate(antiguo.fecha)}${antiguo.caducidad?', caduca el '+fmtDate(antiguo.caducidad):''}, proveedor ${esc(antiguo.proveedor)||'—'}. Quedan ${quedan} de ${antiguo.cantidadRecibida} unidad(es) por abrir de este lote.</p>`;
    if(loteInput) loteInput.value = antiguo.lote;
  } else {
    html += `<p class="hint" style="margin:4px 0 0;">No hay ninguna recepción registrada con lote para este producto todavía; escribe el lote a mano.</p>`;
  }
  info.innerHTML = html;
}
async function abrirLoteMP(producto, lote, fechaApertura, semana, sinPreguntar){
  const par = partirLoteYSemanas(lote);
  const codigo = par.codigo || String(lote||'').trim();
  let sem = (semana===undefined || semana===null || String(semana).trim()==='')
            ? getWeekNumber(fechaApertura) : parseInt(semana,10);
  if(!isFinite(sem)) sem = getWeekNumber(fechaApertura);
  const sems = [];
  const mete = v=>{ const n=parseInt(v,10); if(isFinite(n)&&n>=1&&n<=53&&sems.indexOf(n)<0) sems.push(n); };
  par.semanas.forEach(mete); mete(sem);
  sems.sort((a,b)=>a-b);

  const mismoCodigo = r => String(r.producto||'').trim().toLowerCase()===producto.trim().toLowerCase()
                        && String(r.lote||'').trim().toLowerCase()===codigo.toLowerCase();

  /* MISMO LOTE OTRA VEZ. En el cuaderno no se abre un casillero nuevo: se le
     apunta al lado la semana en que se ha vuelto a pedir. Aquí igual: se añade
     la semana al lote que ya existe y no se duplica el registro. */
  const yaRegistrado = DATA.lotesMP.find(r=>mismoCodigo(r) && !r.fechaCierre)
                    || DATA.lotesMP.find(mismoCodigo);
  if(yaRegistrado){
    const antes = semanasDeLote(yaRegistrado);
    const nuevas = sems.filter(n=>antes.indexOf(n)<0);
    const juntas = antes.concat(nuevas).sort((a,b)=>a-b);
    const cerrado = !!yaRegistrado.fechaCierre;
    const aviso = 'El lote ' + codigo + ' de "' + producto + '" ya está registrado'
      + (cerrado ? ' y se cerró el ' + fmtDate(yaRegistrado.fechaCierre) : '')
      + ' con ' + (antes.length ? 'la' + (antes.length>1?'s':'') + ' semana' + (antes.length>1?'s':'') + ' ' + antes.map(n=>'S'+n).join(' ') : 'sin semanas')
      + '.\n\n'
      + (nuevas.length
          ? 'Aceptar: es el mismo lote y le añado ' + (nuevas.length>1?'las semanas ':'la semana ') + nuevas.map(n=>'S'+n).join(' ') + (cerrado ? ' y lo vuelvo a abrir.' : '.') 
          : 'Esa semana ya la tiene apuntada.')
      + '\n\nCancelar: es un lote distinto y lo registro aparte.';
    if(sinPreguntar || confirm(aviso)){
      yaRegistrado.semanas = juntas;
      yaRegistrado.semana = juntas[0] !== undefined ? juntas[0] : yaRegistrado.semana;
      if(cerrado) yaRegistrado.fechaCierre = '';
      await saveModule('lotesMP');
      const ix = CONFIG.materiasPrimas.findIndex(m=>m.nombre.trim().toLowerCase()===producto.trim().toLowerCase());
      if(ix>=0){ CONFIG.materiasPrimas[ix].stockActual = Math.max(0, CONFIG.materiasPrimas[ix].stockActual - 1); await saveConfig(); }
      viewMateriasPrimas();
      renderDashboard();
      return;
    }
  }

  const abierto = DATA.lotesMP.find(r=>!r.fechaCierre && r.producto.trim().toLowerCase()===producto.trim().toLowerCase());
  if(abierto){
    if(confirm(`Ya hay un lote abierto para "${producto}" (lote ${abierto.lote}). ¿Cerrarlo hoy y abrir el nuevo?`)){
      abierto.fechaCierre = todayStr();
    } else {
      return;
    }
  }
  DATA.lotesMP.unshift({id:uid(), producto, lote:codigo, fechaApertura, fechaCierre:'',
                        semana: sems[0], semanas: sems});
  await saveModule('lotesMP');
  /* Un producto escrito a mano se queda en el catálogo: la próxima vez sale en la
     lista y todo el mundo lo abre con el mismo nombre. */
  const cat = CONFIG.catalogoLotes = CONFIG.catalogoLotes || {pasteleria:[], bajaRotacion:[], materiales:[]};
  const yaEsta = Object.keys(cat).some(k=>(cat[k]||[]).some(n=>String(n).trim().toLowerCase()===producto.trim().toLowerCase()))
    || CONFIG.materiasPrimas.some(m=>m.nombre.trim().toLowerCase()===producto.trim().toLowerCase());
  if(!yaEsta){ (cat.pasteleria = cat.pasteleria || []).push(producto.trim()); await saveConfig(); }
  const idx = CONFIG.materiasPrimas.findIndex(m=>m.nombre.trim().toLowerCase()===producto.trim().toLowerCase());
  if(idx>=0){ CONFIG.materiasPrimas[idx].stockActual = Math.max(0, CONFIG.materiasPrimas[idx].stockActual - 1); await saveConfig(); }
  viewMateriasPrimas();
  renderDashboard();
}
/* ---- AL CERRAR UN LOTE, ABRIR EL SIGUIENTE ----
   Cuando se termina un envase, lo normal es coger otro ahí mismo. La app propone
   cuál toca por orden de recepción (el más antiguo primero, FIFO): si del mismo
   lote quedan envases sin abrir, ese; y si no, el lote que se recibió antes. */
function siguienteEnvase(producto, loteCerrado){
  const recibidos = lotesRecibidos(producto);          // ya viene ordenado por fecha, FIFO
  if(!recibidos.length) return null;
  const k = String(loteCerrado||'').trim().toLowerCase();

  /* 1) ¿Quedan envases sin abrir del MISMO lote? Entonces es el mismo lote otra vez. */
  const mismo = recibidos.find(x=>String(x.lote).trim().toLowerCase()===k);
  if(mismo){
    const restantes = mismo.cantidadRecibida - mismo.abiertos;
    if(restantes > 0) return {tipo:'mismo', restantes, ...mismo};
  }
  /* 2) Si no, el lote recibido más antiguo que todavía no se ha abierto nunca. */
  const nuevo = recibidos.find(x=>x.abiertos===0 && String(x.lote).trim().toLowerCase()!==k);
  if(nuevo) return {tipo:'nuevo', restantes: nuevo.cantidadRecibida, ...nuevo,
                    otros: recibidos.filter(x=>x.abiertos===0 && String(x.lote).trim().toLowerCase()!==k).length - 1};
  return null;
}
/** Pregunta si se abre el siguiente envase justo después de cerrar uno. */
/** Deja el formulario de "Abrir nuevo lote" preparado con el producto puesto. */
function prepararAltaLoteManual(producto){
  const sel = document.getElementById('loteProductoSel');
  if(!sel) return false;
  const opcion = [...sel.options].find(o=>o.value && o.value!=='__otro__' && normTxt(o.value)===normTxt(producto));
  if(opcion){
    sel.value = opcion.value;
  } else {
    sel.value = '__otro__';
    mostrarInfoProductoLote();
    const otroInput = document.getElementById('loteOtroNombre');
    if(otroInput) otroInput.value = producto;
  }
  mostrarInfoProductoLote();
  const loteInput = document.getElementById('loteInputLote');
  const form = document.getElementById('form-lotesmp') || (loteInput && loteInput.closest('.panel'));
  if(form) form.scrollIntoView({behavior:'smooth', block:'center'});
  if(loteInput){ loteInput.value = ''; setTimeout(()=>{ try{ loteInput.focus(); }catch(e){} }, 400); }
  return true;
}
async function proponerSiguienteEnvase(producto, loteCerrado){
  const sig = siguienteEnvase(producto, loteCerrado);
  /* Sin recepción pendiente: o se apunta el lote a mano, o se espera al albarán. */
  if(!sig){
    const hayAlgo = lotesRecibidos(producto).length > 0;
    const aviso = 'Has cerrado el lote ' + loteCerrado + ' de "' + producto + '".\n\n'
      + (hayAlgo
          ? 'No queda ninguna recepción de este producto sin abrir.'
          : 'No hay ninguna recepción registrada de este producto.')
      + '\n\nAceptar: apunto el lote nuevo a mano ahora (te dejo el formulario preparado).'
      + '\nCancelar: se queda sin lote abierto hasta que se registre el albarán.';
    if(confirm(aviso)){
      if(!prepararAltaLoteManual(producto)){
        alert('Abre el lote desde "Abrir nuevo lote", en esta misma pantalla.');
      }
    }
    return;
  }
  const hoy = todayStr();
  const caducado = sig.caducidad && String(sig.caducidad) < hoy;
  const linea = [
    'Lote ' + sig.lote,
    sig.fecha ? 'recibido el ' + fmtDate(sig.fecha) : null,
    sig.caducidad ? (caducado ? '¡CADUCADO el ' + fmtDate(sig.caducidad) + '!' : 'caduca el ' + fmtDate(sig.caducidad)) : null,
    sig.proveedor ? 'de ' + sig.proveedor : null
  ].filter(Boolean).join(' · ');

  const cabecera = sig.tipo === 'mismo'
    ? 'Acabas de cerrar el lote ' + loteCerrado + ' de "' + producto + '".\n\n'
      + 'Todavía quedan ' + sig.restantes + ' sin abrir de ESE MISMO lote.'
    : 'Acabas de cerrar el lote ' + loteCerrado + ' de "' + producto + '".\n\n'
      + 'El siguiente que toca por fecha de recepción es:';
  const cola = (sig.tipo === 'nuevo' && sig.otros > 0)
    ? '\n\n(Hay ' + sig.otros + ' lote' + (sig.otros===1?'':'s') + ' más sin abrir; este es el más antiguo.)' : '';

  if(!confirm(cabecera + '\n\n' + linea + cola + '\n\n¿Lo abro ahora con fecha de hoy?')) return;
  if(caducado && !confirm('OJO: ese lote figura como caducado el ' + fmtDate(sig.caducidad) + '.\n\n¿Aun así quieres abrirlo?')) return;
  await abrirLoteMP(producto, sig.lote, hoy, getWeekNumber(hoy), true);
}

async function cerrarLoteMP(id, idInputFecha){
  const rec = DATA.lotesMP.find(r=>r.id===id);
  if(!rec) return;
  /* Puede cerrarse con fecha anterior: a veces el envase se acaba en el obrador
     y no se apunta hasta días después. La fecha de cierre debe ser la de verdad. */
  let fecha = todayStr();
  if(idInputFecha){
    const inp = document.getElementById(idInputFecha);
    if(inp && inp.value) fecha = inp.value;
  }
  if(fecha < String(rec.fechaApertura||'')){
    alert('La fecha de cierre no puede ser anterior a la de apertura ('+fmtDate(rec.fechaApertura)+').');
    return;
  }
  /* Cerrar NO borra: el lote se queda para siempre en el registro de materias
     primas (T1 · Traza 1-10) que se imprime para la inspección. Solo deja de
     estar en la lista de lotes abiertos. */
  rec.fechaCierre = fecha;
  await saveModule('lotesMP');
  renderLotesAbiertos();
  renderLotesMPTable();
  const sel = document.getElementById('loteProductoSel');
  if(sel) pintarRecepcionesDelProducto(productoLoteElegido());
  renderDashboard();
  /* Se acaba un envase: se pregunta ahí mismo si se abre el siguiente. */
  await proponerSiguienteEnvase(rec.producto, rec.lote);
}
/** Rellena el desplegable con los productos que de verdad tienen lotes.
    Lo que se escribe en la casilla de buscar va acotando la lista, para no
    tener que bajar por 80 nombres buscando el que quieres. */
function poblarSelectProductosLote(id, lista, texto){
  const sel = document.getElementById(id);
  if(!sel) return;
  const previo = sel.value;
  const q = (texto||'').trim().toLowerCase();
  let nombres = [...new Set(lista.map(r=>r.producto).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'es'));
  if(q) nombres = nombres.filter(n=>n.toLowerCase().includes(q));
  sel.innerHTML = `<option value="">${q ? nombres.length+' producto'+(nombres.length===1?'':'s')+' con «'+esc(texto.trim())+'»' : 'Elige un producto…'}</option>` +
    nombres.map(n=>`<option value="${esc(n)}">${esc(n)}</option>`).join('');
  sel.value = nombres.indexOf(previo)>=0 ? previo : '';
}
/** Deja solo los lotes que casan con lo escrito y con el producto elegido. */
function filtraLotes(lista, idBuscar, idProducto){
  const b = document.getElementById(idBuscar);
  const pr = document.getElementById(idProducto);
  const q = (b ? b.value : '').trim().toLowerCase();
  const prod = pr ? pr.value : '';
  return lista.filter(r=>{
    if(prod && r.producto !== prod) return false;
    if(!q) return true;
    return ((r.producto||'')+' '+(r.lote||'')).toLowerCase().includes(q);
  });
}
/* El desplegable de lotes abiertos enseña la lista entera de una vez, como el de
   "Abrir nuevo lote": cada línea es un lote con su producto, su número, su semana
   y el día que se abrió, para poder elegirlo sin tener que escribir nada. */
function etiquetaLoteAbierto(r){
  const sem = textoSemanas(r, ' ');
  return String(r.producto||'') + ' — ' + String(r.lote||'sin lote')
       + (sem ? ' · ' + sem : '')
       + (r.fechaApertura ? ' · abierto ' + fmtDate(r.fechaApertura) : '');
}
function poblarSelectLotesAbiertos(abiertos, texto){
  const sel = document.getElementById('lotesAbProducto');
  if(!sel) return;
  const previo = sel.value;
  const q = (texto||'').trim().toLowerCase();
  const casa = r => !q || String(r.producto||'').toLowerCase().includes(q)
                      || String(r.lote||'').toLowerCase().includes(q);
  const lista = abiertos.filter(casa).sort((a,b)=>{
    const p = String(a.producto||'').localeCompare(String(b.producto||''),'es');
    return p !== 0 ? p : String(b.fechaApertura||'').localeCompare(String(a.fechaApertura||''));
  });
  const cabecera = q
    ? `<option value="">${lista.length} lote${lista.length===1?'':'s'} con «${esc(texto.trim())}»</option>`
    : `<option value="">Selecciona un lote…  (${lista.length} abiertos)</option>`;
  sel.innerHTML = cabecera + lista.map(r=>`<option value="${esc(r.id)}">${esc(etiquetaLoteAbierto(r))}</option>`).join('');
  sel.value = lista.some(r=>r.id===previo) ? previo : '';
}
function renderLotesAbiertos(){
  const todos = DATA.lotesMP.filter(r=>!r.fechaCierre);
  const b = document.getElementById('lotesAbBuscar');
  const q = b ? b.value.trim() : '';
  poblarSelectLotesAbiertos(todos, q);
  const pr = document.getElementById('lotesAbProducto');
  const elegido = pr ? pr.value : '';
  const host = document.getElementById('lotes-abiertos-table');
  if(!host) return;

  let abiertos;
  if(elegido){
    abiertos = todos.filter(r=>r.id===elegido);          // el desplegable manda
  } else if(q){
    const k = q.toLowerCase();
    abiertos = todos.filter(r=> String(r.producto||'').toLowerCase().includes(k)
                             || String(r.lote||'').toLowerCase().includes(k));
  } else {
    host.innerHTML = `<p class="hint">Hay <strong>${todos.length}</strong> lotes abiertos. Despliega la lista de arriba y elige uno, o escribe el producto (o su número de lote) para acotarla.</p>`;
    return;
  }
  abiertos = abiertos.slice().sort((a,b2)=>String(b2.fechaApertura||'').localeCompare(String(a.fechaApertura||'')));
  if(!abiertos.length){
    host.innerHTML = '<p class="hint">Ningún lote abierto con esa búsqueda.</p>';
    return;
  }
  const rows = abiertos.map(r=>`<tr>
    <td>${esc(r.producto)}</td><td class="mono">${esc(r.lote)}</td><td class="mono semanas">${esc(textoSemanas(r,' '))}</td><td class="mono">${fmtDate(r.fechaApertura)}</td>
    <td><span class="cierre-linea"><input type="date" id="abCierre_${esc(r.id)}" value="${todayStr()}" min="${esc(r.fechaApertura||'')}">
      <button class="btn secondary small" onclick="cerrarLoteMP('${r.id}','abCierre_${r.id}')">Cerrar lote</button></span></td>
  </tr>`);
  host.innerHTML = table(['Producto','Lote','Semanas','F. apertura',''], rows);
}
function renderLotesMPTable(){
  const b = document.getElementById('lotesHistBuscar');
  const pr = document.getElementById('lotesHistProducto');
  const q = b ? b.value.trim() : '';
  poblarSelectProductosLote('lotesHistProducto', DATA.lotesMP, q);
  const est = document.getElementById('lotesHistEstado');
  const estado = est ? est.value : '';
  const host = document.getElementById('lotesmp-table');
  const cuenta = document.getElementById('lotesHistCuenta');
  if(!q && !(pr && pr.value)){
    if(host) host.innerHTML = `<p class="hint">Hay <strong>${DATA.lotesMP.length}</strong> lotes registrados. Escribe el producto (o su número de lote) arriba, o elígelo en el desplegable, para ver su historial.</p>`;
    if(cuenta) cuenta.textContent = '';
    return;
  }
  let lista = filtraLotes(DATA.lotesMP, 'lotesHistBuscar', 'lotesHistProducto');
  if(estado==='abierto') lista = lista.filter(r=>!r.fechaCierre);
  if(estado==='cerrado') lista = lista.filter(r=>r.fechaCierre);
  lista = lista.slice().sort((a,b2)=>String(b2.fechaApertura||'').localeCompare(String(a.fechaApertura||'')));
  if(cuenta) cuenta.textContent = lista.length+' lote'+(lista.length===1?'':'s')+' de '+DATA.lotesMP.length+' en total';
  if(!lista.length){
    if(host) host.innerHTML = '<p class="hint">Ningún lote con esa búsqueda.</p>';
    return;
  }
  const rows = lista.map(r=>`<tr>
    <td>${esc(r.producto)}</td><td class="mono">${esc(r.lote)}</td><td class="mono semanas">${esc(textoSemanas(r,' '))}</td>
    <td class="mono">${fmtDate(r.fechaApertura)}</td><td class="mono">${r.fechaCierre?fmtDate(r.fechaCierre):'—'}</td>
    <td>${r.fechaCierre
      ? '<span class="hint">Cerrado</span>'
      : `<span class="cierre-linea"><input type="date" id="histCierre_${r.id}" value="${todayStr()}" min="${esc(r.fechaApertura||'')}">`
        + `<button class="btn secondary small" onclick="cerrarLoteMP('${r.id}','histCierre_${r.id}')">Cerrar lote</button></span>`}</td>
  </tr>`);
  document.getElementById('lotesmp-table').innerHTML = table(['Producto','Lote','Semanas','F. apertura','F. cierre',''], rows);
}
async function registrarEntradaStock(nombre, proveedor, cantidadStr){
  if(!nombre || !nombre.trim()) return null;
  let cantidad = parseFloat(String(cantidadStr).replace(',','.'));
  if(!isFinite(cantidad) || cantidad<=0) cantidad = 1;
  const idx = CONFIG.materiasPrimas.findIndex(m=>m.nombre.trim().toLowerCase()===nombre.trim().toLowerCase());
  if(idx>=0){
    CONFIG.materiasPrimas[idx].stockActual += cantidad;
    if(proveedor && proveedor.trim()) CONFIG.materiasPrimas[idx].proveedor = proveedor.trim();
    return CONFIG.materiasPrimas[idx].nombre;
  }
  CONFIG.materiasPrimas.push({nombre:nombre.trim(), categoria:'', proveedor:proveedor?proveedor.trim():'', telefono:'', unidad:'unidades', stockMinimo:1, stockActual:cantidad});
  return nombre.trim();
}

/* En el papel un enlace no se puede pinchar, así que en el dossier se dice
   cuántas hojas tiene el parte y si ya están guardadas en Drive. */
function enlacesParte(r){
  const fotos = r.fotos || [];
  if(!fotos.length) return 'Sin parte adjunto';
  const pdfs = fotos.filter(f=>esPdf(f.mime, f.nombre)).length;
  const imgs = fotos.length - pdfs;
  const trozos = [];
  if(imgs) trozos.push(imgs + ' foto' + (imgs===1?'':'s'));
  if(pdfs) trozos.push(pdfs + ' PDF');
  const subidas = fotos.filter(f=>f.estado==='subida').length;
  const n = trozos.join(' y ');
  if(subidas === fotos.length) return n + ' · en Drive';
  if(subidas === 0) return n + ' · pendiente de subir';
  return n + ' · ' + subidas + ' en Drive';
}
function flattenTemperaturas(desde, hasta){
  const out = [];
  Object.keys(DATA.temperaturas).sort().forEach(key=>{
    const [y,m] = key.split('-').map(Number);
    DATA.temperaturas[key].forEach(row=>{
      const fecha = key+'-'+String(row.day).padStart(2,'0');
      if(desde && fecha<desde) return;
      if(hasta && fecha>hasta) return;
      CONFIG.equipos.forEach(e=>{
        const v = row.valores[e.nombre];
        if(v===undefined || v==='') return;
        const estado = within(parseFloat(v), e.min, e.max) ? 'OK' : 'ALERTA';
        out.push({fecha, equipo:e.nombre, valor:v, estado, responsable:row.responsable, incidencia:row.incidencia});
      });
    });
  });
  return out;
}

/* ================= DOSSIER DE INSPECCIÓN =================
   Genera de golpe TODOS los registros del APPCC hasta una fecha, con la misma
   forma que los cuadernos de papel: las rejillas mensuales como rejillas y los
   listados como listados, cada hoja con su cabecera de empresa y su código de
   traza. Pensado para imprimir o guardar en PDF y entregárselo al inspector. */

function rangoFechasDossier(){
  const d = document.getElementById('dosDesde');
  const h = document.getElementById('dosHasta');
  return { desde: d && d.value ? d.value : '', hasta: h && h.value ? h.value : todayStr() };
}
function dentro(f, desde, hasta){
  if(!f) return false;
  if(desde && f < desde) return false;
  if(hasta && f > hasta) return false;
  return true;
}
/** Fecha del registro más antiguo que hay guardado (para el historial completo). */
function primeraFechaConDatos(){
  let min = '';
  const mira = f => { if(f && /^\d{4}-\d{2}-\d{2}$/.test(f) && (!min || f < min)) min = f; };
  Object.keys(DATA.temperaturas||{}).forEach(mes=>{
    (DATA.temperaturas[mes]||[]).forEach(r=> mira(mes+'-'+String(r.day).padStart(2,'0')) );
  });
  (DATA.produccion||[]).forEach(r=> mira(r.fecha));
  Object.keys(MODULE_META).forEach(k=>{
    (DATA[k]||[]).forEach(r=>{ mira(r.fecha); mira(r.fechaApertura); mira(r.fechaCierre); });
  });
  return min;
}
/** Meses (YYYY-MM) que hay que sacar, según el rango pedido. */
function mesesDelRango(desde, hasta){
  const fin = hasta || todayStr();
  const ini = desde || fin.slice(0,7)+'-01';
  const out = [];
  let y = +ini.slice(0,4), m = +ini.slice(5,7);
  const yf = +fin.slice(0,4), mf = +fin.slice(5,7);
  while(y < yf || (y===yf && m <= mf)){
    out.push(y+'-'+String(m).padStart(2,'0'));
    m++; if(m>12){ m=1; y++; }
    if(out.length>120) break;
  }
  return out;
}

function hojaTemperaturas(mes, desde, hasta){
  const filas = DATA.temperaturas[mes];
  if(!filas) return '';
  const [y,m] = mes.split('-').map(Number);
  const nDias = daysInMonth(y,m);
  const equipos = CONFIG.equipos || [];
  let hay = false;
  let cuerpo = '';
  for(let d=1; d<=nDias; d++){
    const f = mes+'-'+String(d).padStart(2,'0');
    if(!dentro(f, desde, hasta)) continue;
    const row = filas.find(x=>Number(x.day)===d) || {valores:{}, responsable:'', incidencia:''};
    const celdas = equipos.map(e=>{
      const v = (row.valores||{})[e.nombre];
      if(v!==undefined && v!=='') hay = true;
      const fuera = (v!==undefined && v!=='' && isFinite(v)) ? !within(parseFloat(v), e.min, e.max) : false;
      return `<td class="n${fuera?' malo':''}">${v!==undefined?esc(v):''}</td>`;
    }).join('');
    if(row.responsable || row.incidencia) hay = true;
    cuerpo += `<tr><td class="n">${d}</td>${celdas}<td>${esc(row.responsable||'')}</td><td>${esc(row.incidencia||'')}</td></tr>`;

/* ---- Hoja mensual de aceite y desinfección de fruta (R.02.07) ----
   Calcada del cuaderno: los 31 días en vertical y, a lo ancho, en temporada
   (pestiños/torrijas), susos, bombas, tiempo y temperatura, el control visual de
   acrilamida en tres casillas, el bloque de aceite (relleno, cambio, compuestos
   polares, limpieza y quién lo hizo), la vigilancia y la desinfección de fruta. */
function hojaAceite(mes, desde, hasta){
  const [y,m] = mes.split('-').map(Number);
  const nDias = daysInMonth(y,m);
  const porDia = {};
  (DATA.aceite||[]).forEach(r=>{
    if(String(r.fecha||'').slice(0,7) !== mes) return;
    if(!dentro(r.fecha, desde, hasta)) return;
    const d = Number(String(r.fecha).slice(8,10));
    (porDia[d] = porDia[d] || []).push(r);
  });
  if(!Object.keys(porDia).length) return '';

  /* Si la freidora se usó dos veces el mismo día, los valores se juntan con "/",
     igual que cuando en el papel se escriben dos cifras en la misma casilla. */
  const junta = (regs, f)=>{
    const vs = regs.map(f).map(v=> v===undefined||v===null ? '' : String(v).trim() ).filter(Boolean);
    return [...new Set(vs)].join(' / ');
  };
  const equis = (regs, f)=> regs.some(f) ? '✕' : '';

  let cuerpo = '';
  for(let d=1; d<=nDias; d++){
    const f = mes+'-'+String(d).padStart(2,'0');
    const regs = porDia[d] || [];
    const vacio = !regs.length;
    const c = [
      junta(regs, r=>r.pestinos), junta(regs, r=>r.torrijas),
    ];
    const acri = a => equis(regs, r=> String(r.acrilamida||'').toLowerCase() === a);
    cuerpo += `<tr${vacio?'':' class="con-datos"'}>`
      + `<td>${esc(c[0])}</td><td>${esc(c[1])}</td>`
      + `<td class="n dia">${d}</td>`
      + `<td class="n">${esc(junta(regs, r=>r.susos))}</td>`
      + `<td class="n">${esc(junta(regs, r=>r.bombas))}</td>`
      + `<td class="n">${esc(junta(regs, r=>r.tiempo))}</td>`
      + `<td class="n">${esc(junta(regs, r=>r.temperatura))}</td>`
      + `<td class="n">${acri('dorado claro')}</td>`
      + `<td class="n">${acri('dorado amarillo')}</td>`
      + `<td class="n">${acri('dorado marrón')}</td>`
      + `<td class="n">${equis(regs, r=>r.relleno)}</td>`
      + `<td class="n">${regs.some(r=>r.aceiteNuevo)?'SÍ':''}</td>`
      + `<td class="n${regs.some(r=>r.estado==='CAMBIAR')?' malo':''}">${esc(junta(regs, r=>r.polares))}</td>`
      + `<td class="n">${equis(regs, r=>r.limpiezaAparato)}</td>`
      + `<td>${esc(junta(regs, r=>r.quienAccion))}</td>`
      + `<td class="n">${esc(junta(regs, r=>r.vigilancia))}</td>`
      + `<td>${esc(junta(regs, r=>r.quienVigila))}</td>`
      + `<td>${esc(junta(regs, r=>r.fruta))}</td>`
      + `<td class="n">${esc(junta(regs, r=>r.frutaHecho))}</td>`
      + `<td>${esc(junta(regs, r=>r.quienFruta))}</td>`
      + `</tr>`;
  }
  return `<section class="hoja ancha hoja-aceite">
    ${cabeceraHoja('Registro de control de aceite y desinfección de fruta natural','R.02.07.2021', nombreMes(mes))}
    <table class="rejilla papel-aceite">
      <thead>
        <tr>
          <th colspan="2" class="grupo-cab">EN TEMPORADA</th>
          <th rowspan="2">FECHA</th>
          <th rowspan="2">SUSOS</th>
          <th rowspan="2">BOMBAS</th>
          <th rowspan="2">tiempo</th>
          <th rowspan="2">Temp</th>
          <th colspan="3" class="grupo-cab">ACRILAMIDA · CONTROL VISUAL</th>
          <th colspan="5" class="grupo-cab">ACEITE</th>
          <th colspan="2" class="grupo-cab">VIGILANCIA</th>
          <th colspan="3" class="grupo-cab">FRUTA DESINFECCIÓN <span class="lim">(dilución 5 L · 2 cucharillas)</span></th>
        </tr>
        <tr>
          <th>PESTIÑOS Y<br>BORRACHUELOS</th><th>TORRIJAS</th>
          <th>DORADO<br>CLARO</th><th>DORADO<br>AMARILLO</th><th>DORADO<br>MARRÓN</th>
          <th>RELLENO</th><th>CAMBIO<br>¿SÍ/NO?</th><th>COMP.<br>POLARES</th><th>LIMPIEZA<br>APARATO</th><th>QUIEN HACE<br>LA ACCIÓN</th>
          <th>C/NC</th><th>QUIÉN</th>
          <th>¿QUÉ FRUTA?</th><th>¿HECHO?<br>C/NC</th><th>QUIÉN</th>
        </tr>

    <div class="firma">Verificado y conforme: ______________________________  Fecha: ____________</div></section>`;

/* ---- Hoja de lotes de materias primas, calcada del cuaderno de papel ----
   En el papel cada producto ocupa una fila con cuatro casilleros de lote a lo
   ancho, y cada casillero son tres pisos: LOTE, "F. ABRO / F. CIERRO" y las dos
   fechas. Aquí se reproduce igual, con el catálogo completo (los productos sin
   lote salen en blanco, como en el cuaderno) y una hoja por sección y año. */
const LOTES_SECCIONES = [
  ['pasteleria',   'Productos pastelería · ingredientes'],
  ['bajaRotacion', 'Productos obrador · baja rotación'],
  ['materiales',   'Productos pastelería · materiales de uso alimentario'],
];
const LOTES_BLOQUES = 4;   // casilleros de lote por fila, como en el papel

function ddmm(f){
  const p = String(f||'').split('-');
  return p.length===3 ? p[2]+'/'+p[1] : '';
}
/* Un casillero por número de lote, como en el cuaderno: si el mismo lote se ha
   vuelto a pedir varias veces, no se abre otro casillero — se juntan sus semanas,
   se pone la primera fecha de apertura y solo se da por cerrado cuando lo están
   todas sus entradas. */
function agruparPorLote(lotes){
  const orden = [];
  const porCodigo = {};
  lotes.forEach(r=>{
    const k = String(r.lote||'').trim().toLowerCase() || ('__sin__'+r.id);
    if(!porCodigo[k]){ porCodigo[k] = {lote:String(r.lote||''), semanas:[], aperturas:[], cierres:[], abierto:false}; orden.push(k); }
    const g = porCodigo[k];
    semanasDeLote(r).forEach(n=>{ if(g.semanas.indexOf(n)<0) g.semanas.push(n); });
    if(r.fechaApertura) g.aperturas.push(String(r.fechaApertura));
    if(r.fechaCierre) g.cierres.push(String(r.fechaCierre)); else g.abierto = true;
  });
  return orden.map(k=>{
    const g = porCodigo[k];
    g.semanas.sort((a,b)=>a-b);
    g.aperturas.sort(); g.cierres.sort();
    return {lote:g.lote, semanas:g.semanas,
            fechaApertura: g.aperturas[0] || '',
            fechaCierre: g.abierto ? '' : (g.cierres[g.cierres.length-1] || '')};
  }).sort((a,b)=> String(a.fechaApertura||'\uffff').localeCompare(String(b.fechaApertura||'\uffff')));
}
function casilleroLote(g){
  if(!g) return {lote:'', semanas:'', abro:'', cierro:''};
  return {lote:String(g.lote||''),
          semanas:(g.semanas||[]).map(n=>'S'+n).join(' '),
          abro:ddmm(g.fechaApertura), cierro:ddmm(g.fechaCierre)};
}
/** Las tres filas que ocupa un producto (o más, si tiene más de cuatro lotes). */
function filasProductoLote(nombre, lotes, bloques){
  let f1='', f2='', f3='';
  for(let i=0; i<bloques; i++){
    const c = casilleroLote(lotes[i]);
    f1 += `<td colspan="2" class="celda-lote">LOTE: <span class="ml">${esc(c.lote)}</span>`
        + (c.semanas ? `<span class="sem">${esc(c.semanas)}</span>` : '') + `</td>`;
    f2 += `<td class="rot">F. ABRO:</td><td class="rot">F. CIERRO:</td>`;
    f3 += `<td class="fec">${esc(c.abro)}</td><td class="fec">${esc(c.cierro)}</td>`;
  }
  return `<tbody class="bloque-prod">`
    + `<tr><td class="celda-prod" rowspan="3">${esc(nombre)}</td>${f1}</tr>`
    + `<tr>${f2}</tr><tr class="fila-fechas">${f3}</tr></tbody>`;
}

/** Devuelve las hojas del registro de lotes: una por sección y año. */
function hojasLotesMP(desde, hasta){
  const vigente = r=>{
    const ap = String(r.fechaApertura||''), ci = String(r.fechaCierre||'');
    if(hasta && ap && ap > hasta) return false;    // todavía no se había abierto
    if(desde && ci && ci < desde) return false;    // ya estaba cerrado antes
    return true;
  };
  const todos = (DATA.lotesMP||[]).filter(vigente);

  /* El cuaderno es anual. Los lotes sin fecha (los que se apuntaron en el papel
     sin anotar el día) van al año del cuaderno en curso, no a una hoja aparte. */
  const anioActual = (hasta||todayStr()).slice(0,4);
  const porAnio = {};
  todos.forEach(r=>{
    const a = String(r.fechaApertura || r.fechaCierre || '').slice(0,4) || anioActual;
    (porAnio[a] = porAnio[a] || []).push(r);
  });
  let anios = Object.keys(porAnio).sort();
  if(!anios.length){ anios = [anioActual]; porAnio[anioActual] = []; }

  const cat = CONFIG.catalogoLotes || {};
  const enCatalogo = {};
  LOTES_SECCIONES.forEach(([k])=> (cat[k]||[]).forEach(p=> enCatalogo[normTxt(resolverNombreProducto(p))] = true ));

  const out = [];
  anios.forEach(anio=>{
    const porProd = {};
    porAnio[anio].forEach(r=>{
      const k = normTxt(resolverNombreProducto(r.producto));   // el nombre bueno
      (porProd[k] = porProd[k] || []).push(r);
    });
    Object.keys(porProd).forEach(k=> porProd[k].sort((a,b)=>
      String(a.fechaApertura||'￿').localeCompare(String(b.fechaApertura||'￿')) ));

    // lotes de productos que no están en ningún catálogo: se añaden al final
    const sueltos = Object.keys(porProd).filter(k=> !enCatalogo[k]);   // ya resueltos

    LOTES_SECCIONES.forEach(([clave, titulo], iSec)=>{
      let lista = (cat[clave]||[]).slice();
      if(iSec===0) sueltos.forEach(k=> lista.push(resolverNombreProducto(porProd[k][0].producto)) );
      if(!lista.length) return;
      /* La hoja se ensancha sola: tantos casilleros a lo ancho como lotes tenga el
         producto que más haya gastado, con el mínimo del cuaderno impreso (4). */
      const casilleros = {};
      lista.forEach(p=>{ casilleros[normTxt(p)] = agruparPorLote(porProd[normTxt(resolverNombreProducto(p))] || []); });
      let bloques = LOTES_BLOQUES;
      lista.forEach(p=>{ const n = casilleros[normTxt(p)].length; if(n > bloques) bloques = n; });
      const cuerpo = lista.map(p=> filasProductoLote(p, casilleros[normTxt(p)], bloques) ).join('');
      const usados = lista.reduce((n,p)=> n + casilleros[normTxt(p)].length, 0);
      const ancha = bloques > LOTES_BLOQUES ? ' ancha' : '';   // apaisada si no cabe de pie
      out.push(`<section class="hoja hoja-lotes${ancha}" data-bloques="${bloques}">
        ${cabeceraHoja('Materias primas · registro de lotes','T1 · Traza 1-10','Año '+anio+' · '+titulo)}
        <table class="rejilla papel-lotes">
          <thead><tr><th colspan="${1+2*bloques}" class="banda">${esc(titulo.toUpperCase())}</th></tr></thead>
          ${cuerpo}
        </table>
        <p class="pie-nota">${usados} lote${usados===1?'':'s'} anotado${usados===1?'':'s'} en esta hoja. Cada casillero es un número de lote con todas las semanas en que se pidió. Las casillas en blanco son las del cuaderno que aún no se han usado.</p>
        <div class="firma">Verificado y conforme: ______________________________  Fecha: ____________</div></section>`);
    });
  });
  return out;
}

/* Detalle de aperturas y cierres.
   La rejilla T1 es calcada del cuaderno de papel y tiene un solo casillero por
   número de lote. Eso basta casi siempre, pero si del MISMO lote se abre un
   segundo envase después de gastar el primero, en el casillero solo cabe una
   fecha de cierre y el cierre anterior se quedaría sin reflejar. Esta hoja va
   detrás y lo recoge todo: una línea por cada envase abierto, con su fecha de
   apertura y la de cierre. Así el inspector tiene la traza completa. */
function hojaDetalleLotes(desde, hasta){
  const dentroDelRango = r=>{
    const ap = String(r.fechaApertura||''), ci = String(r.fechaCierre||'');
    if(hasta && ap && ap > hasta) return false;
    if(desde && ci && ci < desde) return false;
    return true;
  };
  const filas = (DATA.lotesMP||[]).filter(dentroDelRango).slice().sort((a,b)=>{
    const p = String(resolverNombreProducto(a.producto)).localeCompare(String(resolverNombreProducto(b.producto)),'es');
    if(p !== 0) return p;
    return String(a.fechaApertura||'').localeCompare(String(b.fechaApertura||''));
  });
  if(!filas.length) return '';
  const cerrados = filas.filter(r=>r.fechaCierre).length;
  const cuerpo = filas.map(r=>`<tr>
    <td>${esc(resolverNombreProducto(r.producto))}</td>
    <td class="mono">${esc(r.lote)||'—'}</td>
    <td>${esc(textoSemanas(r,' '))||'—'}</td>
    <td>${r.fechaApertura?fmtDate(r.fechaApertura):'—'}</td>
    <td>${r.fechaCierre?fmtDate(r.fechaCierre):'en uso'}</td>
  </tr>`).join('');
  return `<section class="hoja">
    ${cabeceraHoja('Materias primas · detalle de aperturas y cierres','T1 · Traza 1-10',rotuloRango(desde,hasta))}
    <table class="rejilla"><thead><tr>
      <th>Producto</th><th>Lote</th><th>Semanas pedidas</th><th>Fecha de apertura</th><th>Fecha de cierre</th>
    </tr></thead><tbody>${cuerpo}</tbody></table>
    <p class="pie-nota">${filas.length} envase${filas.length===1?'':'s'} registrado${filas.length===1?'':'s'}: ${cerrados} ya gastado${cerrados===1?'':'s'} y ${filas.length-cerrados} en uso. Cada línea es un envase concreto; si de un mismo lote se han abierto varios, aparece uno por línea.</p>
    <div class="firma">Verificado y conforme: ______________________________  Fecha: ____________</div></section>`;
}

/* ---- REGISTRO DE LIMPIEZA Y DESINFECCIÓN, CALCADO DEL MANUAL ----
   El manual (APPCC ED04) tiene una tabla por sala, con TODOS los elementos
   preimpresos aunque no se hayan limpiado. Aquí igual: la hoja sale siempre
   completa, rellena donde hay registro y en blanco donde no, para que el
   inspector vea el cuadro entero y no una lista de lo que se hizo. */
const FRECUENCIA_OPCIONES = 'Diario / semanal / mensual / anual';
function hojasLimpiezaPorZona(desde, hasta){
  const zonas = CONFIG.zonasLimpieza || [];
  if(!zonas.length) return [];
  const dentroRango = r => dentro(r.fecha, desde, hasta);
  const registros = (DATA.limpieza||[]).filter(dentroRango);
  const porElemento = {};
  registros.forEach(r=>{
    const k = normTxt(r.area)+'|'+normTxt(r.elemento);
    (porElemento[k] = porElemento[k] || []).push(r);
  });
  const filasDe = z => (z.elementos||[]).map(el=>{
    const lista = (porElemento[normTxt(z.area)+'|'+normTxt(el)] || [])
      .slice().sort((a,b)=>String(a.fecha||'').localeCompare(String(b.fecha||'')));
    const hechas = lista.filter(r=>r.realizado);
    const dias = hechas.map(r=>String(r.fecha||'').slice(8,10).replace(/^0/,'')).join(' · ');
    const fechas = hechas.map(r=>fmtDate(r.fecha)).join(' · ');
    const quien = [...new Set(lista.map(r=>r.responsable).filter(Boolean))].join(' / ');
    const superv = [...new Set(lista.map(r=>r.supervisor).filter(Boolean))].join(' / ');
    const inc = [...new Set(lista.map(r=>r.incidenciaNum || r.observaciones).filter(Boolean))].join(' · ');
    const frec = [...new Set(lista.map(r=>r.frecuencia).filter(Boolean))].join(' / ');
    return `<tr>
      <td class="lim-el">${esc(el)}</td>
      <td class="lim-frec">${frec ? esc(frec) : FRECUENCIA_OPCIONES}</td>
      <td class="lim-dias">${esc(dias)}</td>
      <td>${esc(fechas)}</td>
      <td>${esc(quien)}</td>
      <td>${esc(superv)}</td>
      <td>${esc(inc)}</td>
    </tr>`;
  }).join('');
  const cuerpo = zonas.map(z=>`
    <h4 class="lim-sala">${esc(String(z.area).toUpperCase())}</h4>
    <table class="rejilla papel-limpieza"><thead><tr>
      <th>Elemento</th><th>Frecuencia</th><th>Días / casillas de control</th>
      <th>Anotar fecha en que se limpia</th><th>Quién hace la acción</th>
      <th>Quién supervisa</th><th>Incidencia nº</th>
    </tr></thead><tbody>${filasDe(z)}</tbody></table>`).join('');
  const hechas = registros.filter(r=>r.realizado).length;
  return [`<section class="hoja ancha hoja-limpieza">
    ${cabeceraHoja('Registro · control de limpieza y desinfección','T4 · Limpieza',rotuloRango(desde,hasta))}
    ${cuerpo}
    <p class="pie-nota">${hechas} limpieza${hechas===1?'':'s'} registrada${hechas===1?'':'s'} en este periodo. Las casillas en blanco son las del cuaderno que todavía no se han rellenado.</p>
    <div class="firma">Verificado y conforme: ______________________________  Fecha: ____________</div>
  </section>`];
}

/** Listado corriente (limpieza, agua, recepción…) con la cabecera de su hoja. */
function hojaListado(clave, titulo, traza, desde, hasta){
  const meta = MODULE_META[clave];
  if(!meta) return '';
  let filas = (DATA[clave]||[]).slice();
  filas = filas.filter(r=> dentro(r.fecha, desde, hasta));
  filas.sort((a,b)=>String(a.fecha||'').localeCompare(String(b.fecha||'')));
  if(!filas.length) return '';
  const cuerpo = filas.map(r=>`<tr>${meta.row(r).map(c=>`<td>${esc(c==null?'':c)}</td>`).join('')}</tr>`).join('');
  return `<section class="hoja">${cabeceraHoja(titulo||meta.label, traza||'', rotuloRango(desde,hasta))}
    <table class="rejilla"><thead><tr>${meta.headers.map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead>
    <tbody>${cuerpo}</tbody></table>
    <p class="pie-nota">${filas.length} registro${filas.length===1?'':'s'}.</p>
    <div class="firma">Verificado y conforme: ______________________________  Fecha: ____________</div></section>`;
}

function nombreMes(mes){
  const [y,m] = mes.split('-').map(Number);
  return (MESES[m-1]||'') + ' ' + y;
}
function rotuloRango(desde, hasta){
  if(desde && hasta) return 'Del '+fmtDate(desde)+' al '+fmtDate(hasta);
  if(hasta) return 'Hasta el '+fmtDate(hasta);
  return '';
}

function generarDossier(){
  const {desde, hasta} = rangoFechasDossier();
  const host = document.getElementById('dossier');
  /* Si no se pone fecha de inicio, el dossier es el historial completo: hay que
     empezar a contar meses desde el registro más antiguo, no desde este mes. */
  const meses = mesesDelRango(desde || primeraFechaConDatos(), hasta);
  const partes = [];

  // portada
  const e = CONFIG.empresa || {};
  partes.push(`<section class="hoja portada">
    <h1>Registros de autocontrol APPCC</h1>
    <p class="port-emp"><strong>${esc(e.nombre||'')}</strong><br>${esc(e.obrador||'')}<br>${esc(e.direccion||'')}<br>Registro sanitario ${esc(e.registroSanitario||'')}</p>
    <p class="port-rango">${esc(rotuloRango(desde,hasta))}</p>
    <p class="port-fecha">Documento generado el ${fmtDate(todayStr())}</p>
  </section>`);

  // rejillas mensuales
  meses.forEach(mes=>{ partes.push(hojaTemperaturas(mes, desde, hasta)); });
  ['montaje','elaboraciones','masas'].forEach(k=>{
    meses.forEach(mes=>{ partes.push(hojaProduccion(k, mes, desde, hasta)); });
  });
  meses.forEach(mes=>{ partes.push(hojaAceite(mes, desde, hasta)); });
  meses.forEach(mes=>{ partes.push(hojaTransporte(mes, desde, hasta)); });

  // listados
  // el registro de lotes va con la forma del cuaderno, no como listado
  hojasLotesMP(desde, hasta).forEach(h=> partes.push(h) );
  partes.push(hojaDetalleLotes(desde, hasta));
  hojasLimpiezaPorZona(desde, hasta).forEach(h=> partes.push(h) );

  const listados = [
    ['recepcion','Recepción de mercancías','T1 · Recepción'],
    ['transporte','Transporte y reparto · detalle','T2 · Transporte'],
    ['agua','Control de agua','T5 · Agua'],
    ['alergenos','Alérgenos por lote','T6 · Alérgenos'],
    ['alergenosTienda','Alérgenos en tienda','T6 · Alérgenos tienda'],
    ['trazabilidad','Trazabilidad y reparto','T2 · Trazabilidad'],
    ['mantenimiento','Mantenimiento de equipos e instalaciones','T7 · Mantenimiento'],
    ['plagas','Control de plagas · visitas de la empresa DDD','T7 · Plagas'],
    ['noconformidades','Incidencias y acciones correctoras','T8 · Incidencias'],
  ];
  listados.forEach(([k,t,c])=>{ partes.push(hojaListado(k,t,c,desde,hasta)); });

  const hojas = partes.filter(Boolean);
  host.innerHTML = hojas.length>1
    ? hojas.join('')
    : hojas.join('') + hojaVacia('No hay ningún registro en ese periodo.');
  const cuenta = document.getElementById('dosCuenta');
  if(cuenta) cuenta.textContent = (hojas.length-1)+' hoja'+((hojas.length-1)===1?'':'s')+' de registros generadas.';
  host.scrollIntoView({behavior:'smooth', block:'start'});
}

function downloadCSV(meta, rows, mod){
  const lines = [meta.headers.join(';')];
  rows.forEach(r=> lines.push(meta.row(r).map(v=>String(v??'').replace(/;/g,',')).join(';')));
  const blob = new Blob([lines.join('\n')], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `appcc-${mod}-${todayStr()}.csv`; a.click();
  URL.revokeObjectURL(url);
}

/* ---- LECTURA DEL PARTE DE PLAGAS CON IA ----
   Igual que con los albaranes, pero aquí el documento puede venir en PDF, así
   que se manda como documento y no como imagen. Lo que saca la IA se vuelca en
   el formulario para revisarlo: no se guarda nada sin que Berta lo vea. */
const PROMPT_PLAGAS = 'Esta es la documentación de una visita de una empresa de control de plagas (DDD: desinsectación, desinfección y desratización) a un obrador de panadería y pastelería. Puede ser el parte de trabajo, un certificado o un informe de seguimiento. Responde ÚNICAMENTE con un JSON válido, sin texto antes ni después, sin backticks ni comentarios, con esta forma exacta: {"empresa":"","tecnico":"","fecha":"YYYY-MM-DD","numParte":"","tipoActuacion":"","zonas":"","productos":"","hallazgos":"","medidas":"","proxima":"YYYY-MM-DD","incidencia":false}. '
  + 'empresa: la empresa de control de plagas que firma el documento, NUNCA la panadería que lo recibe (la panadería es el cliente y suele llamarse Salduba o Panificadora Salduba). '
  + 'tecnico: nombre del técnico que hizo la visita, si aparece. '
  + 'fecha: la fecha en que se hizo la visita, en formato YYYY-MM-DD. Si no se lee el año con claridad, deja la fecha vacía "" en vez de inventarlo. '
  + 'numParte: número de parte, de albarán, de certificado o de informe. Cópialo tal cual. '
  + 'tipoActuacion: elige EXACTAMENTE una de estas cinco opciones, la que mejor encaje: "Revisión periódica", "Tratamiento", "Instalación / reposición de cebos", "Aviso por incidencia", "Certificado anual". '
  + 'zonas: las zonas del local revisadas o tratadas, separadas por comas (obrador, almacén, cámaras, patio, aseos, vestuarios…). '
  + 'productos: los productos biocidas aplicados con su número de registro si aparece; si no se aplicó ninguno, deja "". '
  + 'hallazgos: qué se encontró — capturas en trampas, cebos consumidos, indicios, puntos críticos. Si el documento dice que no hubo nada, pon "Sin incidencias". '
  + 'medidas: recomendaciones, correcciones pedidas al cliente o medidas adoptadas. '
  + 'proxima: fecha de la próxima visita prevista si figura; si no, "". '
  + 'incidencia: true SOLO si el documento refleja algo que la panadería tiene que corregir o alguna actividad de plagas detectada; false si la visita fue conforme y sin hallazgos. '
  + 'Cualquier campo que no aparezca en el documento va como cadena vacía "". No inventes datos. Aunque el documento esté borroso o incompleto, devuelve el JSON igualmente.';

/** Manda uno o varios adjuntos (imágenes y/o PDF) a la IA con el prompt dado. */
async function preguntarIADocumentos(adjuntos, prompt, estadoIA){
  const bloquesClaude = adjuntos.map(a=> a.mime === 'application/pdf'
    ? {type:'document', source:{type:'base64', media_type:'application/pdf', data:a.base64}}
    : {type:'image', source:{type:'base64', media_type:a.mime||'image/jpeg', data:a.base64}} );
  const cuerpoClaude = {
    model:'claude-sonnet-4-6', max_tokens:1500,
    messages:[{role:'user', content: bloquesClaude.concat([{type:'text', text:prompt}])}]
  };
  const leerClaude = async res=>{
    let data;
    try{ data = await res.json(); }catch(e){ throw new Error('Respuesta no válida del servidor (HTTP '+res.status+')'); }
    if(!res.ok){
      let msg = data?.error?.message || ('HTTP '+res.status);
      if(res.status===401) msg += ' — revisa que la clave de Anthropic en Ajustes sea correcta';
      throw new Error(msg);
    }
    const t = (data.content||[]).find(b=>b.type==='text');
    if(!t || !t.text) throw new Error('La IA no ha devuelto texto legible.');
    return t.text;
  };
  if(HAS_CLAUDE_STORAGE){
    return leerClaude(await fetch('https://api.anthropic.com/v1/messages', {
      method:'POST', headers:{'content-type':'application/json'}, body:JSON.stringify(cuerpoClaude)}));
  }
  const provider = getAIProvider();
  if(provider === 'gemini'){
    const key = getGeminiKey();
    if(!key) throw new Error(mensajeSinClaveIA());
    const partes = adjuntos.map(a=>({inline_data:{mime_type:a.mime||'image/jpeg', data:a.base64}}));
    partes.push({text:prompt});
    return await geminiConRelevo(partes, key, estadoIA);
  }
  const key = getApiKey();
  if(!key) throw new Error('Falta configurar la clave de API de Anthropic en Ajustes → Configuración de IA');
  return leerClaude(await fetch('https://api.anthropic.com/v1/messages', {
    method:'POST',
    headers:{'content-type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
    body: JSON.stringify(cuerpoClaude)}));
}
function jsonDeRespuesta(texto){
  let limpio = String(texto||'').replace(/```json|```/g,'').trim();
  const a = limpio.indexOf('{'), b = limpio.lastIndexOf('}');
  if(a>=0 && b>a) limpio = limpio.slice(a, b+1);
  try{ return JSON.parse(limpio); }
  catch(e){ throw new Error('No se pudo interpretar la respuesta como datos ("'+String(texto).slice(0,140)+'"...)'); }
}
const TIPOS_ACTUACION = ['Revisión periódica','Tratamiento','Instalación / reposición de cebos','Aviso por incidencia','Certificado anual'];
function tipoActuacionMasParecido(t){
  const q = normTxt(t);
  if(!q) return '';
  const exacto = TIPOS_ACTUACION.find(x=>normTxt(x)===q);
  if(exacto) return exacto;
  if(/cebo|trampa/.test(q)) return 'Instalación / reposición de cebos';
  if(/certificad|anual/.test(q)) return 'Certificado anual';
  if(/incidenc|aviso|urgen/.test(q)) return 'Aviso por incidencia';
  if(/tratamient|desinsect|desratiz|desinfec|fumig/.test(q)) return 'Tratamiento';
  if(/revis|seguimient|periodic|mantenimient|inspec/.test(q)) return 'Revisión periódica';
  return '';
}
async function leerParteConIA(){
  if(!plagasFotos.length){ alert('Primero adjunta el parte: una foto o el PDF.'); return; }
  const btn = document.getElementById('plagasLeerBtn');
  const estado = document.getElementById('plagasEstadoIA');
  if(btn){ btn.disabled = true; btn.textContent = 'Leyendo el parte…'; }
  if(estado) estado.textContent = 'Leyendo el parte, un momento…';
  try{
    const adjuntos = plagasFotos.map(a=>({base64: a.dataUrl.slice(a.dataUrl.indexOf(',')+1), mime: a.mime}));
    const p = jsonDeRespuesta(await reintentarSiSatura(()=>preguntarIADocumentos(adjuntos, PROMPT_PLAGAS, estado), estado));
    const form = document.getElementById('form-plagas');
    const set = (name, valor)=>{
      const el = form.querySelector('[name="'+name+'"]');
      if(el && valor) el.value = valor;
    };
    let avisoFecha = '';
    if(p.fecha){
      if(fechaSospechosa(p.fecha)) avisoFecha = p.fecha;
      else set('fecha', p.fecha);
    }
    set('empresa', p.empresa);
    set('tecnico', p.tecnico);
    set('numParte', p.numParte);
    set('zonas', p.zonas);
    set('productos', p.productos);
    set('hallazgos', p.hallazgos);
    set('medidas', p.medidas);
    /* La próxima visita es una fecha futura a propósito, así que aquí no vale el
       candado de fechas; solo se comprueba que tenga forma de fecha. */
    if(/^\d{4}-\d{2}-\d{2}$/.test(String(p.proxima||''))) set('proxima', p.proxima);
    const tipo = tipoActuacionMasParecido(p.tipoActuacion);
    if(tipo){ const sel = form.querySelector('[name="tipoActuacion"]'); if(sel) sel.value = tipo; }
    const chk = form.querySelector('[name="incidencia"]');
    if(chk) chk.checked = !!p.incidencia;
    const vacios = ['empresa','fecha','numParte','zonas','hallazgos'].filter(k=>!p[k]);
    if(estado){
      estado.innerHTML = '<b>Datos leídos.</b> Repásalos antes de guardar; corrige lo que haga falta.'
        + (vacios.length ? ' No se ha podido leer: <b>'+vacios.join(', ')+'</b>.' : '')
        + (avisoFecha ? ' La fecha del documento («'+fmtDate(avisoFecha)+'») no cuadra, así que se ha dejado la que había; ponla a mano si es correcta.' : '');
    }
  }catch(err){
    console.error(err);
    if(estado) estado.textContent = 'No se ha podido leer: '+err.message;
  }finally{
    if(btn){ btn.disabled = false; btn.textContent = '✨ Leer el parte y rellenar'; }
  }
}

/** La tabla del manual: filas Temperatura inicio / fin / Reparto, días a lo ancho. */
function rejillaTransporte(mes){
  const [y,m] = mes.split('-').map(Number);
  const dias = daysInMonth(y,m);
  const porDia = {};
  (DATA.transporte||[]).forEach(r=>{ if(String(r.fecha||'').slice(0,7)===mes) porDia[Number(String(r.fecha).slice(8,10))] = r; });
  const cab = [];
  for(let d=1; d<=dias; d++) cab.push(`<th>${d}</th>`);
  const fila = (rotulo, saca)=>{
    const celdas = [];
    for(let d=1; d<=dias; d++){
      const r = porDia[d];
      const v = r ? saca(r) : '';
      celdas.push(`<td>${esc(v==null?'':v)}</td>`);
    }
    return `<tr><td class="trans-rot">${rotulo}</td>${celdas.join('')}</tr>`;
  };
  return `<table class="rejilla papel-transporte">
    <thead><tr><th class="trans-rot">${esc(nombreMes(mes).toUpperCase())}</th>${cab.join('')}</tr></thead>
    <tbody>
      ${fila('Temperatura inicio', r=>r.tempInicio)}
      ${fila('Temperatura fin', r=>r.tempFin)}
      ${fila('Reparto', r=>r.reparto ? '✓' : (r.tempInicio||r.tempFin ? 'no' : ''))}
    </tbody></table>`;
}
