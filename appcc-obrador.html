<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>APPCC · Panificadora Salduba</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bitter:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F7F1E6;
    --panel:#FFFFFF;
    --ink:#2A241D;
    --ink-soft:#75695A;
    --wheat:#F25012;
    --wheat-dark:#C93E0C;
    --wheat-tint:#FCE3D6;
    --ok:#4C7A4A;
    --ok-tint:#E4EEDE;
    --warn:#B4841A;
    --warn-tint:#F6EBCF;
    --danger:#B0402E;
    --danger-tint:#F5E1DC;
    --line:#E6DBC6;
    --sidebar:#231814;
    --sidebar-soft:#B8A990;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Inter',sans-serif;
    background:var(--bg);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.brand,.stamp{font-family:'Bitter',serif;}
  .mono{font-family:'IBM Plex Mono',monospace;}
  #app{display:flex;min-height:100vh;}

  /* SIDEBAR */
  .sidebar{
    width:236px;flex:none;background:var(--sidebar);color:#EFE7D8;
    display:flex;flex-direction:column;position:sticky;top:0;height:100vh;
  }
  .sidebar-head{padding:22px 20px 16px;border-bottom:1px solid rgba(255,255,255,0.08);position:relative;overflow:hidden;}
  .logo-frame{background:#fff;border-radius:10px;padding:8px 12px;display:inline-block;box-shadow:0 2px 6px rgba(0,0,0,0.25);}
  .logo-frame img{width:56px;height:auto;display:block;}
  .wheat-mark{width:26px;height:26px;color:var(--wheat);}
  .brand{font-size:17px;font-weight:700;margin-top:8px;letter-spacing:0.2px;}
  .brand small{display:block;font-family:'Inter',sans-serif;font-size:11px;font-weight:500;color:var(--sidebar-soft);letter-spacing:0.6px;text-transform:uppercase;margin-top:3px;}
  nav.navlist{flex:1;padding:14px 10px;overflow-y:auto;}
  .navitem{
    display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:8px;
    color:#DAD0BC;font-size:13.5px;font-weight:500;cursor:pointer;margin-bottom:2px;
    border-left:3px solid transparent;transition:background .12s ease;
  }
  .navitem svg{width:18px;height:18px;flex:none;opacity:.85;}
  .navitem:hover{background:rgba(255,255,255,0.06);}
  .navitem.active{background:rgba(185,118,47,0.18);border-left-color:var(--wheat);color:#fff;}
  .sidebar-foot{padding:14px 20px 18px;font-size:11px;color:var(--sidebar-soft);border-top:1px solid rgba(255,255,255,0.08);line-height:1.5;}

  /* MAIN */
  .main{flex:1;min-width:0;display:flex;flex-direction:column;}
  .topbar{
    background:var(--panel);border-bottom:1px solid var(--line);
    padding:18px 30px;display:flex;align-items:baseline;justify-content:space-between;
    position:sticky;top:0;z-index:5;
  }
  .topbar h1{font-size:21px;margin:0;font-weight:600;}
  .topbar .date{font-size:12.5px;color:var(--ink-soft);}
  .content{padding:26px 30px 60px;max-width:1180px;}
  .view{display:none;}
  .view.active{display:block;}

  /* CARDS / PANELS */
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:20px 22px;margin-bottom:20px;}
  .panel h2{font-size:15.5px;margin:0 0 14px;font-weight:600;display:flex;align-items:center;gap:8px;}
  .panel h2 svg{width:17px;height:17px;color:var(--wheat);}
  .hint{font-size:12px;color:var(--ink-soft);margin:-8px 0 16px;}

  /* FORM */
  form.record-form{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px;align-items:end;}
  .field{display:flex;flex-direction:column;gap:5px;font-size:12.5px;font-weight:600;color:var(--ink-soft);}
  .field.wide{grid-column:1 / -1;}
  .field input,.field select,.field textarea{
    font-family:'Inter',sans-serif;font-size:13.5px;color:var(--ink);
    border:1px solid var(--line);border-radius:7px;padding:8px 10px;background:#FDFBF6;
  }
  .field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--wheat);outline-offset:0;border-color:var(--wheat);}
  .field textarea{resize:vertical;min-height:42px;font-family:'Inter',sans-serif;}
  .field.checkline{flex-direction:row;align-items:center;gap:8px;font-weight:500;}
  .field.checkline input{width:16px;height:16px;}
  .checkgroup{display:flex;flex-wrap:wrap;gap:8px 16px;}
  .checkgroup label{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:500;color:var(--ink);}
  .checkgroup input{width:15px;height:15px;}
  .form-actions{grid-column:1/-1;display:flex;justify-content:flex-end;margin-top:2px;}

  button{font-family:'Inter',sans-serif;cursor:pointer;}
  .btn{
    background:var(--wheat);color:#fff;border:none;border-radius:7px;
    padding:9px 18px;font-size:13px;font-weight:600;letter-spacing:.2px;
  }
  .btn:hover{background:var(--wheat-dark);}
  .btn.secondary{background:transparent;color:var(--wheat-dark);border:1px solid var(--wheat);}
  .btn.secondary:hover{background:var(--wheat-tint);}
  .btn.danger{background:transparent;color:var(--danger);border:1px solid var(--danger);}
  .btn.danger:hover{background:var(--danger-tint);}
  .btn.small{padding:5px 10px;font-size:11.5px;border-radius:6px;}

  /* TABLE */
  table{width:100%;border-collapse:collapse;font-size:12.8px;}
  thead th{
    text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;
    color:var(--ink-soft);border-bottom:1px solid var(--line);padding:8px 10px;font-weight:600;
  }
  tbody td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top;}
  tbody tr:hover{background:#FBF6EC;}
  .table-wrap{overflow-x:auto;}
  .empty-row td{color:var(--ink-soft);font-style:italic;text-align:center;padding:22px;}

  .badge{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700;letter-spacing:.2px;}
  .badge.ok{background:var(--ok-tint);color:var(--ok);}
  .badge.warn{background:var(--warn-tint);color:var(--warn);}
  .badge.danger{background:var(--danger-tint);color:var(--danger);}

  /* DASHBOARD */
  .dash-hero{
    display:flex;justify-content:space-between;align-items:center;gap:24px;
    background:var(--sidebar);color:#EFE7D8;border-radius:var(--radius);padding:24px 28px;margin-bottom:22px;
    position:relative;overflow:hidden;
  }
  .dash-hero h2{color:#fff;font-size:20px;margin:0 0 6px;}
  .dash-hero p{margin:0;font-size:13px;color:var(--sidebar-soft);max-width:440px;line-height:1.5;}
  .stamp{
    flex:none;width:118px;height:118px;border-radius:50%;
    border:3px double currentColor;display:flex;align-items:center;justify-content:center;
    text-align:center;font-weight:700;font-size:13px;letter-spacing:1px;text-transform:uppercase;
    transform:rotate(-9deg);line-height:1.3;
  }
  .stamp.ok{color:#8CD08A;}
  .stamp.danger{color:#E79486;}

  .grid-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;margin-bottom:22px;}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;}
  .card-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px;}
  .card-top svg{width:19px;height:19px;color:var(--wheat);}
  .card h3{font-size:13.5px;margin:0;font-weight:600;}
  .card .metric{font-family:'IBM Plex Mono',monospace;font-size:26px;font-weight:600;margin:2px 0 4px;}
  .card .sub{font-size:11.5px;color:var(--ink-soft);}

  .wheat-divider{display:flex;align-items:center;gap:8px;margin:26px 0 14px;color:var(--wheat);}
  .wheat-divider svg{width:16px;height:16px;}
  .wheat-divider span{font-size:11px;text-transform:uppercase;letter-spacing:1.2px;color:var(--ink-soft);font-weight:600;}
  .wheat-divider::after{content:"";flex:1;height:1px;background:var(--line);}

  .settings-list{display:flex;flex-direction:column;gap:8px;margin-bottom:12px;}
  .settings-row{display:flex;gap:8px;align-items:center;}
  .settings-row input{flex:1;font-family:'Inter',sans-serif;font-size:13px;padding:7px 9px;border:1px solid var(--line);border-radius:6px;background:#FDFBF6;}
  .settings-row input.small{flex:none;width:80px;}

  .filters{display:flex;flex-wrap:wrap;gap:12px;align-items:end;margin-bottom:16px;}

  ::-webkit-scrollbar{width:9px;height:9px;}
  ::-webkit-scrollbar-thumb{background:var(--line);border-radius:6px;}

  @media(max-width:880px){
    #app{flex-direction:column;}
    .sidebar{width:100%;height:auto;position:relative;flex-direction:row;overflow-x:auto;}
    .sidebar-head{display:none;}
    nav.navlist{display:flex;padding:8px;}
    .navitem{white-space:nowrap;border-left:none;border-bottom:3px solid transparent;}
    .navitem.active{border-left-color:transparent;border-bottom-color:var(--wheat);}
    .sidebar-foot{display:none;}
    .content{padding:18px 16px 50px;}
    .dash-hero{flex-direction:column;align-items:flex-start;}
  }
  @media(prefers-reduced-motion:reduce){*{transition:none!important;}}
</style>
</head>
<body>

  <main class="main">

/* ---------- CONFIG & STORAGE ---------- */
const STORE_KEYS = {

  temperaturas:'records:temperaturas',
  limpieza:'records:limpieza',
  agua:'records:agua',
  recepcion:'records:recepcion',
  alergenos:'records:alergenos',
  alergenosTienda:'records:alergenosTienda',
  aceite:'records:aceite',
  trazabilidad:'records:trazabilidad',

  mantenimiento:'records:mantenimiento',
  noconformidades:'records:noconformidades',
  pedidosManual:'records:pedidosManual',
};
let CONFIG = null;
let DATA = {temperaturas:{},limpieza:[],agua:[],recepcion:[],alergenos:[],alergenosTienda:[],aceite:[],trazabilidad:[],lotesMP:[],mantenimiento:[],noconformidades:[],pedidosManual:[]};

    materiasPrimas:[

      {nombre:'Bolsas papel tiendas', categoria:'Envases', proveedor:'', telefono:'', unidad:'cajas', stockMinimo:2, stockActual:2},

    telefonosProveedores:{}

}

/* ---------- ALMACENAMIENTO INDEPENDIENTE (IndexedDB) ---------- */
const HAS_CLAUDE_STORAGE = (typeof window!=='undefined' && window.storage && typeof window.storage.get==='function');
const LocalStore = {
  dbPromise:null,
  openDB(){
    if(this.dbPromise) return this.dbPromise;
    this.dbPromise = new Promise((resolve,reject)=>{
      const req = indexedDB.open('appcc_salduba_db', 1);
      req.onupgradeneeded = ()=>{ if(!req.result.objectStoreNames.contains('kv')) req.result.createObjectStore('kv'); };
      req.onsuccess = ()=>resolve(req.result);
      req.onerror = ()=>reject(req.error);
    });
    return this.dbPromise;
  },
  async get(key){
    try{
      const db = await this.openDB();
      return await new Promise((resolve,reject)=>{
        const tx = db.transaction('kv','readonly');
        const req = tx.objectStore('kv').get(key);
        req.onsuccess = ()=>resolve(req.result);
        req.onerror = ()=>reject(req.error);
      });
    }catch(e){ console.error('IndexedDB get error', e); return undefined; }
  },
  async set(key, value){
    try{
      const db = await this.openDB();
      await new Promise((resolve,reject)=>{
        const tx = db.transaction('kv','readwrite');
        tx.objectStore('kv').put(value, key);
        tx.oncomplete = ()=>resolve();
        tx.onerror = ()=>reject(tx.error);
      });
      return true;
    }catch(e){ console.error('IndexedDB set error', e); return false; }
  },
  async delete(key){
    try{
      const db = await this.openDB();
      await new Promise((resolve,reject)=>{
        const tx = db.transaction('kv','readwrite');
        tx.objectStore('kv').delete(key);
        tx.oncomplete = ()=>resolve();
        tx.onerror = ()=>reject(tx.error);
      });
    }catch(e){ console.error('IndexedDB delete error', e); }
  }
};
const Store = {
  async get(key){
    if(HAS_CLAUDE_STORAGE){
      try{ const r = await window.storage.get(key, true); return r ? r.value : undefined; }catch(e){ /* cae a local */ }
    }
    return await LocalStore.get(key);
  },
  async set(key, value){
    if(HAS_CLAUDE_STORAGE){
      try{ await window.storage.set(key, value, true); return true; }catch(e){ /* cae a local */ }
    }
    return await LocalStore.set(key, value);
  },
  async delete(key){
    if(HAS_CLAUDE_STORAGE){
      try{ await window.storage.delete(key, true); return; }catch(e){ /* cae a local */ }
    }
    await LocalStore.delete(key);
  }
};
function getApiKey(){ try{ return localStorage.getItem('appcc_anthropic_key') || ''; }catch(e){ return ''; } }
function setApiKey(key){ try{ localStorage.setItem('appcc_anthropic_key', key); }catch(e){ console.error(e); } }
function clearApiKey(){ try{ localStorage.removeItem('appcc_anthropic_key'); }catch(e){} }
function getGeminiKey(){ try{ return localStorage.getItem('appcc_gemini_key') || ''; }catch(e){ return ''; } }
function setGeminiKey(key){ try{ localStorage.setItem('appcc_gemini_key', key); }catch(e){ console.error(e); } }
function clearGeminiKey(){ try{ localStorage.removeItem('appcc_gemini_key'); }catch(e){} }
function getAIProvider(){ try{ return localStorage.getItem('appcc_ai_provider') || 'gemini'; }catch(e){ return 'gemini'; } }
function setAIProvider(p){ try{ localStorage.setItem('appcc_ai_provider', p); }catch(e){ console.error(e); } }

async function loadAll(){
  try{
    const c = await Store.get(STORE_KEYS.config);
    CONFIG = c ? JSON.parse(c) : defaultConfig();
  }catch(e){ CONFIG = defaultConfig(); }
  for(const mod of Object.keys(DATA)){
    try{
      const r = await Store.get(STORE_KEYS[mod]);
      DATA[mod] = r ? JSON.parse(r) : (mod==='temperaturas' ? {} : []);
    }catch(e){ DATA[mod] = (mod==='temperaturas' ? {} : []); }
  }
}
async function saveConfig(){
  try{ await Store.set(STORE_KEYS.config, JSON.stringify(CONFIG)); }catch(e){ console.error(e); }
}
async function saveModule(mod){
  try{ await Store.set(STORE_KEYS[mod], JSON.stringify(DATA[mod])); }catch(e){ console.error(e); }
}

/* ---------- COPIA DE SEGURIDAD ---------- */
function exportarBackup(){
  const backup = {config:CONFIG, data:DATA, exportadoEl:new Date().toISOString()};
  const blob = new Blob([JSON.stringify(backup)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'appcc-salduba-backup-'+todayStr()+'.json'; a.click();
  URL.revokeObjectURL(url);
}
function importarBackupFile(file){
  const reader = new FileReader();
  reader.onload = async e=>{
    try{
      const backup = JSON.parse(e.target.result);
      if(!backup.config || !backup.data) throw new Error('formato no reconocido');
      if(!confirm('Esto reemplazará TODOS los datos actuales de la app por los del archivo de respaldo. ¿Continuar?')) return;
      CONFIG = backup.config;
      DATA = backup.data;
      await saveConfig();
      for(const mod of Object.keys(DATA)) await saveModule(mod);
      alert('Copia de seguridad restaurada correctamente.');
      updateSidebarFoot();
      showView('dashboard');
    }catch(err){ alert('El archivo no es una copia de seguridad válida de esta app.'); }
  };
  reader.readAsText(file);
}

/* ---------- SINCRONIZACIÓN CON GOOGLE DRIVE (vía Apps Script) ---------- */
function getAppsScriptUrl(){ try{ return localStorage.getItem('appcc_appscript_url') || ''; }catch(e){ return ''; } }
function setAppsScriptUrl(url){ try{ localStorage.setItem('appcc_appscript_url', url); }catch(e){ console.error(e); } }
async function subirBackupADrive(){
  const estado = document.getElementById('driveSyncEstado');
  const url = getAppsScriptUrl();
  if(!url){ estado.textContent = 'Configura primero la URL de Apps Script y guárdala.'; return; }
  estado.textContent = 'Subiendo a Google Drive…';
  try{
    const backup = {config:CONFIG, data:DATA, exportadoEl:new Date().toISOString()};
    const res = await fetch(url, {
      method:'POST',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify(backup)
    });
    const data = await res.json();
    if(!data.ok) throw new Error(data.error || 'Error desconocido en Apps Script');
    estado.textContent = 'Copia subida a Google Drive correctamente ('+new Date().toLocaleTimeString()+').';
  }catch(err){
    console.error(err);
    estado.textContent = 'Error al subir a Drive: '+err.message;
  }
}
async function descargarBackupDeDrive(){
  const estado = document.getElementById('driveSyncEstado');
  const url = getAppsScriptUrl();
  if(!url){ estado.textContent = 'Configura primero la URL de Apps Script y guárdala.'; return; }
  estado.textContent = 'Buscando copia en Google Drive…';
  try{
    const sep = url.includes('?') ? '&' : '?';
    const res = await fetch(url+sep+'action=get');
    const backup = await res.json();
    if(!backup || !backup.config || !backup.data){ estado.textContent = 'No hay ninguna copia guardada en Drive todavía. Sube una primero desde otro dispositivo.'; return; }
    if(!confirm('Esto reemplazará TODOS los datos actuales de esta app por los guardados en Google Drive. ¿Continuar?')){ estado.textContent=''; return; }
    CONFIG = backup.config;
    DATA = backup.data;
    await saveConfig();
    for(const mod of Object.keys(DATA)) await saveModule(mod);
    estado.textContent = 'Datos restaurados desde Google Drive correctamente.';
    updateSidebarFoot();
    showView('dashboard');
  }catch(err){
    console.error(err);
    estado.textContent = 'Error al descargar de Drive: '+err.message;
  }
}

function fmtDate(d){ if(!d) return '—'; const [y,m,day]=d.split('-'); return `${day}/${m}/${y}`; }

function table(headers, rows){

/* ================= TEMPERATURAS (rejilla mensual) ================= */
function daysInMonth(y,m){ return new Date(y,m,0).getDate(); }
function monthKey(y,m){ return y+'-'+String(m).padStart(2,'0'); }
function getMonthRows(y,m){
  const key = monthKey(y,m);
  if(!DATA.temperaturas[key]){
    DATA.temperaturas[key] = Array.from({length:31},(_,i)=>({day:i+1, valores:{}, responsable:'', incidencia:''}));
  }
  // asegurar que existen entradas para equipos añadidos después
  DATA.temperaturas[key].forEach(row=>{ if(!row.valores) row.valores={}; });
  return DATA.temperaturas[key];
}
const MESES = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
let tempSelMes = new Date().getMonth()+1;
let tempSelAnio = new Date().getFullYear();
function viewTemperaturas(){
  document.getElementById('view-temperaturas').innerHTML = `
    <div class="panel">
      <h2>${icon('temp')} Registro de control de temperaturas de equipos</h2>
      <p class="hint">Una fila por día, igual que la hoja mensual en papel. Las celdas fuera de rango se marcan en rojo automáticamente.</p>
      <div class="filters">
        <label class="field"><span>Mes</span><select id="tempMesSel">${MESES.map((m,i)=>`<option value="${i+1}">${m}</option>`).join('')}</select></label>
        <label class="field"><span>Año</span><input type="number" id="tempAnioSel" class="small" style="width:100px;" value="${tempSelAnio}"></label>
        <button class="btn secondary" id="tempCargar">Cargar mes</button>
        <button class="btn" id="tempGuardar">Guardar cambios del mes</button>
      </div>
      <div class="table-wrap" id="temp-grid"></div>
    </div>
  `;
  document.getElementById('tempMesSel').value = tempSelMes;
  document.getElementById('tempCargar').addEventListener('click', ()=>{
    tempSelMes = parseInt(document.getElementById('tempMesSel').value,10);
    tempSelAnio = parseInt(document.getElementById('tempAnioSel').value,10) || new Date().getFullYear();
    renderTempGrid();
  });
  document.getElementById('tempGuardar').addEventListener('click', async ()=>{
    await saveModule('temperaturas');
    renderDashboard();
    alert('Mes guardado correctamente.');
  });
  renderTempGrid();
}
function renderTempGrid(){
  const rows = getMonthRows(tempSelAnio, tempSelMes);
  const nDays = daysInMonth(tempSelAnio, tempSelMes);
  const equipos = CONFIG.equipos;
  const head = `<tr><th>Día</th>${equipos.map(e=>`<th>${esc(e.nombre)}</th>`).join('')}<th>Responsable</th><th>Incidencia nº</th></tr>`;
  const body = rows.slice(0,nDays).map(row=>{
    const cells = equipos.map(e=>{
      const v = row.valores[e.nombre];
      const outOfRange = (v!==undefined && v!=='' && isFinite(v)) ? !within(parseFloat(v), e.min, e.max) : false;
      return `<td><input type="number" step="0.1" value="${v!==undefined?v:''}" style="width:64px;${outOfRange?'color:var(--danger);font-weight:700;':''}"
        onchange="updateTempCell(${row.day},'${esc(e.nombre).replace(/'/g,"\\'")}',this.value)"></td>`;
    }).join('');
    return `<tr><td class="mono">${row.day}</td>${cells}
      <td><input type="text" value="${esc(row.responsable)}" style="width:100px;" onchange="updateTempMeta(${row.day},'responsable',this.value)"></td>
      <td><input type="text" value="${esc(row.incidencia)}" style="width:80px;" onchange="updateTempMeta(${row.day},'incidencia',this.value)"></td>
    </tr>`;
  }).join('');
  document.getElementById('temp-grid').innerHTML = `<table>${head}${body}</table>`;
}
function updateTempCell(day, equipo, value){
  const rows = getMonthRows(tempSelAnio, tempSelMes);
  const row = rows.find(r=>r.day===day);
  row.valores[equipo] = value===''?'':parseFloat(value);
  renderTempGrid();
}
function updateTempMeta(day, field, value){
  const rows = getMonthRows(tempSelAnio, tempSelMes);
  const row = rows.find(r=>r.day===day);
  row[field] = value;
}
function temperaturasAlertasHoy(){
  const now = new Date();
  const rows = getMonthRows(now.getFullYear(), now.getMonth()+1);
  const row = rows.find(r=>r.day===now.getDate());
  if(!row) return 0;
  let n=0;
  CONFIG.equipos.forEach(e=>{
    const v = row.valores[e.nombre];
    if(v!==undefined && v!=='' && isFinite(v) && !within(parseFloat(v), e.min, e.max)) n++;
  });
  return n;
}
function temperaturasRegistradasHoy(){
  const now = new Date();
  const rows = getMonthRows(now.getFullYear(), now.getMonth()+1);
  const row = rows.find(r=>r.day===now.getDate());
  if(!row) return 0;
  return Object.values(row.valores).filter(v=>v!==undefined && v!=='').length;
}

let camaraStream = null;
async function abrirCamara(){
  const estado = document.getElementById('albaranEstado');
  try{
    camaraStream = await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}, audio:false});
    const video = document.getElementById('albaranVideo');

  }catch(err){
    console.error(err);
    estado.textContent = 'Este navegador no permite abrir la cámara aquí. Usa "Subir foto": en el móvil también abre la cámara directamente.';
  }
}
function cerrarCamara(){
  if(camaraStream){ camaraStream.getTracks().forEach(t=>t.stop()); camaraStream = null; }
  const wrap = document.getElementById('albaranCamWrap');
  if(wrap) wrap.style.display = 'none';
}
function capturarFotoCamara(){
  const video = document.getElementById('albaranVideo');
  if(!video.videoWidth){ return; }
  const maxWidth = 1100;
  const scale = Math.min(1, maxWidth/video.videoWidth);
  const canvas = document.createElement('canvas');
  canvas.width = Math.round(video.videoWidth*scale);
  canvas.height = Math.round(video.videoHeight*scale);
  canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);
  const dataUrl = canvas.toDataURL('image/jpeg', 0.72);
  albaranQueue.push(dataUrl);
  if(albaranQueue.length===1) albaranQueueIndex = 0;
  cargarFotoDeCola();
  cerrarCamara();
}
function cargarFotoDeCola(){
  const preview = document.getElementById('albaranPreview');
  const estado = document.getElementById('albaranEstado');
  const btn = document.getElementById('albaranExtraerBtn');
  if(!preview) return;
  if(albaranQueue.length===0){
    recepcionFotoDataUrl = null;
    preview.innerHTML = '';
    if(btn) btn.disabled = true;
    return;
  }
  if(albaranQueueIndex>=albaranQueue.length) albaranQueueIndex = albaranQueue.length-1;
  recepcionFotoDataUrl = albaranQueue[albaranQueueIndex];
  const miniaturas = albaranQueue.map((d,i)=>`<img src="${d}" style="width:52px;height:52px;object-fit:cover;border-radius:6px;border:2px solid ${i===albaranQueueIndex?'var(--wheat)':'var(--line)'};cursor:pointer;" onclick="albaranQueueIndex=${i};cargarFotoDeCola();">`).join('');
  preview.innerHTML = `
    ${albaranQueue.length>1 ? `<div class="hint" style="margin-bottom:6px;">Albarán ${albaranQueueIndex+1} de ${albaranQueue.length} — pulsa una miniatura para cambiar de foto</div><div style="display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap;">${miniaturas}</div>` : ''}
    <img src="${recepcionFotoDataUrl}" style="max-width:220px;border-radius:8px;border:1px solid var(--line);">
  `;
  if(btn) btn.disabled = false;
  recepcionExtraidas = [];
  renderLineasExtraidas();
  const provInput = document.getElementById('albaranProveedor');
  if(provInput) provInput.value = '';
  if(estado) estado.textContent = albaranQueue.length>1
    ? `Foto ${albaranQueueIndex+1} de ${albaranQueue.length} lista. Pulsa "Extraer datos con IA".`
    : 'Foto lista. Pulsa "Extraer datos con IA".';
}
function compressImage(file, maxWidth, quality){
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onload = e=>{
      const img = new Image();
      img.onload = ()=>{
        const scale = Math.min(1, maxWidth/img.width);
        const canvas = document.createElement('canvas');
        canvas.width = Math.round(img.width*scale);
        canvas.height = Math.round(img.height*scale);
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img,0,0,canvas.width,canvas.height);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = ()=>reject(new Error('No se pudo leer la imagen'));
      img.src = e.target.result;
    };
    reader.onerror = ()=>reject(new Error('No se pudo leer el archivo'));
    reader.readAsDataURL(file);
  });
}

const PROMPT_ALBARAN = 'Esta es la foto de un albarán de entrega de mercancía a una panadería. Responde ÚNICAMENTE con un JSON válido, sin texto antes ni después, sin backticks ni comentarios, con esta forma exacta: {"proveedor":"","fecha":"YYYY-MM-DD","lineas":[{"producto":"","lote":"","cantidad":"","caducidad":"YYYY-MM-DD"}]}. Incluye una línea por cada producto distinto que aparezca en el albarán. Si un dato no aparece en la imagen o no se puede leer con claridad, usa cadena vacía "". La fecha debe ir en formato YYYY-MM-DD si logras deducirla del albarán. Aunque la foto esté borrosa, mal encuadrada o incompleta, haz tu mejor estimación y devuelve el JSON de todas formas; nunca respondas solo texto explicativo.';

async function llamarClaudeSinClave(base64){
  const response = await fetch('https://api.anthropic.com/v1/messages', {
    method:'POST',
    headers:{'content-type':'application/json'},
    body: JSON.stringify({
      model:'claude-sonnet-4-6', max_tokens:1000,
      messages:[{role:'user', content:[
        {type:'image', source:{type:'base64', media_type:'image/jpeg', data:base64}},
        {type:'text', text:PROMPT_ALBARAN}
      ]}]
    })
  });
  let data;
  try{ data = await response.json(); }catch(e){ throw new Error('Respuesta no válida del servidor (HTTP '+response.status+')'); }
  if(!response.ok) throw new Error(data?.error?.message || ('HTTP '+response.status));
  const textBlock = (data.content||[]).find(b=>b.type==='text');
  if(!textBlock || !textBlock.text) throw new Error('La IA no ha devuelto texto legible.');
  return textBlock.text;
}
async function llamarClaudeConClave(base64, apiKey){
  const response = await fetch('https://api.anthropic.com/v1/messages', {
    method:'POST',
    headers:{'content-type':'application/json','x-api-key':apiKey,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
    body: JSON.stringify({
      model:'claude-sonnet-4-6', max_tokens:1000,
      messages:[{role:'user', content:[
        {type:'image', source:{type:'base64', media_type:'image/jpeg', data:base64}},
        {type:'text', text:PROMPT_ALBARAN}
      ]}]
    })
  });
  let data;
  try{ data = await response.json(); }catch(e){ throw new Error('Respuesta no válida del servidor (HTTP '+response.status+')'); }
  if(!response.ok){
    let msg = data?.error?.message || ('HTTP '+response.status);
    if(response.status===401) msg += ' — revisa que la clave de Anthropic en Ajustes sea correcta';
    throw new Error(msg);
  }
  const textBlock = (data.content||[]).find(b=>b.type==='text');
  if(!textBlock || !textBlock.text) throw new Error('La IA no ha devuelto texto legible.');
  return textBlock.text;
}
async function llamarGemini(base64, apiKey){
  const modelo = 'gemini-3.6-flash';
  const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${modelo}:generateContent`, {
    method:'POST',
    headers:{'content-type':'application/json','x-goog-api-key':apiKey},
    body: JSON.stringify({
      contents:[{parts:[
        {inline_data:{mime_type:'image/jpeg', data:base64}},
        {text:PROMPT_ALBARAN}
      ]}]
    })
  });
  let data;
  try{ data = await response.json(); }catch(e){ throw new Error('Respuesta no válida del servidor (HTTP '+response.status+')'); }
  if(!response.ok){
    let msg = data?.error?.message || ('HTTP '+response.status);
    if(response.status===400 || response.status===403) msg += ' — revisa que la clave de Gemini en Ajustes sea correcta y tenga la API de Gemini habilitada';
    const err = new Error(msg);
    if(response.status===429){
      let segundos = null;
      const detalle = (data?.error?.details||[]).find(d=>d['@type']&&d['@type'].includes('RetryInfo'));
      if(detalle && detalle.retryDelay){
        const m = /([\d.]+)s/.exec(detalle.retryDelay);
        if(m) segundos = Math.ceil(parseFloat(m[1]));
      }
      if(segundos===null){
        const m2 = /retry in ([\d.]+)s/i.exec(msg);
        if(m2) segundos = Math.ceil(parseFloat(m2[1]));
      }
      err.retrySeconds = segundos || 60;
      err.esLimiteVelocidad = true;
    }
    throw err;
  }
  const text = data?.candidates?.[0]?.content?.parts?.map(p=>p.text||'').join('') || '';
  if(!text) throw new Error('La IA no ha devuelto texto legible.');
  return text;
}
async function extraerAlbaran(){
  if(!recepcionFotoDataUrl) return;
  const btn = document.getElementById('albaranExtraerBtn');
  const estado = document.getElementById('albaranEstado');
  btn.disabled = true; btn.textContent = 'Leyendo albarán…';
  estado.textContent = 'Leyendo el albarán, un momento…';
  let textoRespuesta = '';
  try{
    const base64 = recepcionFotoDataUrl.split(',')[1];
    if(HAS_CLAUDE_STORAGE){
      textoRespuesta = await llamarClaudeSinClave(base64);
    } else {
      const provider = getAIProvider();
      if(provider==='gemini'){
        const key = getGeminiKey();
        if(!key) throw new Error('Falta configurar la clave de API de Gemini en Ajustes → Configuración de IA');
        textoRespuesta = await llamarGemini(base64, key);
      } else {
        const key = getApiKey();
        if(!key) throw new Error('Falta configurar la clave de API de Anthropic en Ajustes → Configuración de IA');
        textoRespuesta = await llamarClaudeConClave(base64, key);
      }
    }
    textoRespuesta = textoRespuesta.trim();
    let clean = textoRespuesta.replace(/```json|```/g,'').trim();
    const first = clean.indexOf('{');
    const last = clean.lastIndexOf('}');
    if(first>=0 && last>first) clean = clean.slice(first, last+1);
    let parsed;
    try{ parsed = JSON.parse(clean); }
    catch(jsonErr){ throw new Error('No se pudo interpretar la respuesta como datos ("'+textoRespuesta.slice(0,140)+'"...)'); }
    recepcionExtraidas = (parsed.lineas||[]).map(l=>({producto:l.producto||'', lote:l.lote||'', cantidad:l.cantidad||'', caducidad:l.caducidad||''}));
    if(recepcionExtraidas.length===0) recepcionExtraidas.push({producto:'',lote:'',cantidad:'',caducidad:''});
    document.getElementById('albaranProveedor').value = parsed.proveedor||'';
    if(parsed.fecha) document.getElementById('albaranFecha').value = parsed.fecha;
    renderLineasExtraidas();
    estado.textContent = recepcionExtraidas.some(l=>l.producto) ? 'Datos leídos. Revisa y corrige cualquier campo antes de guardar.' : 'No se detectó ningún producto claro en la foto. Añádelos manualmente abajo.';
  }catch(err){
    console.error(err);
    if(err.esLimiteVelocidad){
      iniciarCuentaAtrasLimite(err.retrySeconds, btn, estado);
      return;
    }
    estado.textContent = 'No se ha podido leer el albarán automáticamente (' + err.message + '). Añade los productos manualmente abajo, o prueba con una foto más nítida y bien encuadrada.';
    if(recepcionExtraidas.length===0){ recepcionExtraidas.push({producto:'',lote:'',cantidad:'',caducidad:''}); renderLineasExtraidas(); }
  }finally{
    if(!estado.dataset.limiteActivo) btn.disabled = false;
    if(btn.textContent==='Leyendo albarán…') btn.textContent = 'Extraer datos con IA';
  }
}
function iniciarCuentaAtrasLimite(segundos, btn, estado){
  estado.dataset.limiteActivo = '1';
  btn.disabled = true;
  let restante = segundos;
  const actualizar = ()=>{
    btn.textContent = `Espera ${restante}s…`;
    estado.textContent = `Has hecho muchas peticiones seguidas y el nivel gratuito de Gemini limita a 20 por minuto. Espera ${restante} segundos y podrás seguir — no hace falta que hagas nada más, el botón se reactivará solo.`;
  };
  actualizar();
  const intervalo = setInterval(()=>{
    restante--;
    if(restante<=0){
      clearInterval(intervalo);
      delete estado.dataset.limiteActivo;
      btn.disabled = false;
      btn.textContent = 'Extraer datos con IA';
      estado.textContent = 'Ya puedes pulsar "Extraer datos con IA" de nuevo.';
      return;
    }
    actualizar();
  }, 1000);
}

async function confirmarRecepcionFoto(){
  const lineasValidas = recepcionExtraidas.filter(l=>l.producto && l.producto.trim());
  if(lineasValidas.length===0){ alert('Añade al menos un producto con nombre antes de guardar.'); return; }
  const responsable = document.getElementById('albaranResponsable').value.trim();
  if(!responsable){ alert('Indica quién recepciona la mercancía.'); return; }
  const proveedor = document.getElementById('albaranProveedor').value;
  const fecha = document.getElementById('albaranFecha').value || todayStr();
  const hora = document.getElementById('albaranHora').value || nowStr();
  const tempLlegada = document.getElementById('albaranTemp').value;
  const estadoEnvase = document.getElementById('albaranEnvase').value;
  let fotoId = null;
  if(recepcionFotoDataUrl){
    fotoId = uid();
    try{ await Store.set('foto:'+fotoId, recepcionFotoDataUrl); }catch(e){ console.error(e); fotoId=null; }
  }
  lineasValidas.forEach(l=>{
    DATA.recepcion.unshift({id:uid(), fecha, hora, proveedor, producto:l.producto, lote:l.lote, cantidad:l.cantidad||'', tempLlegada, estadoEnvase,
      caducidad:l.caducidad, aceptado:true, responsable, observaciones: l.cantidad?('Cantidad: '+l.cantidad):'', fotoId});
  });
  await saveModule('recepcion');
  const actualizados = [];
  for(const l of lineasValidas){
    const nombre = await registrarEntradaStock(l.producto, proveedor, l.cantidad);
    if(nombre) actualizados.push(nombre);
  }
  await saveConfig();
  // quitar de la cola el albarán ya guardado y pasar al siguiente, si hay más
  if(albaranQueue.length>0){
    albaranQueue.splice(albaranQueueIndex,1);
    if(albaranQueueIndex>=albaranQueue.length) albaranQueueIndex = Math.max(0, albaranQueue.length-1);
  }
  renderRecepTable();
  renderDashboard();
  if(albaranQueue.length>0){
    cargarFotoDeCola();
    const estado = document.getElementById('albaranEstado');
    if(estado) estado.textContent = `Albarán guardado. Quedan ${albaranQueue.length} foto(s) por procesar en la cola.`;
    document.getElementById('albaranResponsable').value = responsable;
    document.getElementById('albaranFecha').value = todayStr();
    document.getElementById('albaranHora').value = nowStr();
  } else {
    viewRecepcion();
  }
  if(actualizados.length){ alert('Stock actualizado en Materias primas para: '+actualizados.join(', ')); }
}

async function toggleNC(id){
  const rec = DATA.noconformidades.find(r=>r.id===id);
  rec.estado = rec.estado==='Abierta' ? 'Cerrada' : 'Abierta';
  if(rec.estado==='Cerrada' && !rec.fechaCierre) rec.fechaCierre = todayStr();
  await saveModule('noconformidades');
  renderNCTable();
  renderDashboard();
}
function renderNCTable(){
  const rows = DATA.noconformidades.map(r=>`<tr>
    <td class="mono">${fmtDate(r.fecha)}</td><td>${esc(r.plan)}</td><td>${esc(r.descripcion)}</td>

      <button class="btn danger small" onclick="removeRecord('noconformidades','${r.id}',renderNCTable)">Borrar</button>

  document.getElementById('nc-table').innerHTML = table(['Fecha','Plan','Descripción','Acción correctora','Estado','Cierre','Responsable',''], rows);
}

function viewMateriasPrimas(){
  document.getElementById('view-materiasprimas').innerHTML = `
    <div class="panel" id="panel-pedidos">
      <h2>${icon('truck')} Pedidos pendientes</h2>
      <p class="hint">Se genera solo cuando el stock actual de un producto cae igual o por debajo del stock mínimo. Agrupado por proveedor para enviarlo directo por WhatsApp al comercial.</p>
      <div id="pedidos-pendientes"></div>
    </div>

    <div class="panel">
      <h2>${icon('box')} Inventario</h2>
      <p class="hint">Lo que queda ahora mismo de cada materia prima, según las recepciones registradas y los lotes que habéis ido abriendo y cerrando. Solo consulta — para editar cantidades ve al catálogo de abajo.</p>
      <div class="filters">
        <label class="field"><span>Buscar</span><input type="text" id="inventarioSearch" placeholder="Ej: harina, sal, bolsas..."></label>
      </div>
      <div id="inventario-table"></div>
    </div>

    <div class="panel">
      <h2>${icon('box')} Catálogo y stock de materias primas</h2>
      <p class="hint">Cada vez que se registra una recepción (con foto de albarán o manual) el producto entra aquí solo, sumando la cantidad recibida — si es la primera vez que llega, se crea automáticamente. Al abrir un bote/cubo/saco en "Lotes" se descuenta 1 del stock. También puedes editar stock y proveedor a mano en cualquier momento.</p>
      <div id="catalogo-mp-table"></div>
      <button class="btn secondary small" id="add-mp-btn">+ Añadir materia prima</button>
      <button class="btn secondary small" id="autocompletar-proveedores-btn">Autocompletar proveedores según el listado</button>
      <button class="btn secondary small" id="recalcular-proveedores-btn">Actualizar proveedores desde recepciones</button>
    </div>

    <div class="panel">
      <h2>${icon('box')} Teléfonos de proveedores (WhatsApp)</h2>
      <p class="hint">Un teléfono por proveedor, no por producto — se usa para enviar los pedidos automáticos por WhatsApp cuando algún producto suyo cae por debajo de stock mínimo.</p>
      <div class="settings-list" id="telefonos-proveedores"></div>
    </div>

    <div class="panel">
      <h2>${icon('box')} Lotes abiertos actualmente</h2>
      <p class="hint">Un bote/cubo/saco abierto y todavía en uso. Ciérralo el día que se termine.</p>
      <div id="lotes-abiertos-table"></div>
    </div>

    <div class="panel">
      <h2>${icon('box')} Abrir nuevo lote</h2>
      <p class="hint">Elige el producto de la lista (solo aparecen los que tienen stock disponible). Si ya había un lote abierto para ese producto, se te ofrecerá cerrarlo con la fecha de hoy.</p>
      <form class="record-form" id="form-lotesmp">
        <label class="field wide"><span>Producto</span>
          <select name="producto" id="loteProductoSel" required>
            <option value="" disabled selected>Selecciona un producto…</option>
            ${CONFIG.materiasPrimas.filter(m=>m.stockActual>0).sort((a,b)=>a.nombre.localeCompare(b.nombre)).map(m=>`<option value="${esc(m.nombre)}">${esc(m.nombre)} (stock: ${m.stockActual} ${esc(m.unidad)})</option>`).join('')}
          </select>
        </label>
        <label class="field wide"><span>Lote</span>
          <span style="display:flex;gap:8px;flex-wrap:wrap;">
            <input type="text" name="lote" id="loteInputLote" required style="flex:1;min-width:160px;">
            <button class="btn secondary small" type="button" id="mismoLoteBtn" style="white-space:nowrap;" title="Rellena con el mismo número de lote que usasteis la última vez para este producto">Mismo lote (ML)</button>
          </span>
        </label>
        <label class="field"><span>Fecha apertura</span><input type="date" name="fechaApertura" id="loteFechaApertura" value="${todayStr()}" required></label>
        <label class="field"><span>Semana</span><input type="text" id="loteSemanaDisplay" value="S${getWeekNumber(todayStr())}" disabled></label>
        <div class="field wide" id="loteInfoProducto"></div>
        <div class="form-actions"><button class="btn" type="submit">Abrir lote</button></div>
      </form>
      ${CONFIG.materiasPrimas.filter(m=>m.stockActual>0).length===0 ? '<p class="hint">No hay ningún producto con stock disponible ahora mismo. Registra una recepción primero.</p>' : ''}
    </div>

    <div class="panel"><h2>${icon('box')} Histórico completo de lotes</h2><div id="lotesmp-table"></div></div>

    <div class="wheat-divider">${icon('box')}<span>Referencia</span></div>
    <div class="panel">
      <h2>${icon('box')} Proveedores y materias primas</h2>
      <p class="hint">Qué se le compra a cada proveedor (${TARIFARIO_DATA.length} artículos). Elige primero el proveedor y luego el producto.</p>
      <div class="filters">
        <label class="field"><span>Proveedor</span><select id="tarifProveedorSel"><option value="" disabled selected>Selecciona un proveedor…</option>${[...new Set(TARIFARIO_DATA.map(t=>t.proveedor))].filter(Boolean).sort().map(p=>`<option value="${esc(p)}">${esc(p)}</option>`).join('')}</select></label>
        <label class="field"><span>Producto</span><select id="tarifProductoSel" disabled><option value="">Elige primero un proveedor…</option></select></label>
      </div>
      <div id="tarifario-acciones"></div>
    </div>
    <div class="panel">
      <h2>${icon('box')} Comparador de precios entre proveedores</h2>
      <p class="hint">Busca un producto y compara lo que cuesta en cada proveedor, para elegir siempre la opción más barata en el pedido de los martes. El más económico de cada búsqueda se marca en verde.</p>
      <div class="filters">
        <label class="field"><span>Buscar producto</span><input type="text" id="comparadorSearch" placeholder="Ej: azúcar, harina, aceite girasol..."></label>
      </div>
      <div id="comparador-table"></div>
    </div>
    <div class="panel">
      <h2>${icon('box')} Fichas de alérgenos de materias primas</h2>
      <p class="hint">Resumen de las fichas técnicas de proveedores, para consultar rápido qué alérgenos declara cada ingrediente antes de usarlo.</p>
      <div class="filters">
        <label class="field"><span>Buscar</span><input type="text" id="mpFichaSearch" placeholder="Ej: gluten, avellana, Zeelandia..."></label>
      </div>
      <div id="fichasmp-table"></div>

async function agregarAlCatalogo(nombre, proveedor){
  const existe = CONFIG.materiasPrimas.find(m=>m.nombre.trim().toLowerCase()===nombre.trim().toLowerCase());
  if(existe){
    existe.proveedor = proveedor;
    alert(`"${nombre}" ya estaba en el catálogo. Proveedor actualizado a ${proveedor}.`);
  } else {
    CONFIG.materiasPrimas.push({nombre, categoria:'', proveedor, telefono:'', unidad:'unidades', stockMinimo:1, stockActual:0});
    alert(`"${nombre}" añadido al catálogo con proveedor ${proveedor}. Ajusta stock mínimo/actual y teléfono cuando puedas.`);
  }
  await saveConfig();
  renderCatalogoMP();
  renderPedidosPendientes();
}
async function recalcularProveedoresDesdeRecepciones(){
  let n = 0;
  CONFIG.materiasPrimas.forEach(m=>{
    const key = m.nombre.trim().toLowerCase();
    const candidatas = DATA.recepcion.filter(r=>{
      if(!r.proveedor || !r.proveedor.trim() || !r.producto) return false;
      const rk = r.producto.trim().toLowerCase();
      return rk===key || rk.includes(key) || key.includes(rk);
    }).sort((a,b)=> (b.fecha+(b.hora||'')).localeCompare(a.fecha+(a.hora||'')));
    if(candidatas.length){
      const nuevoProveedor = candidatas[0].proveedor.trim();
      if(m.proveedor!==nuevoProveedor){ m.proveedor = nuevoProveedor; n++; }
    }
  });
  await saveConfig();
  renderCatalogoMP();
  renderPedidosPendientes();
  renderTelefonosProveedores();
  alert(n>0 ? `Proveedor actualizado en ${n} producto(s) a partir del historial de recepciones.` : 'No se ha encontrado ninguna recepción que coincida con productos del catálogo, o ya estaban todos correctos.');
}
async function autocompletarProveedores(){
  let n = 0;
  CONFIG.materiasPrimas.forEach(m=>{
    if(m.proveedor && m.proveedor.trim()) return;
    const match = TARIFARIO_DATA.find(t=>t.descripcion.trim().toLowerCase()===m.nombre.trim().toLowerCase())
      || TARIFARIO_DATA.find(t=>t.descripcion.toLowerCase().includes(m.nombre.trim().toLowerCase()) && m.nombre.trim().length>4);
    if(match){ m.proveedor = match.proveedor; n++; }
  });
  await saveConfig();
  renderCatalogoMP();
  renderPedidosPendientes();
  renderTelefonosProveedores();
  alert(n>0 ? `Proveedor asignado a ${n} producto(s) del catálogo.` : 'No se ha encontrado ninguna coincidencia nueva en el tarifario.');
}

  });

        ${g.manual.map(p=>`<li>${esc(p.producto)} <span class="badge ok">añadido</span> <button class="btn secondary small" style="margin-left:6px;" onclick="compararProducto('${esc(p.producto).replace(/'/g,"\\'")}')">Comparar precio</button> <button class="btn danger small" style="margin-left:4px;" onclick="quitarDePedidoManual('${p.id}')">Quitar</button></li>`).join('')}

function enviarPedidoWhatsApp(proveedor){
  const auto = CONFIG.materiasPrimas.filter(m=>m.stockActual<=m.stockMinimo && (m.proveedor&&m.proveedor.trim()?m.proveedor.trim():'Sin proveedor asignado')===proveedor);
  const manual = (DATA.pedidosManual||[]).filter(p=>p.proveedor===proveedor);
  if(auto.length===0 && manual.length===0){ alert('No hay productos pendientes para este proveedor.'); return; }
  const telefono = (CONFIG.telefonosProveedores||{})[proveedor];
  if(!telefono){ alert('Añade el teléfono de WhatsApp de "'+proveedor+'" en la lista de "Teléfonos de proveedores" antes de enviar el pedido.'); return; }
  const digits = telefono.replace(/[^0-9]/g,'');
  const lineas = [...auto.map(m=>`- ${m.nombre}`), ...manual.map(p=>`- ${p.producto}`)];
  const mensaje = `Hola, os hacemos pedido desde ${CONFIG.empresa.nombre} (${CONFIG.empresa.obrador}):\n`
    + lineas.join('\n')
    + '\n¿Podéis confirmarnos disponibilidad y fecha de entrega? Gracias.';
  window.open(`https://wa.me/${digits}?text=${encodeURIComponent(mensaje)}`, '_blank');
}

/* ---- Lotes: abrir / cerrar ---- */
function getWeekNumber(dateStr){
  if(!dateStr) return '';
  const d = new Date(dateStr+'T00:00:00');
  if(isNaN(d)) return '';
  const target = new Date(d.valueOf());
  const dayNr = (d.getDay()+6)%7;
  target.setDate(target.getDate()-dayNr+3);
  const firstThursday = new Date(target.getFullYear(),0,4);
  const diff = target - firstThursday;
  return 1 + Math.round(diff/(7*24*3600*1000));
}
function cantidadRecepcion(r){
  let cant = parseFloat(String(r.cantidad||'').replace(',','.'));
  if(isFinite(cant) && cant>0) return cant;
  const m = /Cantidad:\s*([\d.,]+)/.exec(r.observaciones||'');
  if(m){ const v = parseFloat(m[1].replace(',','.')); if(isFinite(v)&&v>0) return v; }
  return 1;
}
function loteMasAntiguoDisponible(nombre){
  const key0 = nombre.trim().toLowerCase();
  const porLote = {};
  DATA.recepcion
    .filter(r=>r.producto.trim().toLowerCase()===key0 && r.lote && r.lote.trim())
    .forEach(r=>{
      const key = r.lote.trim().toLowerCase();
      const cant = cantidadRecepcion(r);
      if(!porLote[key]) porLote[key] = {lote:r.lote, cantidadRecibida:0, fecha:r.fecha, caducidad:r.caducidad, proveedor:r.proveedor};
      porLote[key].cantidadRecibida += cant;
      if(r.fecha < porLote[key].fecha){ porLote[key].fecha = r.fecha; porLote[key].caducidad = r.caducidad; }
    });
  const abiertosPorLote = {};
  DATA.lotesMP.filter(r=>r.producto.trim().toLowerCase()===key0).forEach(r=>{
    const key = r.lote.trim().toLowerCase();
    abiertosPorLote[key] = (abiertosPorLote[key]||0)+1;
  });
  const disponibles = Object.keys(porLote)
    .map(key=>({...porLote[key], abiertos: abiertosPorLote[key]||0}))
    .filter(l=>l.abiertos < l.cantidadRecibida)
    .sort((a,b)=>a.fecha.localeCompare(b.fecha));
  return disponibles.length ? disponibles[0] : null;
}

function mostrarInfoProductoLote(){

  const loteInput = document.getElementById('loteInputLote');
  if(!nombre){ info.innerHTML=''; return; }

  const abierto = DATA.lotesMP.find(r=>!r.fechaCierre && r.producto.trim().toLowerCase()===nombre.trim().toLowerCase());
  let html = `<p class="hint" style="margin:0;">Stock disponible: <strong>${m?m.stockActual:'—'} ${m?esc(m.unidad):''}</strong>${m&&m.proveedor?' · Proveedor: '+esc(m.proveedor):''}</p>`;

  }
  const antiguo = loteMasAntiguoDisponible(nombre);
  if(loteInput) loteInput.value = '';
  if(antiguo){

    html += `<p class="hint" style="margin:4px 0 0;color:var(--ok);">📦 Lote más antiguo recibido (usa este primero — FIFO): <strong>${esc(antiguo.lote)}</strong>, recibido el ${fmtDate(antiguo.fecha)}${antiguo.caducidad?', caduca el '+fmtDate(antiguo.caducidad):''}, proveedor ${esc(antiguo.proveedor)||'—'}. Quedan ${quedan} de ${antiguo.cantidadRecibida} unidad(es) por abrir de este lote.</p>`;

    html += `<p class="hint" style="margin:4px 0 0;">No hay ninguna recepción registrada con lote para este producto todavía; escribe el lote a mano.</p>`;

  info.innerHTML = html;
}
async function abrirLoteMP(producto, lote, fechaApertura){
  const abierto = DATA.lotesMP.find(r=>!r.fechaCierre && r.producto.trim().toLowerCase()===producto.trim().toLowerCase());
  if(abierto){
    if(confirm(`Ya hay un lote abierto para "${producto}" (lote ${abierto.lote}). ¿Cerrarlo hoy y abrir el nuevo?`)){
      abierto.fechaCierre = todayStr();
    } else {
      return;
    }
  }
  DATA.lotesMP.unshift({id:uid(), producto, lote, fechaApertura, fechaCierre:'', semana:getWeekNumber(fechaApertura)});
  await saveModule('lotesMP');
  const idx = CONFIG.materiasPrimas.findIndex(m=>m.nombre.trim().toLowerCase()===producto.trim().toLowerCase());
  if(idx>=0){ CONFIG.materiasPrimas[idx].stockActual = Math.max(0, CONFIG.materiasPrimas[idx].stockActual - 1); await saveConfig(); }
  viewMateriasPrimas();
  renderDashboard();
}
async function cerrarLoteMP(id){
  const rec = DATA.lotesMP.find(r=>r.id===id);
  if(!rec) return;
  rec.fechaCierre = todayStr();
  await saveModule('lotesMP');
  renderLotesAbiertos();
  renderLotesMPTable();
}

async function registrarEntradaStock(nombre, proveedor, cantidadStr){
  if(!nombre || !nombre.trim()) return null;
  let cantidad = parseFloat(String(cantidadStr).replace(',','.'));
  if(!isFinite(cantidad) || cantidad<=0) cantidad = 1;
  const idx = CONFIG.materiasPrimas.findIndex(m=>m.nombre.trim().toLowerCase()===nombre.trim().toLowerCase());
  if(idx>=0){
    CONFIG.materiasPrimas[idx].stockActual += cantidad;
    if(proveedor && proveedor.trim()) CONFIG.materiasPrimas[idx].proveedor = proveedor.trim();
    return CONFIG.materiasPrimas[idx].nombre;
  }
  CONFIG.materiasPrimas.push({nombre:nombre.trim(), categoria:'', proveedor:proveedor?proveedor.trim():'', telefono:'', unidad:'unidades', stockMinimo:1, stockActual:cantidad});
  return nombre.trim();
}

function flattenTemperaturas(desde, hasta){
  const out = [];
  Object.keys(DATA.temperaturas).sort().forEach(key=>{
    const [y,m] = key.split('-').map(Number);
    DATA.temperaturas[key].forEach(row=>{
      const fecha = key+'-'+String(row.day).padStart(2,'0');
      if(desde && fecha<desde) return;
      if(hasta && fecha>hasta) return;
      CONFIG.equipos.forEach(e=>{
        const v = row.valores[e.nombre];
        if(v===undefined || v==='') return;
        const estado = within(parseFloat(v), e.min, e.max) ? 'OK' : 'ALERTA';
        out.push({fecha, equipo:e.nombre, valor:v, estado, responsable:row.responsable, incidencia:row.incidencia});
      });
    });
  });
  return out;
}

  document.getElementById('view-informes').innerHTML = `

        <label class="field"><span>Módulo</span><select id="informeModulo">${opts}</select></label>

        <button class="btn secondary" id="informeCSV">Descargar CSV</button>
      </div>
      <div id="informe-table"></div>
    </div>
  `;
  const tempMeta = {label:'Temperaturas', headers:['Fecha','Equipo','Valor (°C)','Estado','Responsable','Incidencia'],
    row:r=>[fmtDate(r.fecha),r.equipo,r.valor,r.estado,r.responsable,r.incidencia||'']};
  const run = ()=>{
    const mod = document.getElementById('informeModulo').value;
    const desde = document.getElementById('informeDesde').value;
    const hasta = document.getElementById('informeHasta').value;
    const meta = mod==='temperaturas' ? tempMeta : MODULE_META[mod];
    const filtered = mod==='temperaturas' ? flattenTemperaturas(desde,hasta) : DATA[mod].filter(r=> (!desde || r.fecha>=desde) && (!hasta || r.fecha<=hasta) );
    const rows = filtered.map(r=>`<tr>${meta.row(r).map(c=>`<td>${esc(c)}</td>`).join('')}</tr>`);
    document.getElementById('informe-table').innerHTML = table(meta.headers, rows);
    document.getElementById('informeCSV').onclick = ()=>downloadCSV(meta, filtered, mod);
  };
  document.getElementById('informeFiltrar').addEventListener('click', run);
  run();
}
function downloadCSV(meta, rows, mod){
  const lines = [meta.headers.join(';')];
  rows.forEach(r=> lines.push(meta.row(r).map(v=>String(v??'').replace(/;/g,',')).join(';')));
  const blob = new Blob([lines.join('\n')], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `appcc-${mod}-${todayStr()}.csv`; a.click();
  URL.revokeObjectURL(url);
}

          <button class="btn small" id="saveApiKeyBtn" type="button">Guardar clave</button>
          <button class="btn danger small" id="clearApiKeyBtn" type="button">Quitar clave</button>
        </div>
        <p class="hint" id="apiKeyStatus">${getApiKey() ? 'Clave configurada ✓' : 'Todavía no hay ninguna clave configurada.'}</p>
      </div>
      ` : ''}
    </div>
    <div class="panel">
      <h2>${icon('gear')} Equipos de temperatura</h2>
      <div class="settings-list" id="cfg-equipos"></div>
      <button class="btn secondary small" id="add-equipo">+ Añadir equipo</button>
    </div>
    <div class="panel">
      <h2>${icon('gear')} Áreas y elementos de limpieza</h2>
      <p class="hint">Estructura por salas, tal y como aparece en vuestro plan de limpieza y desinfección.</p>
      <div id="cfg-zonas"></div>
      <button class="btn secondary small" id="add-area">+ Añadir área</button>
    </div>
    <div class="panel">
      <h2>${icon('gear')} Tiendas</h2>
      <p class="hint">Renombra cada una de las 7 tiendas para que coincidan con tus puntos de venta reales.</p>
      <div class="settings-list" id="cfg-tiendas"></div>
    </div>
    <div class="panel">
      <h2>${icon('gear')} Alérgenos controlados</h2>
      <div class="settings-list" id="cfg-alergenos"></div>
      <button class="btn secondary small" id="add-alergeno">+ Añadir alérgeno</button>
    </div>
    <div class="panel">
      <h2>${icon('gear')} Planes para incidencias</h2>
      <div class="settings-list" id="cfg-planes"></div>
      <button class="btn secondary small" id="add-plan">+ Añadir plan</button>
    </div>
    <div class="panel">
      <h2>${icon('gear')} Guardar cambios</h2>
      <button class="btn" id="save-cfg">Guardar ajustes</button>
    </div>
    <div class="panel">
      <h2>${icon('box')} Copia de seguridad</h2>
      <p class="hint">${HAS_CLAUDE_STORAGE ? 'Aunque los datos ya se comparten desde Claude.ai, es buena idea guardar una copia de vez en cuando.' : 'Como los datos viven solo en esta tablet, descarga una copia periódicamente (por ejemplo, cada semana) para no perder el histórico si se resetea el dispositivo o se borra el navegador.'}</p>
      <div class="filters">
        <button class="btn secondary small" id="export-backup-btn" type="button">Descargar copia de seguridad</button>
        <label class="field"><span>Restaurar desde archivo</span><input type="file" id="import-backup-file" accept=".json"></label>
      </div>
    </div>
    <div class="panel">
      <h2>${icon('box')} Sincronización con Google Drive</h2>
      <p class="hint">Para ver los mismos datos desde varios ordenadores/tablets, sube y descarga aquí una copia guardada en tu Google Drive a través de tu Apps Script. <strong>Solo funciona si esta app está alojada en una dirección web real (https://...), no si la abres como archivo local.</strong></p>
      <div class="filters">
        <label class="field"><span>URL de tu Apps Script</span><input type="text" id="appScriptUrlInput" value="${esc(getAppsScriptUrl())}" placeholder="https://script.google.com/macros/s/AKfycb.../exec" style="min-width:380px;"></label>
        <button class="btn small" id="saveAppScriptUrlBtn" type="button">Guardar URL</button>
      </div>
      <div class="filters">
        <button class="btn small" id="uploadDriveBtn" type="button">Subir copia a Drive</button>
        <button class="btn small" id="downloadDriveBtn" type="button">Descargar copia de Drive</button>
      </div>
      <p class="hint" id="driveStatus">${getAppsScriptUrl() ? 'URL de Apps Script configurada ✓' : 'Todavía no hay ninguna URL configurada.'}</p>
      <p class="hint" id="driveSyncEstado"></p>
    </div>
    <div class="panel">
      <h2>${icon('alert')} Zona de riesgo</h2>
      <p class="hint">Elimina todos los registros guardados de todos los módulos. Los ajustes (empresa, equipos, zonas, tiendas, alérgenos, planes) no se ven afectados.</p>
      <button class="btn danger" id="reset-data">Vaciar todos los registros</button>
    </div>
    <div class="panel">
      <h2>${icon('box')} Empezar de cero</h2>
      <p class="hint">Pensado para el primer día de uso real: vacía todos los registros (temperaturas, limpieza, recepciones, lotes, incidencias...) <strong>y además pone el stock de todas las materias primas del catálogo a 0</strong>, para empezar a registrar recepciones, apertura de lotes e inventario desde cero. El catálogo (nombres, proveedores, stock mínimo) se conserva, solo se vacía la cantidad actual.</p>
      <button class="btn danger" id="reset-todo-btn">Vaciar registros y poner el stock a 0</button>
    </div>
    <div class="panel">
      <h2>${icon('box')} Vaciar también el catálogo de materias primas</h2>
      <p class="hint">Usa esto si quieres quitar de golpe los productos de ejemplo que trae la app de partida (Sal Salinas del Odiel, Bolsas papel tiendas, Cápsula magdalena...) para no verlos en "Pedidos pendientes" sin haberlos recibido de verdad. Borra por completo el catálogo (y los teléfonos de proveedores guardados) — <strong>no borra los registros de temperaturas, limpieza, etc., solo el catálogo de materias primas y stock</strong>. En cuanto registréis la primera recepción real, la app creará los productos correctos automáticamente.</p>
      <button class="btn danger" id="reset-catalogo-btn">Vaciar catálogo de materias primas</button>
    </div>
  `;
  renderEquiposCfg(); renderZonasCfg(); renderTiendasCfg(); renderAlergenosCfg(); renderPlanesCfg();
  document.getElementById('add-equipo').addEventListener('click',()=>{ CONFIG.equipos.push({nombre:'Nuevo equipo',min:0,max:4}); renderEquiposCfg(); });
  document.getElementById('add-area').addEventListener('click',()=>{ CONFIG.zonasLimpieza.push({area:'Nueva área',elementos:['Nuevo elemento']}); renderZonasCfg(); });
  document.getElementById('add-alergeno').addEventListener('click',()=>{ CONFIG.alergenos.push('Nuevo alérgeno'); renderAlergenosCfg(); });
  document.getElementById('add-plan').addEventListener('click',()=>{ CONFIG.planes.push('Nuevo plan'); renderPlanesCfg(); });
  document.getElementById('save-cfg').addEventListener('click', async ()=>{
    await saveConfig();
    updateSidebarFoot();
    alert('Ajustes guardados correctamente.');
  });
  if(!HAS_CLAUDE_STORAGE){
    const providerSel = document.getElementById('aiProviderSel');
    providerSel.value = getAIProvider();
    const syncBlocks = ()=>{
      document.getElementById('geminiKeyBlock').style.display = providerSel.value==='gemini' ? 'block' : 'none';
      document.getElementById('anthropicKeyBlock').style.display = providerSel.value==='anthropic' ? 'block' : 'none';
    };
    syncBlocks();
    providerSel.addEventListener('change', ()=>{ setAIProvider(providerSel.value); syncBlocks(); });
    document.getElementById('toggleApiKeyBtn').addEventListener('click', ()=>{
      const inp = document.getElementById('apiKeyInput');
      inp.type = inp.type==='password' ? 'text' : 'password';
    });
    document.getElementById('saveApiKeyBtn').addEventListener('click', ()=>{
      setApiKey(document.getElementById('apiKeyInput').value.trim());
      document.getElementById('apiKeyStatus').textContent = getApiKey() ? 'Clave configurada ✓' : 'Todavía no hay ninguna clave configurada.';
      alert('Clave guardada en este dispositivo.');
    });
    document.getElementById('clearApiKeyBtn').addEventListener('click', ()=>{
      if(!confirm('¿Quitar la clave de Anthropic guardada en este dispositivo?')) return;
      clearApiKey();
      document.getElementById('apiKeyInput').value = '';
      document.getElementById('apiKeyStatus').textContent = 'Todavía no hay ninguna clave configurada.';
    });
    document.getElementById('toggleGeminiKeyBtn').addEventListener('click', ()=>{
      const inp = document.getElementById('geminiKeyInput');
      inp.type = inp.type==='password' ? 'text' : 'password';
    });
    document.getElementById('saveGeminiKeyBtn').addEventListener('click', ()=>{
      setGeminiKey(document.getElementById('geminiKeyInput').value.trim());
      document.getElementById('geminiKeyStatus').textContent = getGeminiKey() ? 'Clave configurada ✓' : 'Todavía no hay ninguna clave configurada.';
      alert('Clave guardada en este dispositivo.');
    });
    document.getElementById('clearGeminiKeyBtn').addEventListener('click', ()=>{
      if(!confirm('¿Quitar la clave de Gemini guardada en este dispositivo?')) return;
      clearGeminiKey();
      document.getElementById('geminiKeyInput').value = '';
      document.getElementById('geminiKeyStatus').textContent = 'Todavía no hay ninguna clave configurada.';
    });
  }
  document.getElementById('export-backup-btn').addEventListener('click', exportarBackup);
  document.getElementById('saveAppScriptUrlBtn').addEventListener('click', ()=>{
    setAppsScriptUrl(document.getElementById('appScriptUrlInput').value.trim());
    document.getElementById('driveStatus').textContent = getAppsScriptUrl() ? 'URL de Apps Script configurada ✓' : 'Todavía no hay ninguna URL configurada.';
    alert('URL guardada. Ya puedes subir/descargar copia.');
  });
  document.getElementById('uploadDriveBtn').addEventListener('click', subirBackupADrive);
  document.getElementById('downloadDriveBtn').addEventListener('click', descargarBackupDeDrive);
  document.getElementById('import-backup-file').addEventListener('change', e=>{
    const file = e.target.files[0];
    if(file) importarBackupFile(file);
  });
  document.getElementById('reset-data').addEventListener('click', async ()=>{
    if(!confirm('Esto eliminará TODOS los registros de todos los módulos. ¿Continuar?')) return;
    for(const mod of Object.keys(DATA)){ DATA[mod]= (mod==='temperaturas'?{}:[]); await saveModule(mod); }
    alert('Registros eliminados.');
    renderDashboard();
  });
  document.getElementById('reset-todo-btn').addEventListener('click', async ()=>{
    if(!confirm('Esto eliminará TODOS los registros de todos los módulos Y pondrá el stock de todas las materias primas a 0. ¿Continuar? Esta acción no se puede deshacer.')) return;
    for(const mod of Object.keys(DATA)){ DATA[mod]= (mod==='temperaturas'?{}:[]); await saveModule(mod); }
    CONFIG.materiasPrimas.forEach(m=>{ m.stockActual = 0; });
    await saveConfig();
    alert('Todo listo: registros vaciados y stock a 0. Ya puedes empezar a registrar recepciones reales.');
    updateSidebarFoot();
    renderDashboard();
  });
  document.getElementById('reset-catalogo-btn').addEventListener('click', async ()=>{
    if(!confirm('Esto borrará POR COMPLETO el catálogo de materias primas (todos los productos, stock y teléfonos de proveedores). No afecta a otros registros. ¿Continuar? Esta acción no se puede deshacer.')) return;
    CONFIG.materiasPrimas = [];
    CONFIG.telefonosProveedores = {};
    await saveConfig();
    alert('Catálogo de materias primas vaciado. Se irá rellenando solo con las próximas recepciones reales.');
    renderDashboard();
  });
}
function renderEquiposCfg(){
  document.getElementById('cfg-equipos').innerHTML = CONFIG.equipos.map((e,i)=>`
    <div class="settings-row">
      <input type="text" value="${esc(e.nombre)}" onchange="CONFIG.equipos[${i}].nombre=this.value">
      <input type="number" class="small" value="${e.min}" onchange="CONFIG.equipos[${i}].min=parseFloat(this.value)" title="Mínimo">
      <input type="number" class="small" value="${e.max}" onchange="CONFIG.equipos[${i}].max=parseFloat(this.value)" title="Máximo">
      <button class="btn danger small" onclick="CONFIG.equipos.splice(${i},1);renderEquiposCfg();">Quitar</button>
    </div>`).join('');
}
function renderZonasCfg(){
  document.getElementById('cfg-zonas').innerHTML = CONFIG.zonasLimpieza.map((z,ai)=>`
    <div class="panel" style="background:#FBF6EC;margin-bottom:12px;padding:14px 16px;">
      <div class="settings-row" style="margin-bottom:10px;">
        <input type="text" value="${esc(z.area)}" onchange="CONFIG.zonasLimpieza[${ai}].area=this.value" style="font-weight:700;">
        <button class="btn danger small" onclick="CONFIG.zonasLimpieza.splice(${ai},1);renderZonasCfg();">Quitar área</button>
      </div>
      <div class="settings-list">
        ${z.elementos.map((el,ei)=>`
          <div class="settings-row">
            <input type="text" value="${esc(el)}" onchange="CONFIG.zonasLimpieza[${ai}].elementos[${ei}]=this.value">
            <button class="btn danger small" onclick="CONFIG.zonasLimpieza[${ai}].elementos.splice(${ei},1);renderZonasCfg();">Quitar</button>
          </div>`).join('')}
      </div>
      <button class="btn secondary small" onclick="CONFIG.zonasLimpieza[${ai}].elementos.push('Nuevo elemento');renderZonasCfg();">+ Añadir elemento</button>
    </div>`).join('');
}
function renderPlanesCfg(){
  document.getElementById('cfg-planes').innerHTML = CONFIG.planes.map((p,i)=>`
    <div class="settings-row">
      <input type="text" value="${esc(p)}" onchange="CONFIG.planes[${i}]=this.value">
      <button class="btn danger small" onclick="CONFIG.planes.splice(${i},1);renderPlanesCfg();">Quitar</button>
    </div>`).join('');
}
function renderTiendasCfg(){
  document.getElementById('cfg-tiendas').innerHTML = CONFIG.tiendas.map((t,i)=>`
    <div class="settings-row">
      <input type="text" value="${esc(t)}" onchange="CONFIG.tiendas[${i}]=this.value">
    </div>`).join('');
}
function renderAlergenosCfg(){
  document.getElementById('cfg-alergenos').innerHTML = CONFIG.alergenos.map((a,i)=>`
    <div class="settings-row">
      <input type="text" value="${esc(a)}" onchange="CONFIG.alergenos[${i}]=this.value">
      <button class="btn danger small" onclick="CONFIG.alergenos.splice(${i},1);renderAlergenosCfg();">Quitar</button>
    </div>`).join('');
}

/* ================= DASHBOARD ================= */
function renderDashboard(){
  const el = document.getElementById('view-dashboard');
  if(!el) return;
  const today = todayStr();
  const tempAlertas = temperaturasAlertasHoy();
  const tempRegistradas = temperaturasRegistradasHoy();
  const limpiezaHoy = DATA.limpieza.filter(r=>r.fecha===today);
  const totalElementos = CONFIG.zonasLimpieza.reduce((sum,z)=>sum+z.elementos.length,0);
  const elementosCompletados = new Set(limpiezaHoy.filter(r=>r.realizado).map(r=>r.area+'|'+r.elemento)).size;
  const aguaHoy = DATA.agua.filter(r=>r.fecha===today);
  const aguaRevisar = aguaHoy.filter(r=>r.estado!=='OK').length;
  const recepHoy = DATA.recepcion.filter(r=>r.fecha===today);
  const recepRechazadas = recepHoy.filter(r=>!r.aceptado).length;
  const alergHoy = DATA.alergenos.filter(r=>r.fecha===today).length + DATA.alergenosTienda.filter(r=>r.fecha===today).length;
  const aceiteCambiar = DATA.aceite.filter(r=>r.fecha===today && r.estado==='CAMBIAR').length;
  const trazaHoy = DATA.trazabilidad.filter(r=>r.fecha===today);
  const mantPendientes = DATA.mantenimiento.filter(r=>!r.resuelto).length;
  const ncAbiertas = DATA.noconformidades.filter(r=>r.estado==='Abierta').length;
  const pedidosPendientes = CONFIG.materiasPrimas.filter(m=>m.stockActual<=m.stockMinimo).length;

  const critico = tempAlertas>0 || recepRechazadas>0 || ncAbiertas>0 || aguaRevisar>0 || aceiteCambiar>0;

  el.innerHTML = `
    <div class="dash-hero">
      <div>
        <h2>${esc(CONFIG.empresa.nombre)}</h2>
        <p>Resumen de autocontrol APPCC de hoy, ${fmtDate(today)}. ${esc(CONFIG.empresa.obrador)} · Reg. sanitario ${esc(CONFIG.empresa.registroSanitario)}. Reparto a ${CONFIG.tiendas.length} tiendas.</p>
      </div>
      <div class="stamp ${critico?'danger':'ok'}">${critico?'Revisar':'Controlado'}</div>
    </div>

    <div class="grid-cards">
      <div class="card">
        <div class="card-top">${icon('temp')}<span class="badge ${tempAlertas>0?'danger':'ok'}">${tempAlertas>0?'Alerta':'OK'}</span></div>
        <h3>Temperaturas</h3><div class="metric mono">${tempRegistradas}/${CONFIG.equipos.length}</div>
        <div class="sub">${tempAlertas} equipos fuera de rango hoy</div>
      </div>
      <div class="card">
        <div class="card-top">${icon('clean')}<span class="badge ${elementosCompletados>=totalElementos?'ok':'warn'}">${elementosCompletados}/${totalElementos}</span></div>
        <h3>Limpieza</h3><div class="metric mono">${limpiezaHoy.length}</div>
        <div class="sub">Elementos con tarea registrada hoy</div>
      </div>
      <div class="card">
        <div class="card-top">${icon('water')}<span class="badge ${aguaRevisar>0?'danger':'ok'}">${aguaRevisar>0?'Revisar':'OK'}</span></div>
        <h3>Control de agua</h3><div class="metric mono">${aguaHoy.length}</div>
        <div class="sub">Controles registrados hoy</div>
      </div>
      <div class="card">
        <div class="card-top">${icon('truck')}<span class="badge ${recepRechazadas>0?'danger':'ok'}">${recepRechazadas>0?'Rechazos':'OK'}</span></div>
        <h3>Recepciones</h3><div class="metric mono">${recepHoy.length}</div>
        <div class="sub">${recepRechazadas} rechazadas hoy</div>
      </div>
      <div class="card">
        <div class="card-top">${icon('wheat')}<span class="badge ok">OK</span></div>
        <h3>Alérgenos</h3><div class="metric mono">${alergHoy}</div>
        <div class="sub">Registros de hoy (lote + tienda)</div>
      </div>
      <div class="card">
        <div class="card-top">${icon('oil')}<span class="badge ${aceiteCambiar>0?'danger':'ok'}">${aceiteCambiar>0?'Cambiar':'OK'}</span></div>
        <h3>Aceite de fritura</h3><div class="metric mono">${DATA.aceite.filter(r=>r.fecha===today).length}</div>
        <div class="sub">${aceiteCambiar} con compuestos polares altos</div>
      </div>
      <div class="card">
        <div class="card-top">${icon('route')}<span class="badge ok">OK</span></div>
        <h3>Trazabilidad</h3><div class="metric mono">${trazaHoy.length}</div>
        <div class="sub">Lotes producidos hoy</div>
      </div>
      <div class="card" style="cursor:pointer" onclick="showView('materiasprimas')">
        <div class="card-top">${icon('box')}<span class="badge ${pedidosPendientes>0?'danger':'ok'}">${pedidosPendientes>0?'Pedir':'OK'}</span></div>
        <h3>Materias primas</h3><div class="metric mono">${pedidosPendientes}</div>
        <div class="sub">Productos por debajo de stock mínimo</div>
      </div>
      <div class="card">
        <div class="card-top">${icon('wrench')}<span class="badge ${mantPendientes>0?'warn':'ok'}">${mantPendientes>0?'Pendiente':'OK'}</span></div>
        <h3>Mantenimiento / Plagas</h3><div class="metric mono">${mantPendientes}</div>
        <div class="sub">Partes pendientes de resolver</div>
      </div>
      <div class="card">
        <div class="card-top">${icon('alert')}<span class="badge ${ncAbiertas>0?'danger':'ok'}">${ncAbiertas>0?'Abiertas':'OK'}</span></div>
        <h3>Incidencias</h3><div class="metric mono">${ncAbiertas}</div>
        <div class="sub">Incidencias abiertas en total</div>
      </div>
    </div>

    <div class="wheat-divider">${icon('wheat')}<span>Acceso rápido</span></div>
    <div class="grid-cards">
      ${VIEWS.filter(v=>!['dashboard','informes','ajustes'].includes(v.id)).map(v=>`
        <div class="card" style="cursor:pointer" onclick="showView('${v.id}')">
          <div class="card-top">${icon(v.icon)}</div>
          <h3>${v.label}</h3><div class="sub">Añadir o consultar registros</div>
        </div>`).join('')}
    </div>
  `;
}
function updateSidebarFoot(){
  const foot = document.getElementById('sidebarFoot');
  if(foot) foot.innerHTML = `${esc(CONFIG.empresa.nombre)}<br>${esc(CONFIG.empresa.obrador)}<br>Reg. San. ${esc(CONFIG.empresa.registroSanitario)}`;
}

/* ---------- RENDERERS MAP & BOOT ---------- */
const RENDERERS = {
  dashboard:renderDashboard, temperaturas:viewTemperaturas, limpieza:viewLimpieza, agua:viewAgua,
  recepcion:viewRecepcion, alergenos:viewAlergenos, aceite:viewAceite, trazabilidad:viewTrazabilidad,
  materiasprimas:viewMateriasPrimas,
  mantenimiento:viewMantenimiento, noconformidades:viewNoConformidades, listeria:viewListeria,
  informes:viewInformes, ajustes:viewAjustes
};

function buildViewsSkeleton(){
  const content = document.getElementById('content');
  content.innerHTML = VIEWS.map(v=>`<div class="view" id="view-${v.id}"></div>`).join('');
}

async function boot(){
  document.getElementById('topDate').textContent = new Date().toLocaleDateString('es-ES',{weekday:'long',year:'numeric',month:'long',day:'numeric'});
  renderNav();
  buildViewsSkeleton();
  await loadAll();
  updateSidebarFoot();
  showView('dashboard');
  document.querySelector('.navitem[data-view="dashboard"]').classList.add('active');
  document.getElementById('view-dashboard').classList.add('active');
}
boot();
</script>
</body>
</html>
